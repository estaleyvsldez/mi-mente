<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;width:540px;height:960px;overflow:hidden}svg{display:block}</style></head>
<body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" width="540" height="960"></svg>
<script>
// =====================================================================
//  LO QUE STANLEY NO SABÍA · Episodio 1: "El Motor Parqueado" (120 s)
//  window.setTime(t) dibuja el segundo t.
// =====================================================================
const S=document.getElementById('s');
const F="'DejaVu Sans','Noto Color Emoji',sans-serif";
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=x=>{x=clamp(x);return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;};
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
const G=(id,a,b,v=1)=>`<linearGradient id="${id}" x1="0" y1="0" x2="${v?0:1}" y2="${v?1:0}"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
const RG=(id,a,b,c)=>`<radialGradient id="${id}" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="${a}"/><stop offset=".7" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></radialGradient>`;

const DEFS=`<defs>
${RG('skS','#eab894','#cf946a','#b07650')}${RG('skY','#ffe0c4','#f0b98e','#d89870')}${RG('skK','#b97a50','#9a5e38','#7a4426')}${RG('skB','#d89a6a','#b97a4c','#94603a')}${RG('skC','#f6caa4','#e0a880','#c08860')}
<radialGradient id="cheek" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff7f96" stop-opacity=".55"/><stop offset="1" stop-color="#ff7f96" stop-opacity="0"/></radialGradient>
<radialGradient id="shd" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<radialGradient id="glowY" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".8"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/></radialGradient>
<radialGradient id="glowP" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#bfe4ff" stop-opacity=".9"/><stop offset="1" stop-color="#bfe4ff" stop-opacity="0"/></radialGradient>
${G('gold','#fff0a0','#d9a21a')}${G('silver','#ffffff','#9aa4b4')}${G('cap','#ff4a4a','#b81c2c')}${G('moto','#ff4040','#a01020')}
${G('night','#0d0b24','#2c2058')}${G('jean','#5a86c8','#2f5490')}
${G('iS','#7a4a2a','#1a0a04')}${G('iY','#c08850','#4a2410')}${G('iK','#5a3a24','#140804')}${G('iB','#6a4020','#1a0a04')}
<filter id="ds" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".3"/></filter>
<filter id="bl"><feGaussianBlur stdDeviation="5"/></filter>
<filter id="bl2"><feGaussianBlur stdDeviation="2"/></filter>
</defs>`;

// ---------------------------------------------------------------- personajes
const CAST={
  stanley:{sk:'skS',iris:'iS',hair:'fade',stud:true,chain:'silver',top:'#f6f6f6',pants:'#2a2a34',shoe:'#fff',mustache:true},
  yokasta:{sk:'skY',iris:'iY',hair:'curly',hoops:true,lashes:true,top:'#ff8fc4',pants:'#ff8fc4',shoe:'#fff',nails:true},
  brayan:{sk:'skB',iris:'iB',hair:'cap',chain:'gold',stud:true,top:'#fafafa',tank:true,pants:'url(#jean)',shoe:'#fff',tattoo:true},
  kiara:{sk:'skK',iris:'iK',hair:'braids',hoops:true,lashes:true,top:'#8a6aff',pants:'url(#jean)',shoe:'#fff',shades:true},
  client:{sk:'skC',iris:'iB',hair:'short',top:'#4a7ad0',pants:'#333',shoe:'#222'}
};

function eye(cx,cy,iris,type,lashes,t,seed){
  const blink=(type==='normal'||type==='teary')&&((t+seed)%3.6)<.12;
  if(blink||type==='closed') return `<path d="M${cx-26},${cy+2} Q${cx},${cy-16} ${cx+26},${cy+2}" stroke="#1a0a04" stroke-width="7" fill="none" stroke-linecap="round"/>`;
  if(type==='wide') return `<ellipse cx="${cx}" cy="${cy}" rx="31" ry="38" fill="#fff" stroke="#1a0a04" stroke-width="4"/><circle cx="${cx}" cy="${cy+2}" r="9" fill="#0a0402"/><circle cx="${cx-3}" cy="${cy-2}" r="3" fill="#fff"/>`;
  let g=`<ellipse cx="${cx}" cy="${cy}" rx="30" ry="36" fill="#fff"/>
  <ellipse cx="${cx}" cy="${cy+4}" rx="26" ry="32" fill="url(#${iris})"/>
  <ellipse cx="${cx}" cy="${cy+7}" rx="13" ry="16" fill="#0a0402"/>
  <ellipse cx="${cx-10}" cy="${cy-10}" rx="11" ry="13" fill="#fff"/><circle cx="${cx+11}" cy="${cy+15}" r="5.5" fill="#fff"/>
  <path d="M${cx-30},${cy-12} Q${cx},${cy-46} ${cx+30},${cy-12}" stroke="#1a0a04" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  if(lashes) g+=`<path d="M${cx+24},${cy-24} l14,-12 M${cx+29},${cy-14} l16,-6" stroke="#1a0a04" stroke-width="5" stroke-linecap="round"/>`;
  if(type==='teary') g+=`<path d="M${cx-24},${cy+20} Q${cx},${cy+34} ${cx+24},${cy+20}" stroke="#9adcff" stroke-width="6" fill="none"/>`;
  return g;
}
function mouth(m,t){
  const y=58;
  switch(m){
    case 'smile':return `<path d="M-30,${y-4} Q0,${y+22} 30,${y-4}" stroke="#5a1a10" stroke-width="7" fill="none" stroke-linecap="round"/>`;
    case 'grin':return `<path d="M-32,${y-6} Q0,${y-2} 32,${y-6} Q26,${y+30} 0,${y+30} Q-26,${y+30} -32,${y-6} Z" fill="#8a1a2a"/><path d="M-26,${y-4} Q0,${y} 26,${y-4} L24,${y+6} Q0,${y+10} -24,${y+6} Z" fill="#fff"/><ellipse cx="0" cy="${y+22}" rx="12" ry="6" fill="#ff7f8f"/>`;
    case 'open':return `<ellipse cx="0" cy="${y+6}" rx="20" ry="18" fill="#8a1a2a"/><ellipse cx="0" cy="${y+15}" rx="11" ry="6" fill="#ff7f8f"/>`;
    case 'o':return `<ellipse cx="0" cy="${y+8}" rx="15" ry="20" fill="#5a1020"/>`;
    case 'flat':return `<path d="M-22,${y+4} L22,${y+4}" stroke="#5a1a10" stroke-width="7" stroke-linecap="round"/>`;
    case 'frown':return `<path d="M-24,${y+14} Q0,${y-6} 24,${y+14}" stroke="#5a1a10" stroke-width="7" fill="none" stroke-linecap="round"/>`;
    case 'wobble':{const w=Math.sin(t*22)*3;return `<path d="M-30,${y+6} q7,${-9+w} 15,0 q7,${9-w} 15,0 q7,${-9+w} 15,0 q7,${9-w} 15,0" stroke="#5a1a10" stroke-width="6" fill="none" stroke-linecap="round"/>`;}
    case 'smirk':return `<path d="M-30,${y+4} Q0,${y+18} 34,${y-8}" stroke="#5a1a10" stroke-width="7" fill="none" stroke-linecap="round"/>`;
  }
  return '';
}
const EXPR={
  happy:{e:'normal',m:'smile',b:'n'}, talk:{e:'normal',m:'smile',b:'n',talk:1}, grin:{e:'normal',m:'grin',b:'n'},
  wink:{e:'normal',e2:'closed',m:'grin',b:'n'}, shock:{e:'wide',m:'o',b:'up'}, nervous:{e:'normal',m:'wobble',b:'sad',sweat:1},
  nervousTalk:{e:'normal',m:'wobble',b:'sad',sweat:1,talk:1}, sad:{e:'teary',m:'frown',b:'sad'}, sadTalk:{e:'teary',m:'flat',b:'sad',talk:1},
  serious:{e:'normal',m:'flat',b:'angry'}, seriousTalk:{e:'normal',m:'flat',b:'angry',talk:1}, shockTalk:{e:'wide',m:'o',b:'up',talk:1,sweat:1},
};
const hand=(x,y,sk)=>`<circle cx="${x}" cy="${y}" r="24" fill="url(#${sk})"/><circle cx="${x-7}" cy="${y-8}" r="7" fill="#fff" opacity=".25"/>`;
const hoop=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="url(#gold)" stroke-width="7"/>`;
const stud=(x,y)=>`<g transform="translate(${x},${y})"><path d="M0,-11 L8,0 L0,11 L-8,0 Z" fill="#e6f8ff" stroke="#8acfff" stroke-width="2"/></g>`;

function arm(side,pose,c,t){
  // side: -1 izquierda, 1 derecha. Devuelve [svg brazo, svg mano] relativo al cuerpo
  const top=c.tank?c.sk:'top';
  const sleeve=c.tank?`url(#${c.sk})`:c.top;
  const sx=side*86, sy=90;
  let ex,ey;
  switch(pose){
    case 'down': ex=side*104; ey=180; break;
    case 'front': ex=side*46; ey=150; break;
    case 'ear': ex=side*150; ey=-110; break;
    case 'up': ex=side*150; ey=0; break;
    case 'knock': ex=side*(140+Math.max(0,Math.sin(t*14))*24); ey=-10; break;
    case 'hip': ex=side*96; ey=150; break;
    case 'behind': ex=side*70; ey=170; break;
    case 'clip': ex=side*150; ey=-30+Math.sin(t*10)*10; break;
    default: ex=side*104; ey=180;
  }
  const mx=(sx+ex)/2+side*30, my=(sy+ey)/2+10;
  let a=`<path d="M${sx},${sy} Q${mx},${my} ${ex},${ey}" stroke="${sleeve}" stroke-width="44" stroke-linecap="round" fill="none"/>`;
  if(c.tattoo&&side===1) a+=`<path d="M${sx+side*16},${sy+20} Q${mx},${my} ${ex-side*10},${ey-10}" stroke="#1a2a5a" stroke-width="10" stroke-dasharray="6 6" opacity=".55" fill="none"/>`;
  let h=pose==='behind'?'':hand(ex,ey,c.sk);
  if(c.nails&&pose!=='behind') for(let i=0;i<3;i++) h+=`<ellipse cx="${ex-10+i*10}" cy="${ey-22}" rx="4" ry="8" fill="#ff2a7a"/>`;
  return {a,h,ex,ey};
}

function person(name,o){
  const c=Object.assign({},CAST[name]); const t=o.t||0; const ex=EXPR[o.expr||'happy'];
  const bob=(o.still?0:Math.sin(t*2.6+(o.x||0)*.01)*4);
  let g=`<g transform="translate(${o.x},${o.y-(o.shift===undefined?60:o.shift)}) scale(${(o.flip?-1:1)*o.s},${o.s})">`;
  g+=`<ellipse cx="0" cy="250" rx="140" ry="22" fill="url(#shd)"/>`;
  g+=`<g transform="translate(0,${bob})" filter="url(#ds)">`;
  // trenzas detrás
  if(c.hair==='braids') for(let sd of [-1,1]) for(let i=0;i<3;i++) g+=`<path d="M${sd*(118+i*14)},-120 Q${sd*(150+i*14)},40 ${sd*(120+i*12)},200" stroke="${i%2?'#2a140a':'#1a0a04'}" stroke-width="20" fill="none" stroke-linecap="round" stroke-dasharray="18 4"/>`;
  if(c.hair==='curly'){ for(let i=0;i<14;i++){const a=Math.PI*(.05+i/13*.9);g+=`<circle cx="${Math.cos(a)*-170}" cy="${-150+Math.sin(a)*200}" r="${42}" fill="#5a2a14"/>`;} }
  // brazos de atrás
  const L=arm(-1,o.armL||'down',c,t), R=arm(1,o.armR||'down',c,t);
  if((o.armL||'down')==='behind') g+=L.a;
  if((o.armR||'down')==='behind') g+=R.a;
  // piernas y zapatos
  g+=`<path d="M-80,170 L80,170 L84,236 L6,236 L0,206 L-6,236 L-84,236 Z" fill="${c.pants}"/>`;
  if(name==='brayan'||name==='kiara') g+=`<rect x="-84" y="160" width="168" height="18" fill="#fff"/><path d="M-84,169 L84,169" stroke="${name==='brayan'?'#e02a3a':'#ff6aa8'}" stroke-width="5" stroke-dasharray="12 8"/>`;
  g+=`<ellipse cx="-44" cy="244" rx="40" ry="17" fill="${c.shoe}"/><ellipse cx="44" cy="244" rx="40" ry="17" fill="${c.shoe}"/><path d="M-64,242 l30,-6 M26,236 l30,6" stroke="#e02a3a" stroke-width="5"/>`;
  // torso
  g+=`<path d="M-92,${name==='brayan'||name==='kiara'?165:200} Q-108,48 0,40 Q108,48 92,${name==='brayan'||name==='kiara'?165:200} Z" fill="${c.top}"/>`;
  if(c.tank) g+=`<path d="M-50,44 Q0,96 50,44" stroke="url(#${c.sk})" stroke-width="34" fill="none"/><path d="M-96,60 L-70,50 L-74,120 Z M96,60 L70,50 L74,120 Z" fill="url(#${c.sk})"/>`;
  if(name==='yokasta') g+=`<path d="M0,50 L0,200" stroke="#fff" stroke-width="5" opacity=".6"/><text x="0" y="140" text-anchor="middle" font-family="${F}" font-size="22" font-weight="bold" font-style="italic" fill="#fff">Baby</text>`;
  if(name==='kiara') g+=`<path d="M-30,46 L0,110 L30,46" stroke="#fff" stroke-width="6" fill="none" opacity=".7"/>`;
  if(name==='stanley'&&o.apron) g+=`<path d="M-62,200 Q-66,80 0,72 Q66,80 62,200 Z" fill="#1a1a22"/><text x="0" y="150" text-anchor="middle" font-family="${F}" font-size="20" font-weight="bold" fill="#fff">✂ S</text>`;
  if(name==='stanley'&&!o.apron) g+=`<text x="0" y="150" text-anchor="middle" font-family="${F}" font-size="22" font-weight="bold" fill="#2a5ad0">RD</text>`;
  if(c.chain){ g+=`<path d="M-56,50 Q0,134 56,50" stroke="url(#${c.chain})" stroke-width="9" fill="none" stroke-dasharray="10 4"/>`; if(c.chain==='gold') g+=`<circle cx="0" cy="120" r="22" fill="url(#gold)" stroke="#b07a10" stroke-width="3"/><text x="0" y="130" text-anchor="middle" font-family="${F}" font-size="26" font-weight="bold" fill="#7a4a00">B</text>`;}
  // brazos delante
  if((o.armL||'down')!=='behind') g+=L.a;
  if((o.armR||'down')!=='behind') g+=R.a;
  // objetos en las manos (antes de las manos)
  if(o.hold==='box') g+=cakeBox(0,150,1);
  if(o.hold==='plate') g+=`<ellipse cx="0" cy="150" rx="82" ry="22" fill="#fff" stroke="#ccc" stroke-width="3"/>${[-40,-14,12,38].map((x,i)=>`<ellipse cx="${x}" cy="${140-i%2*6}" rx="16" ry="10" fill="${i%2?'#d9902a':'#e8b04a'}"/>`).join('')}`;
  if(o.armR==='ear') g+=`<rect x="${R.ex-6}" y="${R.ey-54}" width="34" height="62" rx="8" fill="#1a1a2a" stroke="#888" stroke-width="3"/>`;
  if(o.armL==='up'&&o.phoneL) g+=`<rect x="${L.ex-34}" y="${L.ey-80}" width="60" height="96" rx="12" fill="#1a1a2a" stroke="#aaa" stroke-width="3"/><rect x="${L.ex-28}" y="${L.ey-72}" width="48" height="76" rx="6" fill="#6ab0ff" opacity=".7"/>`;
  if(o.armR==='clip') g+=`<rect x="${R.ex-14}" y="${R.ey-56}" width="28" height="56" rx="8" fill="#2a2a2a"/><rect x="${R.ex-14}" y="${R.ey-62}" width="28" height="10" fill="#c0c0c0"/>`;
  g+=L.h+R.h;
  // cabeza
  g+=`<g transform="translate(0,-130)">`;
  if(c.hair==='curly') g+=`<path d="M-160,-20 Q-170,-170 0,-172 Q170,-170 160,-20 Z" fill="#5a2a14"/>`;
  g+=`<ellipse cx="-150" cy="0" rx="26" ry="34" fill="url(#${c.sk})"/><ellipse cx="150" cy="0" rx="26" ry="34" fill="url(#${c.sk})"/>`;
  g+=`<ellipse cx="0" cy="-10" rx="155" ry="145" fill="url(#${c.sk})"/>`;
  g+=`<ellipse cx="-55" cy="-85" rx="60" ry="28" fill="#fff" opacity=".15"/>`;
  g+=eye(-50,0,c.iris,ex.e,c.lashes,t,(o.x||0)*.003)+eye(50,0,c.iris,ex.e2||ex.e,c.lashes,t,(o.x||0)*.003);
  g+=`<ellipse cx="-88" cy="48" rx="30" ry="18" fill="url(#cheek)"/><ellipse cx="88" cy="48" rx="30" ry="18" fill="url(#cheek)"/>`;
  g+=`<ellipse cx="0" cy="36" rx="10" ry="7" fill="#000" opacity=".13"/>`;
  if(c.mustache) g+=`<path d="M-30,50 Q-14,40 0,46 Q14,40 30,50" stroke="#1a0a04" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  let m=ex.m; if(ex.talk&&Math.sin(t*13)>0) m=(m==='wobble'?'o':'open');
  g+=mouth(m,t);
  // cejas
  const bc=c.hair==='curly'?'#3a1a0a':'#1a0a04';
  if(ex.b==='n') g+=`<path d="M-84,-46 Q-56,-60 -24,-50 M24,-50 Q56,-60 84,-46" stroke="${bc}" stroke-width="8" fill="none" stroke-linecap="round"/>`;
  if(ex.b==='up') g+=`<path d="M-84,-60 Q-56,-80 -24,-66 M24,-66 Q56,-80 84,-60" stroke="${bc}" stroke-width="8" fill="none" stroke-linecap="round"/>`;
  if(ex.b==='sad') g+=`<path d="M-82,-44 Q-56,-48 -26,-66 M26,-66 Q56,-48 82,-44" stroke="${bc}" stroke-width="8" fill="none" stroke-linecap="round"/>`;
  if(ex.b==='angry') g+=`<path d="M-84,-64 Q-56,-58 -24,-42 M24,-42 Q56,-58 84,-64" stroke="${bc}" stroke-width="9" fill="none" stroke-linecap="round"/>`;
  // pelo
  if(c.hair==='fade'){
    g+=`<path d="M-150,-50 Q-150,-156 0,-160 Q150,-156 150,-50 Q140,-90 100,-96 Q0,-110 -100,-96 Q-140,-90 -150,-50 Z" fill="#14100c"/>`;
    g+=`<path d="M-150,-50 Q-154,-10 -146,0 L-136,-40 Z M150,-50 Q154,-10 146,0 L136,-40 Z" fill="#14100c" opacity=".35"/>`;
    g+=`<path d="M-120,-112 Q-90,-128 -60,-122" stroke="url(#${c.sk})" stroke-width="5" fill="none"/>`;
    g+=`<path d="M-60,-140 Q0,-156 60,-144" stroke="#4a4038" stroke-width="7" fill="none" stroke-linecap="round" opacity=".6"/>`;
  }
  if(c.hair==='short') g+=`<path d="M-150,-40 Q-160,-160 0,-164 Q160,-160 150,-40 Q120,-90 0,-96 Q-120,-90 -150,-40 Z" fill="#2a1a10"/>`;
  if(c.hair==='curly'){ g+=`<path d="M-156,-10 Q-170,-170 0,-174 Q170,-170 156,-10 Q140,-80 90,-90 Q60,-120 10,-96 Q-40,-124 -80,-90 Q-140,-84 -156,-10 Z" fill="#5a2a14"/>`; for(let i=0;i<7;i++) g+=`<circle cx="${-120+i*40}" cy="${-150-Math.sin(i/6*Math.PI)*24}" r="26" fill="#6a3418"/>`; }
  if(c.hair==='braids'||o.capOn==='kiara'){}
  if(c.hair==='braids'){ g+=`<path d="M-156,0 Q-168,-160 0,-164 Q168,-160 156,0 Q150,-50 110,-70 Q60,-90 0,-86 Q-60,-90 -110,-70 Q-150,-50 -156,0 Z" fill="#1a0a04"/>`; for(let i=0;i<7;i++){const a=-150+i*20;g+=`<path d="M${Math.cos(a*Math.PI/180)*150},${-60+Math.sin(a*Math.PI/180)*100} L0,-150" stroke="#3a2010" stroke-width="3" opacity=".6"/>`;} }
  if(c.hair==='cap'&&!o.noCap||o.capOn){
    if(c.hair==='cap'&&o.noCap){}
    g+=`<path d="M-150,-56 Q-140,-176 0,-178 Q140,-176 150,-56 Q0,-90 -150,-56 Z" fill="url(#cap)"/><path d="M-120,-66 Q-180,-56 -200,-30 Q-160,-20 -120,-40 Z" fill="#9a1020"/><rect x="-30" y="-92" width="60" height="18" rx="9" fill="#fff" opacity=".85"/>`;
  }
  if(c.hair==='cap'&&o.noCap) g+=`<path d="M-150,-40 Q-160,-160 0,-164 Q160,-160 150,-40 Q120,-90 0,-96 Q-120,-90 -150,-40 Z" fill="#1a1008"/>`;
  if(c.shades) g+=`<g transform="translate(0,-112)"><ellipse cx="-40" cy="0" rx="36" ry="24" fill="#ff4fa3" opacity=".9"/><ellipse cx="40" cy="0" rx="36" ry="24" fill="#ff4fa3" opacity=".9"/><path d="M-6,0 L6,0" stroke="url(#gold)" stroke-width="6"/></g>`;
  if(c.hoops) g+=hoop(-156,58,34)+hoop(156,58,34);
  if(c.stud) g+=stud(-152,26)+stud(152,26);
  // efectos
  if(ex.sweat||o.sweat) g+=`<path d="M128,-70 q-18,32 0,44 q18,-12 0,-44 Z" fill="#9adcff" stroke="#fff" stroke-width="3"/>`;
  if(o.tear!==undefined) g+=`<path d="M-56,${30+o.tear*80} q-12,22 0,30 q12,-8 0,-30 Z" fill="#7cc8ff" stroke="#fff" stroke-width="2" opacity="${1-o.tear*.6}"/>`;
  if(o.glowPhone) g+=`<ellipse cx="0" cy="0" rx="170" ry="160" fill="#6ab0ff" opacity=".18"/>`;
  g+=`</g></g></g>`;
  return g;
}

function cakeBox(x,y,s){return `<g transform="translate(${x},${y}) scale(${s})"><rect x="-62" y="-46" width="124" height="80" rx="8" fill="#fff4e0" stroke="#d9b07a" stroke-width="3"/><rect x="-9" y="-46" width="18" height="80" fill="#ff5c8a"/><path d="M0,-46 q-30,-28 -34,-6 q4,10 34,6 q30,4 34,-6 q-4,-22 -34,6" fill="#ff5c8a"/></g>`;}
function cake(x,y,s,tear){
  let g=`<g transform="translate(${x},${y}) scale(${s})">`;
  g+=`<rect x="-150" y="-100" width="300" height="180" rx="10" fill="#fff4e0" stroke="#d9b07a" stroke-width="4"/>`;
  g+=`<ellipse cx="0" cy="40" rx="120" ry="22" fill="#fff"/><rect x="-110" y="-50" width="220" height="90" rx="18" fill="#fff8f0"/>`;

    s+=person('yokasta',{x:110,y:700,s:.56,t,expr:'nervous',capOn:true,armL:'down',armR:'down'});
    g+=zoom(s,t,80,90,1,1.08,320,450);
    g+=sfx('*clinc*',360,250,t,82,83.4,'#888',40);
  } else if(t<95){ // 10a. bizcocho y lágrima
    let s=`<rect width="540" height="960" fill="#1a1428"/><circle cx="270" cy="480" r="300" fill="url(#glowY)" opacity=".35"/>`;
    s+=cake(270,520,1.45,prog(t,91,93)+(t>93?prog(t,93,94.5):0));
    g+=zoom(s,t,90,95,1,1.1);
  } else if(t<104){ // 10b. la despedida
    let s=`<rect width="540" height="960" fill="#d86a98"/><rect x="100" y="120" width="340" height="600" fill="#ffd98a"/><rect x="100" y="120" width="70" height="600" fill="#5a3020"/>`;
    s+=person('brayan',{x:360,y:560,s:.56,t,expr:'nervous',noCap:true,armL:'down',armR:'down'});
    s+=person('yokasta',{x:230,y:620,s:.62,t,expr:'sad',capOn:true});
    s+=person('stanley',{x:90,y:760,s:.64,t,expr:t<98.4?'sadTalk':(t<103.8?'seriousTalk':'serious'),armL:'front',armR:'front',hold:'box',flip:true,tear:prog(t,95,97)});
    g+=zoom(s,t,95,104,1.02,1.1,200,500);
  } else if(t<111){ // 11. se va bajo la lluvia
    let s=streetNight(t,110);
    const wx=lerp(300,160,prog(t,104,111));
    s+=person('stanley',{x:wx,y:700-Math.abs(Math.sin(t*4))*5,s:.62-prog(t,104,111)*.12,t,expr:'sad',armL:'down',armR:'down'});
    g+=zoom(s,t,104,111,1.08,1);
  } else if(t<117.5){ // 12. el mensaje
    let s=`<rect width="540" height="960" fill="#0a0a18"/>`+rain(t,60);
    s+=person('stanley',{x:270,y:800,s:1.05,t,expr:t<112.6?'sad':(t>114.6&&t<117.4?'shockTalk':'shock'),glowPhone:true,still:1,shift:0});
    g+=s;
    if(t>112){const k=ease(prog(t,112,112.6));
      g+=`<g transform="translate(270,${lerp(-200,200,k)})"><rect x="-236" y="-130" width="472" height="250" rx="28" fill="#fff" stroke="#e02a3a" stroke-width="5"/>
      <text x="-206" y="-88" font-family="${F}" font-size="20" font-weight="bold" fill="#e02a3a">📩 Número desconocido</text>
      <text x="-206" y="-44" font-family="${F}" font-size="25" font-weight="bold" fill="#222">Eso no e' na'. Pregúntale</text>
      <text x="-206" y="-6" font-family="${F}" font-size="25" font-weight="bold" fill="#222">a Yokasta dónde estuvo</text>
      <text x="-206" y="32" font-family="${F}" font-size="25" font-weight="bold" fill="#222">el sábado...</text>
      <text x="-206" y="76" font-family="${F}" font-size="27" font-weight="bold" fill="#c0103a">...y con quién. 👀</text></g>`;
      g+=`<rect width="540" height="960" fill="#fff" opacity="${.5*(1-prog(t,112,112.5))}"/>`;}
  } else { // final
    g+=`<rect width="540" height="960" fill="#000"/>`;const a=prog(t,117.6,118.2);
    g+=big('💔 Continuará...',270,360,50,'#ff6f9f',a);
    g+=big('LO QUE STANLEY',270,450,36,'#ffd24f',a)+big('NO SABÍA',270,495,36,'#ffd24f',a);
    g+=big('Episodio 2: "El sábado"',270,570,28,'#fff',a);
    g+=big('👀 ¿Quién tú cree\' que mandó',270,680,25,'#9ff',prog(t,118.3,118.8))+big('ese mensaje?',270,715,25,'#9ff',prog(t,118.3,118.8));
    g+=big('Sígueme pa\' la parte 2 🇩🇴',270,790,26,'#b79cff',prog(t,118.5,119));
  }
  for(const c of LINES) if(t>=c.a&&t<=c.b) g+=caption(t,c);
  const cuts=[10,20,30,40,50,60,70,80,90,95,104,111,117.5];let fd=t<.3?1-t/.3:0;
  for(const c of cuts) fd=Math.max(fd,1-Math.abs(t-c)/.25);
  if(fd>0) g+=`<rect width="540" height="960" fill="#000" opacity="${clamp(fd)}"/>`;
  g+=`<text x="520" y="34" text-anchor="end" font-family="${F}" font-size="15" font-weight="bold" fill="#fff" opacity=".7" stroke="#000" stroke-width="3" paint-order="stroke">Lo Que Stanley No Sabía · Ep. 1 🇩🇴</text>`;
  return g;
}

else{const t0=performance.now();(function loop(){window.setTime(((performance.now()-t0)/1000)%120);requestAnimationFrame(loop);})();}
