# PENSUM OFICIAL MAT-01 — ARITMÉTICA COMPLETA
# Fuente única de verdad del currículo. NO eliminar, resumir, combinar ni
# reordenar temas sin autorización del propietario (ver PROJECT_CONTEXT.md).
# Los títulos se conservan literalmente (sólo se omite el punto final).
#
# gens: generadores del motor que producen ejercicios para el tema.
#       Si está vacío, el tema es conceptual y usa el banco de preguntas de
#       su lección (curriculum/mat-01/lessons/bXX.yaml → practice).

