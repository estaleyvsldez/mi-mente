[project]
name = "mathlab-backend"
version = "0.1.0"
description = "MATH LAB — API, sistema de enseñanza, dominio y repaso"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "sqlalchemy>=2.0", "pydantic>=2.6", "pyyaml>=6.0", "mathlab-engine"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "httpx>=0.27", "ruff>=0.4", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
