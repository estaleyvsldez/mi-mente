<title>Habla con Emily</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F2F2F7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de iPhone por escenarios. Pestañas abajo (Hoy · Mapa · Tarjetas · Plática · Yo). Cada escena abre a pantalla completa: arriba el lugar animado (Stanley camina, aparece la otra persona), en medio la tarjeta con lo que dices y su dibujo, abajo el micrófono. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F7F7FB; --ink:#0B0B14; --sub:#6B6B7D; --sep:rgba(60,60,67,.14); --fill:rgba(120,120,128,.12);
  --stan:#3557FF; --stan-soft:#E4E9FF; --emily:#FF3D7F; --emily-soft:#FFE3EC;
  --flame:#FF8A00; --flame-soft:#FFF0DC; --ok:#12A150; --ok-soft:#DDF5E7; --bad:#E5484D; --bad-soft:#FDE4E4;
  --brain:#7C4DFF; --brain-soft:#EEE7FF; --hero:#10142B; --on-acc:#FFFFFF; --gold:#F5B400;
  --skin-a:#C68A5E; --skin-b:#F2C6A2; --hair-a:#2A1D16; --hair-b:#7A4A2A;
  --round:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,system-ui,sans-serif;
  --text:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --card2:#232326; --ink:#F5F5F7; --sub:#9C9CA8; --sep:rgba(84,84,88,.55); --fill:rgba(120,120,128,.26);
  --stan:#7088FF; --stan-soft:#1D2554; --emily:#FF6B9C; --emily-soft:#4A1729;
  --flame:#FF9F0A; --flame-soft:#3D2706; --ok:#30D158; --ok-soft:#0F3A1E; --bad:#FF6961; --bad-soft:#431615;
  --brain:#A585FF; --brain-soft:#2A1E52; --hero:#1A1F3D; --on-acc:#0B0B14; --gold:#FFD60A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --card2:#232326; --ink:#F5F5F7; --sub:#9C9CA8; --sep:rgba(84,84,88,.55); --fill:rgba(120,120,128,.26);
  --stan:#7088FF; --stan-soft:#1D2554; --emily:#FF6B9C; --emily-soft:#4A1729;
  --flame:#FF9F0A; --flame-soft:#3D2706; --ok:#30D158; --ok-soft:#0F3A1E; --bad:#FF6961; --bad-soft:#431615;
  --brain:#A585FF; --brain-soft:#2A1E52; --hero:#1A1F3D; --on-acc:#0B0B14; --gold:#FFD60A; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--stan);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--round);text-wrap:balance}
p{margin:0}
.page{max-width:560px;margin:0 auto;padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.large{font-size:2.1rem;font-weight:900;letter-spacing:-.02em}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cap{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sub)}
.sub{color:var(--sub)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-weight:800;font-family:var(--round);font-variant-numeric:tabular-nums}
.pill svg{width:18px;height:18px}
.p-flame{background:var(--flame-soft);color:var(--flame)}
.p-xp{background:var(--stan-soft);color:var(--stan)}
.card{background:var(--card);border-radius:22px;padding:16px}
.group{background:var(--card);border-radius:18px;overflow:hidden}
.group>*+*{border-top:1px solid var(--sep)}
.cell{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;text-align:left;min-height:56px}
.cell .grow{flex:1;min-width:0}
.cell strong{display:block;font-weight:700}
.cell small{color:var(--sub);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.lock{opacity:.5}
.chev{color:var(--sub);flex:none}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 4px}
.sec-t h3{font-size:1.25rem;font-weight:800}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border-radius:16px;font-family:var(--round);font-weight:800;font-size:1.12rem;background:var(--stan);color:var(--on-acc);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn svg{width:24px;height:24px}
.btn.ghost{background:var(--fill);color:var(--ink)}
.btn.pink{background:var(--emily)}
.btn.small{padding:10px 14px;font-size:.95rem;border-radius:12px;width:auto}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1;min-width:130px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:99px;background:var(--bad-soft);color:var(--bad);font-weight:700;font-size:.9rem}
.chip.p{background:var(--brain-soft);color:var(--brain)}
.warn{background:var(--bad-soft);border-radius:14px;padding:12px 14px}
.link{color:var(--sub);text-decoration:underline;padding:6px;font-size:.9rem}
input[type=text],input[type=password]{width:100%;font:inherit;color:var(--ink);background:var(--card2);border:1px solid var(--sep);border-radius:12px;padding:12px}
select{font:inherit;color:var(--ink);background:var(--card2);border:1px solid var(--sep);border-radius:10px;padding:9px 10px}
code{font-size:.85em;background:var(--fill);padding:1px 5px;border-radius:5px}

/* ---------- héroe de Hoy ---------- */
.hero{background:var(--hero);color:#fff;border-radius:26px;padding:18px;display:grid;gap:14px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,61,127,.35),transparent 65%);right:-90px;top:-110px}
.hero>*{position:relative;z-index:1}
.hero .cap{color:rgba(255,255,255,.65)}
.hero h2{font-size:1.55rem;font-weight:900}
.mini{height:120px;border-radius:18px;overflow:hidden;position:relative}
.vbanner{display:flex;gap:12px;align-items:center;background:var(--emily-soft);border-radius:18px;padding:12px 14px}
.vbanner b{display:block}
.prog{height:8px;border-radius:9px;background:var(--fill);overflow:hidden}
.prog u{display:block;height:100%;background:var(--emily);border-radius:9px;transition:width .3s}

/* ---------- avatares ---------- */
.av{width:96px;height:96px;flex:none;position:relative}
.av.sm{width:72px;height:72px}
.av svg{width:100%;height:100%;overflow:visible}
.av .mouth{transform-box:fill-box;transform-origin:center;transform:scaleY(.35)}
.av.talk .mouth{animation:talk .16s ease-in-out infinite alternate}
.av .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.av.listen::before{content:"";position:absolute;inset:-5px;border-radius:50%;border:4px solid var(--bad);animation:ping 1.1s ease-out infinite}
.av.happy svg{animation:hop .5s ease}
.av.sad svg{animation:shake .4s ease}
.av .tag{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);font-size:.66rem;font-weight:800;font-family:var(--round);padding:2px 7px;border-radius:99px;color:#fff;white-space:nowrap}
.av.a .tag{background:var(--stan)} .av.b .tag{background:var(--emily)}
.npcface{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:44px;background:#ffffffcc;position:relative;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.npcface.talk{animation:nod .3s ease-in-out infinite alternate}
.npcface .tag{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);font-size:.66rem;font-weight:800;font-family:var(--round);padding:2px 7px;border-radius:99px;color:#fff;background:#444;white-space:nowrap}
@keyframes talk{from{transform:scaleY(.25)}to{transform:scaleY(1.15)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes ping{from{transform:scale(.95);opacity:.8}to{transform:scale(1.25);opacity:0}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes nod{from{transform:rotate(-4deg) translateY(0)}to{transform:rotate(4deg) translateY(-3px)}}

/* ---------- escena animada ---------- */
.scene{position:relative;height:clamp(150px,23vh,210px);border-radius:24px;overflow:hidden;background:linear-gradient(var(--sky) 0 62%,var(--floor) 62% 100%);flex:none}
.scene .props{position:absolute;left:0;right:0;top:18%;height:44%;overflow:hidden}
.scene .track{display:flex;gap:26px;font-size:clamp(32px,5vh,44px);white-space:nowrap;width:max-content;animation:scroll 14s linear infinite;animation-play-state:paused;opacity:.92}
.scene.walk .track{animation-play-state:running}
.scene .actor{position:absolute;bottom:8px;transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .6s}
.scene .actor.me{left:14px}
.scene.walk .actor.me .av{animation:bob .45s ease-in-out infinite alternate}
.scene .actor.npc{right:14px;transform:translateX(140%);opacity:0}
.scene.meet .actor.npc{transform:none;opacity:1}
.scene .say{position:absolute;top:10px;max-width:68%;background:#fff;color:#0B0B14;border-radius:16px;padding:8px 12px;font-weight:700;font-size:.92rem;line-height:1.25;box-shadow:0 4px 14px rgba(0,0,0,.18);opacity:0;transform:translateY(6px);transition:.25s}
.scene .say small{display:block;font-weight:500;color:#555;font-size:.8rem;margin-top:2px}
.scene .say.on{opacity:1;transform:none}
.scene .say.npc{right:12px;border-bottom-right-radius:4px}
.scene .say.me{left:12px;background:#3557FF;color:#fff;border-bottom-left-radius:4px}
.scene .place{position:absolute;left:12px;top:10px;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:rgba(0,0,0,.45)}
.scene.phone .actor.npc{right:50%;transform:translateX(50%);opacity:1;bottom:40px}
.scene.phone .ring{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-80px 0 0 -60px;border-radius:50%;border:3px solid rgba(255,255,255,.7);animation:ping 1.6s ease-out infinite}
.scene.phone .callbar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;font-weight:700;font-size:.78rem;padding:4px 12px;border-radius:99px;font-variant-numeric:tabular-nums}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes bob{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-5px) rotate(2deg)}}

/* ---------- mapa ---------- */
.lvl{display:flex;align-items:center;gap:12px;padding:0 4px}
.lvl .bar{height:8px;border-radius:9px;background:var(--fill);overflow:hidden}
.lvl .bar u{display:block;height:100%;border-radius:9px}
.ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff;font-family:var(--round);font-weight:900;font-size:1.3rem}
.scnum{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;font-size:1.5rem;background:var(--fill)}
.scnum.now{background:var(--stan-soft);box-shadow:0 0 0 3px var(--stan)}
.stars{color:var(--gold);font-size:.85rem;letter-spacing:1px;flex:none}
.stars i{color:var(--fill);font-style:normal}

/* ---------- tarjetas ---------- */
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.fc{background:var(--card);border-radius:18px;padding:12px;display:grid;gap:4px;align-content:start;text-align:left}
.fc .em{font-size:2.3rem;line-height:1.1;letter-spacing:2px}
.fc .e{font-weight:800;font-family:var(--round)}
.fc .s{color:var(--sub);font-size:.85rem}
.fc .r{color:var(--emily);font-style:italic;font-size:.85rem}
.fc.due{box-shadow:0 0 0 2px var(--flame)}
.fc.weak{box-shadow:0 0 0 2px var(--bad)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--card);border-radius:18px;padding:14px}
.stat b{display:block;font-family:var(--round);font-size:1.8rem;font-weight:900;font-variant-numeric:tabular-nums}
.stat span{color:var(--sub);font-size:.85rem;font-weight:600}
.hbar{display:grid;grid-template-columns:110px 1fr 34px;align-items:center;gap:10px;padding:8px 16px}
.hbar .w{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .t{height:10px;border-radius:9px;background:var(--fill);overflow:hidden}
.hbar .t u{display:block;height:100%;background:var(--bad);border-radius:9px}
.hbar .n{text-align:right;color:var(--sub);font-variant-numeric:tabular-nums;font-size:.85rem}

/* ---------- pestañas ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);
  background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{display:grid;justify-items:center;gap:2px;padding:8px 0 6px;font-size:.66rem;font-weight:600;color:var(--sub)}
.tabs button span.i{font-size:1.45rem;line-height:1;filter:grayscale(1);opacity:.7}
.tabs button.on{color:var(--stan)}
.tabs button.on span.i{filter:none;opacity:1}

/* ---------- sesión ---------- */
.sess{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.sess .in{max-width:560px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;gap:10px;min-height:0;
  padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px));
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.shead{display:flex;align-items:center;gap:10px;flex:none}
.xbtn{width:36px;height:36px;border-radius:50%;background:var(--fill);display:grid;place-items:center;flex:none}
.xbtn svg{width:18px;height:18px}
.pbar{flex:1;height:10px;border-radius:9px;background:var(--fill);overflow:hidden}
.pbar u{display:block;height:100%;width:0;background:var(--ok);border-radius:9px;transition:width .4s}
.sinfo{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex:none}
.phase{font-family:var(--round);font-weight:900;font-size:1.05rem}
.snote{font-size:.88rem;color:var(--sub);background:var(--card);border-radius:14px;padding:8px 12px;flex:none}
.snote b{color:var(--ink)}
.scard{background:var(--card);border-radius:22px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:start;flex:0 1 auto;min-height:0;overflow-y:auto}
.scard .who{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-weight:800;font-family:var(--round);font-size:.9rem;color:var(--stan)}
.scard .who em{margin-left:auto;font-style:normal;font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--sub)}
.scard .body{display:grid;gap:6px;min-width:0}
.scard .draw{font-size:2.8rem;line-height:1;letter-spacing:2px;animation:wobble 2.2s ease-in-out infinite;transform-origin:50% 80%;text-align:center;max-width:120px;overflow-wrap:anywhere}
@keyframes wobble{0%,100%{transform:rotate(-6deg) scale(1)}50%{transform:rotate(6deg) scale(1.08)}}
.en{font-family:var(--round);font-weight:900;font-size:clamp(1.3rem,5.6vw,1.8rem);line-height:1.12}
.en.long{font-size:clamp(1.15rem,5vw,1.5rem)}
.en.hide{font-family:var(--text);font-weight:700;font-size:1.2rem}
.pr{font-style:italic;font-size:1.1rem;color:var(--emily);font-weight:600}
.es{color:var(--sub)}
.hints{grid-column:1/-1;display:grid;gap:8px}
.hint{background:var(--card2);border-radius:14px;padding:10px 12px;display:grid;gap:2px}
.hint .e{font-weight:800} .hint .s{color:var(--sub);font-size:.9rem} .hint .r{color:var(--emily);font-style:italic;font-size:.9rem}
.spacer{flex:1 1 0;min-height:0}
.fb{border-radius:14px;padding:9px 14px;font-weight:600;flex:none}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--ink);font-weight:500}
.fb.bad mark{background:none;color:var(--bad);font-weight:800;text-decoration:underline}
.dock{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:22px;padding:10px 14px;flex:none}
.orb{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--sub);flex:none;position:relative;transition:background .2s;cursor:pointer}
.orb svg{width:32px;height:32px}
.orb.ready{background:var(--stan);color:#fff;box-shadow:0 0 0 6px var(--stan-soft)}
.orb.ready::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--stan);animation:ping 1.8s ease-out infinite}
.orb.listen{background:var(--bad);color:#fff}
.orb.listen::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--bad);animation:ping 1s ease-out infinite}
.orb.speak{background:var(--emily);color:#fff}
.orb.ok{background:var(--ok);color:#fff}
.orb.bad{background:var(--bad);color:#fff}
.orb.think{background:var(--brain);color:#fff}
.dock .t{flex:1;min-width:0}
.dock .st{font-weight:800;font-family:var(--round)}
.dock .heard{color:var(--sub);font-size:.92rem;overflow-wrap:anywhere;min-height:1.3em}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:none}
.acts button{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 6px;border-radius:12px;background:var(--card);font-weight:700;font-size:.88rem}
.tbar{display:flex;gap:8px;align-items:center}
.tbar input{flex:1;min-width:0;padding:9px 12px}
.tbar button{background:var(--brain);color:#fff;font-weight:800;padding:9px 14px;border-radius:10px}
.snote .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-top:8px}
.snote .chips::-webkit-scrollbar{display:none}
.snote .chip{flex:none;font-size:.82rem;padding:5px 10px}
.win{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 88%,transparent);z-index:5;animation:fade .25s}
.win div{text-align:center;display:grid;gap:8px;justify-items:center;padding:24px;max-width:420px}
.win b{font-family:var(--round);font-size:1.9rem;font-weight:900}
.win .big{font-size:2.4rem;color:var(--gold);letter-spacing:4px}
.win .xp{color:var(--flame);font-family:var(--round);font-weight:900;font-size:1.3rem}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheetbg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;display:grid;gap:14px;
  padding:10px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--fill);justify-self:center}
.sheet h3{font-size:1.4rem;font-weight:900}
.phr{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:10px 16px;align-items:start}
.phr .em{grid-row:span 3;font-size:1.6rem}
.phr .e{font-weight:700} .phr .s{color:var(--sub);font-size:.9rem} .phr .r{font-style:italic;font-size:.9rem;color:var(--emily)}
.phr.npc .e{color:var(--sub);font-weight:600}
@keyframes up{from{transform:translateY(40%)}to{transform:none}}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;animation:fade .2s;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>

<div id="app"></div>
<nav class="tabs" id="tabs"></nav>

<script>

const NUM={"0":"zero","1":"one","2":"two","3":"three","4":"four","5":"five","6":"six","7":"seven","8":"eight","9":"nine","10":"ten","11":"eleven","12":"twelve","15":"fifteen","20":"twenty","30":"thirty","50":"fifty","100":"hundred"};
const SAME=[["yeah","yes","yep","yea","yah","ya"],["hey","hi","hay","hai","hello","hallo"],["okay","ok","k","kay"],["nope","nah"],
  ["stanley","stan","standley","stanly","stanely"],["emily","emilie","emmy","emely","emilee"],["thanks","thank"],["sure","shore"],
  ["babe","baby","bae"],["gonna","gona"],["cuz","cause","because","coz"],["dude","bro","man"],["mom","mum"],["cool","coo"],["gotcha","gotya"]];
const CANON={};SAME.forEach(g=>g.forEach(w=>CANON[w]=g[0]));
const FILL=new Set(["oh","ah","um","uh","hmm","aw","awe","erm","like","well","so"]);
const STOP=new Set("a an the to i you is am are it of and in on at for my me we he she they be do not so this that with your".split(" "));
const ONES="zero one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen".split(" "),TENS=",,twenty,thirty,forty,fifty,sixty,seventy,eighty,ninety".split(",");
function n2w(n){if(n<20)return ONES[n];if(n<100)return TENS[Math.floor(n/10)]+(n%10?" "+ONES[n%10]:"");if(n<1000)return ONES[Math.floor(n/100)]+" hundred"+(n%100?" "+n2w(n%100):"");
  if(n<10000)return n2w(Math.floor(n/1000))+" thousand"+(n%1000?" "+n2w(n%1000):"");return String(n)}
function norm(s){
  s=(" "+s+" ").toLowerCase().replace(/[’‘`´]/g,"'").replace(/o\.k\./g,"okay").replace(/(\d),(\d{3})/g,"$1$2").replace(/\$(\d+)/g,"$1 dollars").replace(/(\d+):00/g,"$1").replace(/(\d+):(\d+)/g,"$1 $2");
  s=s.replace(/\b(\d+)(st|nd|rd|th)?\b/g,(m,d)=>n2w(+d)).replace(/-/g," ");
  s=s.replace(/\bcan't\b|\bcannot\b/g,"can not").replace(/\bwon't\b/g,"will not").replace(/\bain't\b/g,"is not")
     .replace(/n't\b/g," not").replace(/'re\b/g," are").replace(/'ll\b/g," will").replace(/'ve\b/g," have")
     .replace(/'d\b/g," would").replace(/'m\b/g," am").replace(/\blet's\b/g,"let us").replace(/'s\b/g," is");
  s=s.replace(/\bgonna\b/g,"going to").replace(/\bwanna\b/g,"want to").replace(/\bgotta\b/g,"got to").replace(/\bhafta\b/g,"have to")
     .replace(/\bkinda\b/g,"kind of").replace(/\bsorta\b/g,"sort of").replace(/\blemme\b/g,"let me").replace(/\bgimme\b/g,"give me")
     .replace(/\bwhatcha\b/g,"what are you").replace(/\bwhaddya\b/g,"what do you").replace(/\bdidja\b/g,"did you").replace(/\bdontcha\b/g,"do not you")
     .replace(/\bouta\b|\boutta\b/g,"out of").replace(/\blotta\b/g,"lot of").replace(/\bshoulda\b/g,"should have").replace(/\bcoulda\b/g,"could have").replace(/\bwoulda\b/g,"would have")
     .replace(/'bout\b/g,"about").replace(/'cause\b/g,"because").replace(/\bthank you\b/g,"thanks").replace(/\balright\b/g,"all right")
     .replace(/\bgoin\b/g,"going").replace(/\bdoin\b/g,"doing").replace(/\bnothin\b/g,"nothing").replace(/\bsomethin\b/g,"something");
  s=s.replace(/[^a-z' ]+/g," ").replace(/'/g,"");
  return s.split(/\s+/).filter(Boolean).map(w=>CANON[w]||w);
}
function lev(a,b){const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const skey=w=>w.replace(/ph/g,"f").replace(/ck/g,"k").replace(/(.)\1+/g,"$1").replace(/e$/,"").replace(/s$/,"");
const wEq=(a,b)=>a===b||skey(a)===skey(b)||(a[0]===b[0]&&((a.length>=3&&b.length>=3&&lev(a,b)<=1)||(a.length>=6&&b.length>=6&&lev(a,b)<=2)));
/* lenient=true (sin ayuda): perdona más, pero las palabras clave tienen que estar */
function compare(target,heard,lenient){
  const T0=norm(target).filter(w=>!FILL.has(w)),H=norm(heard).filter(w=>!FILL.has(w));
  const m=T0.length,n=H.length,d=[];
  for(let i=0;i<=m;i++){d[i]=[];for(let j=0;j<=n;j++)d[i][j]=i===0?j:j===0?i:0}
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(wEq(T0[i-1],H[j-1])?0:1));
  const miss=new Array(m).fill(true);let i=m,j=n;
  while(i>0&&j>0){if(wEq(T0[i-1],H[j-1])&&d[i][j]===d[i-1][j-1]){miss[i-1]=false;i--;j--}
    else if(d[i][j]===d[i-1][j]+1)i--;else if(d[i][j]===d[i][j-1]+1)j--;else{i--;j--}}
  const keys=T0.map((w,k)=>!STOP.has(w)?k:-1).filter(k=>k>=0),keyMissN=keys.filter(k=>miss[k]).length;
  const allowed=lenient?Math.max(1,Math.round(m*.3)):(m<=4?0:m<=9?1:2),keyOk=lenient?keyMissN<=Math.floor(keys.length/5):keyMissN===0;
  return {ok:n>0&&keyOk&&d[m][n]<=allowed,dist:d[m][n],words:T0,miss,heardWords:H};
}
function command(heard){const w=norm(heard).join(" ");
  if(/^(please )?(repeat|repeat that|again|one more time|come again)( please)?$/.test(w))return "repeat";
  if(/^(slow|slower|slowly|slow down|more slowly)$/.test(w))return "slow";
  if(/^(help|help me|ayuda)$/.test(w))return "help";
  return null}

const synth=window.speechSynthesis||null;
let SV={f:null,m:null,es:null},slowNext=false,speaking=false,ac=null,curSrc=null;
const NOVELTY=/bells|bubbles|albert|bad news|good news|zarvox|whisper|trinoids|cellos|jester|organ|superstar|wobble|boing|junior|ralph|bahh|deranged|hysterical|pipe|grandma|grandpa|rocko|shelley|sandy|eddy|flo|reed/i;
const FEM=/ava|zoe|samantha|allison|susan|nicky|joelle|noelle|aria|jenny|emma|michelle|serena|karen|moira|tessa|victoria|joanna|salli|kendra|kimberly|zira|google us english|female/i;
const MAL=/evan|nathan|tom\b|alex|aaron|fred|guy|davis|tony|christopher|eric|ryan|daniel|oliver|arthur|andrew|brian|male/i;
function vScore(v){let s=0;if(/premium/i.test(v.name))s+=100;else if(/enhanced|mejorad|neural|natural|online/i.test(v.name))s+=70;else if(/google/i.test(v.name))s+=40;if(/^en[-_]US/i.test(v.lang))s+=15;return s}
function pickVoices(){if(!synth)return;const vs=synth.getVoices();if(!vs.length)return;
  const en=vs.filter(v=>/^en/i.test(v.lang)&&!NOVELTY.test(v.name)).sort((a,b)=>vScore(b)-vScore(a));
  SV.f=en.find(v=>FEM.test(v.name))||en[0]||null;SV.m=en.find(v=>MAL.test(v.name)&&!/female/i.test(v.name))||en.find(v=>v!==SV.f)||SV.f;
  const es=vs.filter(v=>/^es/i.test(v.lang));SV.es=es.find(v=>/es[-_](MX|US|419)/i.test(v.lang))||es[0]||null}
if(synth){pickVoices();synth.onvoiceschanged=pickVoices}
/* quién habla: E Emily · F mujer · M hombre · S Stanley (modelo de lo que dices) · es guía en español */
const KVOICE={E:()=>DB.settings.emily||"af_bella",F:()=>"af_sarah",M:()=>"am_michael",S:()=>"am_fenrir"};
let KO=null,koP=null,koState="off",koPct=0;const koCache=new Map();
function koLoad(){if(KO)return Promise.resolve(KO);if(koP)return koP;koState="loading";renderVoiceBanner();
  koP=import("https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/dist/kokoro.web.js").then(m=>m.KokoroTTS.from_pretrained("onnx-community/Kokoro-82M-v1.0-ONNX",{dtype:"q8",device:"wasm",
      progress_callback:p=>{if(p&&p.status==="progress"&&p.total>1e6){koPct=Math.round(p.progress||0);renderVoiceBanner()}}}))
    .then(t=>{KO=t;koState="ready";DB.settings.human=true;save();renderVoiceBanner();return t})
    .catch(e=>{console.warn(e);koState="error";koP=null;renderVoiceBanner();throw e});
  return koP}
function koGen(text,who){const v=KVOICE[who]?KVOICE[who]():"af_bella",sp=(slowNext||DB.settings.slow)?0.8:(who==="E"?0.95:1);const k=v+"|"+sp+"|"+text;
  if(koCache.has(k))return koCache.get(k);
  const p=KO.generate(text,{voice:v,speed:sp}).then(a=>{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const b=ac.createBuffer(1,a.audio.length,a.sampling_rate);b.copyToChannel(a.audio,0);return b});
  p.catch(()=>koCache.delete(k));koCache.set(k,p);if(koCache.size>80)koCache.delete(koCache.keys().next().value);return p}

  setOrb("speak",who==="S"?"Así se dice":who==="es"?"Emily te explica":"Escucha…");speaking=true;

    if(KO&&who!=="es"){try{const b=await koGen(text,who);slowNext=false;await new Promise(res=>{ac.resume();const s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);curSrc=s;s.onended=res;s.start();setTimeout(res,b.duration*1000+800)});return}catch(e){console.warn(e)}}
    await new Promise(res=>{if(!synth){res();return}synth.cancel();const u=new SpeechSynthesisUtterance(text);
      if(who==="es"){u.voice=SV.es;u.lang=SV.es?SV.es.lang:"es-MX";u.rate=1.03}

    dict.onState(({state,reason})=>{const c=cap;if(state==="idle"&&c&&c.dict){if(reason==="not_granted")micBlocked();capFinal(c)}})}

function micBlocked(){setOrb("ready","Micrófono bloqueado");feedback({ok:false},"Permite el micrófono: en iPhone, Ajustes → Safari → Micrófono → Permitir. Luego toca otra vez el micrófono.")}
const clr=c=>["timer","max","idle","fall"].forEach(k=>clearTimeout(c[k]));
function capStart(){
  if(!pending||cap)return;stopVoice();
  const c={cands:[],fin:"",part:"",stopping:false};cap=c;
  setOrb("listen","Te escucho… toca para terminar");setAv("A","listen");showHeard("",false);
  c.max=setTimeout(()=>capStop(c),20000);c.idle=setTimeout(()=>{if(cap===c&&!c.cands.length)capStop(c)},9000);
  if(dict){c.dict=true;dict.start({language:"en"}).catch(e=>{if(e&&e.code==="not_granted")micBlocked();if(cap===c){cap=null;clr(c);if(pending)setOrb("ready","Toca el micrófono y habla")}});return}
  const r=new SR();c.rec=r;r.lang="en-US";r.continuous=true;r.interimResults=true;r.maxAlternatives=5;
  r.onresult=ev=>{if(cap!==c)return;const S=[];for(let i=0;i<ev.results.length;i++){const res=ev.results[i],a=Array.from({length:res.length},(_,k)=>res[k]&&res[k].transcript||"").filter(Boolean);if(a.length)S.push(a)}
    if(!S.length)return;const base=S.slice(0,-1).map(a=>a[0]).join(" "),last=S[S.length-1];c.cands=[...last.map(a=>(base+" "+a).trim()),...last];capUpdate(c)};

function capUpdate(c){if(cap!==c)return;const p=pending;if(!p)return;showHeard(c.cands[0]||"",true);clearTimeout(c.idle);
  if(p.target&&c.cands.some(x=>compare(p.target,x,p.lenient).ok)){capFinal(c);return}
  if(!c.stopping){clearTimeout(c.timer);c.timer=setTimeout(()=>capStop(c),p.wait)}}
function capStop(c){c=c||cap;if(!c||cap!==c||c.stopping)return;c.stopping=true;clearTimeout(c.timer);setOrb("think","Revisando…");

  if(c.dict&&!c.stopping){try{dict.stop()}catch(e){}}

  if(p.target){const sc=x=>{const r=compare(p.target,x,p.lenient);return (r.ok?0:100)+r.dist};cands.sort((a,b)=>sc(a)-sc(b))}

const guard=t=>{if(t!==token)throw CANCEL};
function setPhase(name,note,title){const p=$("#sph");if(p)p.textContent=name;const n=$("#snote");if(n){n.hidden=!note;n.innerHTML=note||""}if(title!==undefined){const x=$("#stt");if(x)x.textContent=title}}
function setProg(f){const b=$("#sbar");if(b)b.style.width=Math.round(Math.min(1,f)*100)+"%"}
function setOrb(kind,label){const o=$("#sorb");if(!o)return;o.className="orb "+kind;o.innerHTML=kind==="speak"?I.spk:kind==="think"?I.think:I.mic;$("#sst").textContent=label;
  const h=$("#sheard");if(h&&kind==="ready"&&!h.textContent)h.textContent="Toca el botón azul para contestar"}
function showHeard(t,partial){const h=$("#sheard");if(h)h.textContent=t?(partial?t+"…":"«"+t+"»"):""}
function walk(on){const s=$("#scn");if(s)s.classList.toggle("walk",on)}
function meet(on){const s=$("#scn");if(s)s.classList.toggle("meet",on)}
function bubble(side,en,es){const b=$(side==="N"?"#sayN":"#sayY");if(!b)return;if(!en){b.classList.remove("on");return}b.innerHTML=esc(en)+(es?`<small>${esc(es)}</small>`:"");b.classList.add("on");
  const o=$(side==="N"?"#sayY":"#sayN");if(o)o.classList.remove("on")}
/* tarjeta de lo que dices: help (te digo qué decir) o recall (sólo la idea en español + el dibujo) */
function showYou(y,mode,label){const c=$("#scard");if(!c)return;c.hidden=false;const hide=mode==="recall";
  c.innerHTML=`<div class="who">● Tú (Stanley)<em>${label||(hide?"Dilo tú, sin ayuda":"Tú dices esto")}</em></div>
   <div class="body">${hide?`<div class="en hide">Dile: «${esc(y.es)}»</div>`:`<div class="en ${y.en.length>38?"long":""}">${esc(y.en)}</div><div class="pr">${esc(y.pr)}</div><div class="es">${esc(y.es)}</div>`}</div>
   <div class="draw" aria-hidden="true">${esc(y.em)}</div>`}
function reveal(y){const b=$("#scard .body");if(b)b.innerHTML=`<div class="en ${y.en.length>38?"long":""}">${esc(y.en)}</div><div class="pr">${esc(y.pr)}</div><div class="es">${esc(y.es)}</div>`}
function feedback(r,msg){const f=$("#sfb");if(!f)return;if(!r&&!msg){f.hidden=true;return}f.hidden=false;
  if(msg){f.className="fb "+(r&&r.ok?"ok":"bad");f.textContent=msg;return}
  if(r.ok){f.className="fb ok";f.textContent=pick(["¡Eso!","¡Perfecto!","¡Como gringo!","¡Muy bien!","¡Así mero!"]);return}
  f.className="fb bad";f.innerHTML=r.heardWords.length?"Casi. Te faltó lo marcado: "+r.words.map((w,i)=>r.miss[i]?"<mark>"+esc(w)+"</mark>":esc(w)).join(" "):"No te escuché bien. Acerca el teléfono o usa audífonos."}
async function sayEs(text,t){guard(t);if(SV.es||!synth)await speak(text,"es");guard(t)}

/* un turno tuyo: devuelve true si salió a la primera */
async function youSay(y,mode,t,npcLine,npcWho,opts){
  opts=opts||{};let first=true,heard=false;showYou(y,mode,opts.label);feedback(null);
  if(mode==="help"&&opts.model){slowNext=true;await speak(y.en,"S");guard(t);heard=true}
  while(true){guard(t);const r=await listen(y.en,{lenient:mode==="recall"});guard(t);
    if(r.cmd==="repeat"||r.cmd==="slow"){if(r.cmd==="slow")slowNext=true;if(npcLine){bubble("N",npcLine.en,opts.npcEs?npcLine.es:"");await speak(npcLine.en,npcWho)}else await speak(y.en,"S");guard(t);continue}
    if(r.cmd==="help"){if(mode==="recall"){reveal(y);first=false}feedback({ok:true},"Así se dice. Escúchalo y dilo tú.");slowNext=true;await speak(y.en,"S");guard(t);heard=true;continue}
    if(!r.text)continue;
    const c=compare(y.en,r.text,mode==="recall");feedback(c);record(y,c.ok,c,first);
    if(c.ok){bubble("Y",y.en);tone(true);setOrb("ok","¡Bien!");cheer(true);await wait(700);guard(t);return first}
    tone(false);setOrb("bad","Otra vez");cheer(false);first=false;if(mode==="recall")reveal(y);
    await wait(500);guard(t);slowNext=heard;await speak(y.en,"S");heard=true;guard(t)}
}
async function npcSays(s,line,t,showEs){bubble("N",line.en,showEs?line.es:"");await speak(line.en,s.voice);guard(t)}

/* una ronda completa de la escena */
async function round(s,mode,t,showEs,p0,pN){let errs=0,k=0;const n=s.turns.length,model=mode==="help"&&s.lvl<=2;
  for(let i=0;i<n;i++){const tr=s.turns[i],nx=s.turns[i+1];guard(t);
    if(tr.npc){if(nx&&nx.npc)prefetch(nx.npc.en,s.voice);await npcSays(s,tr.npc,t,showEs)}
    if(tr.you){if(nx&&nx.npc)prefetch(nx.npc.en,s.voice);const ok=await youSay(tr.you,mode,t,tr.npc,s.voice,{model,npcEs:showEs});if(!ok)errs++;await wait(250)}
    setProg(p0+(pN-p0)*(++k/n))}
  return errs}
async function runScene(s,t){
  const yours=s.turns.filter(x=>x.you).length;
  openSess(s.place,npcHTML(s),`Escena ${s.num}`);setPhase(`Escena ${s.num}`,"",s.t);
  walk(true);await sayEs(s.n?s.n:"Vamos.",t);await wait(900);guard(t);walk(false);meet(true);await wait(700);guard(t);
  const own=s.turns.filter(x=>x.you).map(x=>x.you),warm=weakItems(2,own).concat(dueItems(2,own)).slice(0,3);
  if(warm.length){setPhase("Calentamiento","Antes de empezar, unas frases de escenas pasadas.");for(const y of warm)await youSay(y,"recall",t,null,null,{label:"Repaso rápido"})}
  const fast=(DB.streak3||0)>=3&&!DB.sc[s.id];let errs;
  if(!fast){setPhase("Ronda 1 · con ayuda",`<b>${esc(s.npcN)}</b> te habla y abajo te digo qué contestar. Toca el micrófono y dilo.`);
    await sayEs("Primero con ayuda.",t);await round(s,"help",t,true,0,.5)}
  else{setPhase("Modo rápido","Vas muy bien: hoy saltamos la ronda con ayuda.");await sayEs("Vas muy bien. Directo sin ayuda.",t)}
  setPhase("Ronda 2 · sin ayuda","Ahora tú solo. Sólo ves la idea en español y el dibujo.");walk(true);await wait(700);walk(false);
  await sayEs("Ahora sin ayuda.",t);
  errs=await round(s,"recall",t,s.lvl<5,fast?0:.5,1);
  let stars=errs===0?3:errs<=Math.ceil(yours*.25)?2:errs<=Math.ceil(yours*.5)?1:0;
  if(stars===0){setPhase("Otra pasadita","Se te atoró bastante. Te regreso un pasito: otra vez con ayuda y luego sin ayuda.");
    await sayEs("Te regreso un pasito. Otra vez con ayuda.",t);await round(s,"help",t,true,0,.5);await sayEs("Ahora sin ayuda.",t);errs=await round(s,"recall",t,true,.5,1);
    stars=errs===0?2:errs<=Math.ceil(yours*.5)?1:0}
  const prev=DB.sc[s.id]||{};DB.sc[s.id]={stars:Math.max(prev.stars||0,stars),tries:(prev.tries||0)+1,last:Date.now()};
  DB.streak3=stars===3?(DB.streak3||0)+1:0;const xp=stars*20+10;addXP(xp);save();
  await finish(stars,xp,t);return stars}
async function finish(stars,xp,t){const sess=$("#sess");if(!sess)return;const w=document.createElement("div");w.className="win";
  const msg=stars===3?"¡Perfecta! Pasas a la siguiente.":stars===2?"¡Muy bien! Pasas.":stars===1?"Pasas, pero esta va a volver en tus repasos.":"Todavía no. Lo que fallaste se va a tus tarjetas y la repetimos.";
  w.innerHTML=`<div>${avatar("B")}<span class="big">${"★".repeat(stars)}${"☆".repeat(3-stars)}</span><b>${stars?"¡Escena superada!":"Casi…"}</b><p class="sub">${msg}</p><span class="xp">+${xp} XP</span></div>`;
  sess.appendChild(w);tone(stars>0);
  await speak(stars===3?"Awesome, babe! You nailed it!":stars>0?"Nice job, Stanley!":"Don't worry. We'll try again.","E");guard(t);await wait(1400);guard(t);w.remove()}
async function runFrom(s,t){let cur=s,fails=0;
  while(cur){guard(t);const st=await runScene(cur,t);
    if(st===0){fails++;if(fails>=2&&cur.i>0){await runScene(SCENES[cur.i-1],t);fails=0}continue}
    fails=0;const nx=SCENES[cur.i+1];if(nx&&nx.lvl!==cur.lvl){setPhase("¡Subiste de nivel!","");await sayEs("¡Subiste de nivel!",t)}cur=nx}}
/* tarjetas con voz */
async function cardDrill(list,title,t){openSess("casa",avatar("B","sm"),title);meet(true);setPhase(title,"Ves la idea y el dibujo. Dilo en inglés como gringo.");
  const q=list.slice();const n=q.length;let d=0;
  while(q.length){const y=q.shift();const ok=await youSay(y,"recall",t,null,null,{label:"Tarjeta"});if(!ok)q.push(y);else setProg(++d/n)}
  addXP(10);save();setPhase("¡Listo!","");await speak("Great job! See you tomorrow.","E")}

function topicOf(txt){return Object.values(FT).find(x=>x.keys.test(txt))||null}
async function freeTalk(t,topic){
  const S={voice:"E"};openSess("cafe",avatar("B","sm"),"Plática");meet(true);
  const n=$("#snote");n.hidden=false;
  const head=()=>{n.hidden=false;n.innerHTML=`<div class="tbar"><b style="color:var(--ink)">Tema:</b><input type="text" id="tp" value="${esc(topic)}"><button id="tpb">Cambiar</button></div><div class="chips">${Object.values(FT).map(x=>`<button class="chip p" data-tt="${x.id}">${esc(x.es)}</button>`).join("")}</div>`;
    $("#tpb").onclick=()=>change($("#tp").value);n.querySelectorAll("[data-tt]").forEach(b=>b.onclick=()=>change(FT[b.dataset.tt].es))};
  let newTopic=null;const change=v=>{v=(v||"").trim();if(!v)return;newTopic=v;DB.settings.topic=v;save();answer("topic")};head();
  let useAI=aiOn(),hist=[],T0=topicOf(topic)||FT.dia,order=T0.qs.slice().sort(()=>Math.random()-.5),qi=0,pre=null,k=0,aiOut=null;
  const ask=said=>{setOrb("think","Emily está pensando…");return aiJSON(`You are Emily, a warm, playful, slightly flirty young American woman chatting BY VOICE with Stanley, a Mexican guy learning to SPEAK casual American English (beginner). Topic he chose (maybe in Spanish): "${topic}". Lead the chat: ask him ONE easy question at a time about the topic.
Conversation so far:\n${hist.slice(-16).join("\n")||"(you start)"}
${said==null?"Start with a short greeting and an easy question about the topic.":"His last line came from speech-to-text; ignore small glitches."}
Return JSON: {"ok":${said==null?"true":"false only if he said something a native would not say"},"better":"native way to say what he meant if not ok, else empty","better_es":"Mexican Spanish of better","better_pr":"pronunciation of better ${PRON_RULE}","reply":"your next line, max 2 short casual sentences with contractions, ending with ONE easy question","reply_es":"Mexican Spanish of reply","hints":[3 short answers he could give, each {"en":"","es":"","pr":"pronunciation ${PRON_RULE}"}]}`)};
  if(useAI){try{aiOut=await ask(null);guard(t)}catch(e){if(e===CANCEL)throw e;useAI=false;feedback({ok:false},"Seguimos sin inteligencia ("+aiErr(e)+")")}}
  if(!topicOf(topic)&&!useAI)feedback({ok:false},"Ese tema no lo tengo todavía. Platicamos de tu día, o toca uno de arriba.");
  while(true){guard(t);let line,hints;
    if(useAI&&aiOut){line={en:String(aiOut.reply||"Tell me more!"),es:String(aiOut.reply_es||"")};hints=(Array.isArray(aiOut.hints)?aiOut.hints:[]).filter(h=>h&&h.en)}
    else{if(qi>=order.length){order=T0.qs.slice().sort(()=>Math.random()-.5);qi=0}const Q=order[qi++];
      const open=k===0||pre==="new"?["Okay! Let's talk about "+T0.en+".","¡Va! Hablemos de "+T0.es+"."]:pre;
      line={en:(open?open[0]+" ":"")+Q.q[1],es:(open?open[1]+" ":"")+Q.q[2]};hints=Q.h;pre=null}
    setPhase("Plática con Emily","",`Tema: ${topic}`);head();
    const c=$("#scard");c.hidden=false;c.innerHTML=`<div class="who" style="color:var(--emily)">● Emily te pregunta<em>Contesta como quieras</em></div><div class="body"><div class="en ${line.en.length>38?"long":""}">${esc(line.en)}</div><div class="es">${esc(line.es)}</div></div><div class="draw">💬</div>`;
    hist.push("Emily: "+line.en);await npcSays(S,line,t,false);setProg((++k%10)/10||1);
    let said="";
    while(!said){const r=await listen(null,{wait:2600});guard(t);
      if(r.cmd==="topic")break;
      if(r.cmd==="help"){if(!c.querySelector(".hints")){c.insertAdjacentHTML("beforeend",`<div class="hints"><div class="cap">Puedes contestar algo así:</div>${(hints.length?hints:[{en:"Yeah, I like it.",es:"Sí, me gusta.",pr:"iéa, ái láikit"}]).map(h=>`<div class="hint"><span class="e">${esc(h.en)}</span><span class="s">${esc(h.es||"")}</span><span class="r">${esc(h.pr||"")}</span></div>`).join("")}</div>`)}
        slowNext=true;await speak(String((hints[0]||{en:"Yeah, I like it."}).en),"S");guard(t);continue}
      if(r.cmd==="repeat"||r.cmd==="slow"){if(r.cmd==="slow")slowNext=true;await npcSays(S,line,t,false);continue}
      const tx=(r.text||"").trim();if(norm(tx).length<2){feedback({ok:false},"Contéstale con una frase completa. Si no sabes, toca 💡 Ayuda.");continue}said=tx}
    if(newTopic){topic=newTopic;newTopic=null;T0=topicOf(topic)||FT.dia;order=T0.qs.slice().sort(()=>Math.random()-.5);qi=0;pre="new";hist.push("(Stanley changed the topic to: "+topic+")");
      if(useAI){try{aiOut=await ask(null)}catch(e){if(e===CANCEL)throw e;useAI=false}}continue}
    bubble("Y",said);hist.push("Stanley: "+said);addXP(5);save();
    if(useAI){try{aiOut=await ask(said);guard(t);
        if(aiOut&&aiOut.ok===false&&aiOut.better){const fix={en:String(aiOut.better),es:String(aiOut.better_es||""),pr:String(aiOut.better_pr||""),em:"✨",sc:"platica"};
          feedback({ok:false},"Un nativo lo diría así. Dilo tú:");await youSay(fix,"help",t,null,null,{label:"Así suena más natural",model:true})}else{feedback({ok:true},"¡Eso! Emily te entendió.");tone(true);cheer(true)}}
      catch(e){if(e===CANCEL)throw e;useAI=false;feedback({ok:false},"Seguimos sin inteligencia ("+aiErr(e)+")")}}
    else{const neg=/\b(no|not|nope|never|don't|dont|nah)\b/i.test(said);pre=pick(neg?REACT_NEG:REACT_POS);feedback({ok:true},"¡Eso! Emily te entendió.");tone(true);cheer(true)}
    await wait(400)}
}

/* arranque: si ya activó la voz humana antes, se carga sola desde la memoria del teléfono */
render();
if(DB.settings.human&&!(window.claude&&window.claude.use))setTimeout(()=>koLoad().catch(()=>{}),800);
</script>
