<title>Habla con Emily</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0E1024">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="3d/juego3d.css">
<style>
/* Layout: juego de iPhone. Pestañas abajo (Mundos · Gente · Yo). Cada misión abre a pantalla completa: arriba el mundo animado con los personajes, en medio tu tarjeta con el dibujo, abajo el micrófono. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F7F7FB; --ink:#0B0B14; --sub:#6B6B7D; --sep:rgba(60,60,67,.14); --fill:rgba(120,120,128,.12);
  --stan:#3557FF; --stan-soft:#E4E9FF; --emily:#FF3D7F; --emily-soft:#FFE3EC;
  --flame:#FF8A00; --flame-soft:#FFF0DC; --ok:#12A150; --ok-soft:#DDF5E7; --bad:#E5484D; --bad-soft:#FDE4E4;
  --brain:#7C4DFF; --brain-soft:#EEE7FF; --hero:#0E1024; --on-acc:#FFFFFF; --gold:#F5B400;
  --round:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,system-ui,sans-serif;
  --text:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --card2:#232326; --ink:#F5F5F7; --sub:#9C9CA8; --sep:rgba(84,84,88,.55); --fill:rgba(120,120,128,.26);
  --stan:#7088FF; --stan-soft:#1D2554; --emily:#FF6B9C; --emily-soft:#4A1729;
  --flame:#FF9F0A; --flame-soft:#3D2706; --ok:#30D158; --ok-soft:#0F3A1E; --bad:#FF6961; --bad-soft:#431615;
  --brain:#A585FF; --brain-soft:#2A1E52; --hero:#141833; --on-acc:#0B0B14; --gold:#FFD60A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --card2:#232326; --ink:#F5F5F7; --sub:#9C9CA8; --sep:rgba(84,84,88,.55); --fill:rgba(120,120,128,.26);
  --stan:#7088FF; --stan-soft:#1D2554; --emily:#FF6B9C; --emily-soft:#4A1729;
  --flame:#FF9F0A; --flame-soft:#3D2706; --ok:#30D158; --ok-soft:#0F3A1E; --bad:#FF6961; --bad-soft:#431615;
  --brain:#A585FF; --brain-soft:#2A1E52; --hero:#141833; --on-acc:#0B0B14; --gold:#FFD60A; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--stan);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--round);text-wrap:balance}
p{margin:0}
.page{max-width:560px;margin:0 auto;padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.large{font-size:2rem;font-weight:900;letter-spacing:-.02em}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cap{font-size:.76rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--sub)}
.sub{color:var(--sub)}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:99px;font-weight:900;font-family:var(--round);font-variant-numeric:tabular-nums}
.p-flame{background:var(--flame-soft);color:var(--flame)}
.p-xp{background:var(--stan-soft);color:var(--stan)}
.p-gold{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold)}
.card{background:var(--card);border-radius:22px;padding:16px}
.group{background:var(--card);border-radius:18px;overflow:hidden}
.group>*+*{border-top:1px solid var(--sep)}
.cell{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;text-align:left;min-height:56px}
.cell .grow{flex:1;min-width:0}
.cell strong{display:block;font-weight:800}
.cell small{color:var(--sub);display:block}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border-radius:18px;font-family:var(--round);font-weight:900;font-size:1.15rem;background:var(--stan);color:var(--on-acc);transition:transform .12s;box-shadow:0 5px 0 color-mix(in srgb,var(--stan) 60%,#000)}
.btn svg{width:24px;height:24px;flex:none}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--stan) 60%,#000)}
.btn.ghost{background:var(--fill);color:var(--ink);box-shadow:none}
.btn.pink{background:var(--emily);box-shadow:0 5px 0 color-mix(in srgb,var(--emily) 60%,#000)}
.btn.small{padding:10px 14px;font-size:.95rem;border-radius:12px;width:auto;box-shadow:none}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1;min-width:130px}
.warn{background:var(--bad-soft);border-radius:14px;padding:12px 14px}
.link{color:var(--sub);text-decoration:underline;padding:6px;font-size:.9rem}
input[type=password]{width:100%;font:inherit;color:var(--ink);background:var(--card2);border:1px solid var(--sep);border-radius:12px;padding:12px}
select{font:inherit;color:var(--ink);background:var(--card2);border:1px solid var(--sep);border-radius:10px;padding:9px 10px}
.prog{height:10px;border-radius:9px;background:var(--fill);overflow:hidden}
.prog u{display:block;height:100%;border-radius:9px;background:var(--ok);transition:width .4s}

/* ---------- personas (dibujos con gestos) ---------- */
.p{position:relative;width:var(--sz,84px);height:calc(var(--sz,84px)*1.15);flex:none;transition:transform .35s cubic-bezier(.2,.8,.2,1),filter .3s}
.p svg{width:100%;height:100%;overflow:visible;display:block}
.p .mouths,.p .eyes{transform-box:fill-box;transform-origin:center}
.p.talk .mouths{animation:talk .15s ease-in-out infinite alternate}
.p .eyes{animation:blink 4.8s infinite}
.p.e-laugh svg{animation:laughb .35s ease-in-out infinite alternate}
.p.e-angry svg{animation:shake .35s ease-in-out 3}
.p.e-angry{filter:drop-shadow(0 0 10px rgba(255,40,40,.55))}
.p.e-scared svg{animation:shake .15s linear infinite}
.p.e-happy svg,.p.e-flirty svg{animation:sway 1.6s ease-in-out infinite alternate}
.p .tears{animation:tear 1s linear infinite}
.p.spk{transform:scale(1.12) translateY(-4px);z-index:2}
.p .nm{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);font-size:.64rem;font-weight:900;font-family:var(--round);padding:2px 7px;border-radius:99px;color:#fff;background:rgba(0,0,0,.65);white-space:nowrap}
.p.me .nm{background:var(--stan)}
.p .emo{position:absolute;right:-6px;top:-6px;font-size:1.4rem;opacity:0;transform:scale(.3);transition:.25s}
.p .emo.on{opacity:1;transform:scale(1)}
.p.dog .tail{transform-origin:20px 100px;animation:wag .3s ease-in-out infinite alternate}
@keyframes talk{from{transform:scaleY(.4)}to{transform:scaleY(1.25)}}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes laughb{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-6px) rotate(3deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
@keyframes tear{from{transform:translateY(0);opacity:1}to{transform:translateY(16px);opacity:0}}
@keyframes wag{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
@keyframes ping{from{transform:scale(.95);opacity:.8}to{transform:scale(1.25);opacity:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40%)}to{transform:none}}
@keyframes pop{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-6px)}}

/* ---------- escena (cada lugar es un mundo aparte) ---------- */
.scene{position:relative;height:clamp(190px,30vh,250px);border-radius:24px;overflow:hidden;flex:none;background:linear-gradient(var(--sky1),var(--sky2) 62%,var(--floor) 62%);isolation:isolate}
.scene .far,.scene .near{position:absolute;left:0;white-space:nowrap;width:max-content;display:flex;gap:30px;animation:scroll var(--spd,40s) linear infinite;animation-play-state:paused}
.scene .far{top:14%;font-size:30px;opacity:.45;filter:saturate(.7)}
.scene .near{top:34%;font-size:40px;--spd:22s}
.scene.walk .far,.scene.walk .near{animation-play-state:running}
.scene .fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.scene .fx span{position:absolute;font-size:22px;will-change:transform}
.scene .cast{position:absolute;left:0;right:0;bottom:6px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 10px;z-index:2}
.scene .cast .npcs{display:flex;align-items:flex-end;gap:2px}
.scene .npcs .p{transform:translateX(160%);opacity:0}
.scene.meet .npcs .p{transform:none;opacity:1}
.scene.meet .npcs .p.spk{transform:scale(1.12) translateY(-4px)}
.scene.walk .p.me{animation:bob .4s ease-in-out infinite alternate}
.scene .say{position:absolute;top:28px;max-width:72%;background:#fff;color:#0B0B14;border-radius:16px;padding:8px 12px;font-weight:800;font-size:.92rem;line-height:1.25;box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;transform:translateY(6px) scale(.95);transition:.22s;z-index:4}
.scene .say small{display:block;font-weight:500;color:#555;font-size:.78rem;margin-top:2px}
.scene .say b{display:block;font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:#888}
.scene .say.on{opacity:1;transform:none}
.scene .say.me{background:#3557FF;color:#fff}
.scene .say.me b{color:#c8d3ff}
.scene .place{position:absolute;left:10px;top:8px;font-size:.62rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.75);background:rgba(0,0,0,.25);padding:2px 8px;border-radius:99px;z-index:1}
.scene.night::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at 20% 20%,rgba(255,0,170,.35),transparent 40%),radial-gradient(circle at 80% 10%,rgba(0,200,255,.3),transparent 40%);animation:neon 2.4s ease-in-out infinite alternate}
.scene.siren::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;animation:siren 1s steps(2) infinite}
.scene.shake{animation:shake .3s ease-in-out 2}
@keyframes neon{from{opacity:.5;filter:hue-rotate(0)}to{opacity:1;filter:hue-rotate(90deg)}}
@keyframes siren{0%{background:rgba(255,0,0,.18)}50%{background:rgba(0,80,255,.18)}}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes floatup{from{transform:translateY(0) rotate(0);opacity:0}15%{opacity:1}to{transform:translateY(-260px) rotate(30deg);opacity:0}}
@keyframes fall{from{transform:translateY(-40px) rotate(0);opacity:0}15%{opacity:1}to{transform:translateY(280px) rotate(160deg);opacity:0}}
@keyframes drift{from{transform:translateX(0);opacity:0}15%{opacity:1}to{transform:translateX(-420px);opacity:0}}

/* ---------- mapa de mundos ---------- */
.world{position:relative;border-radius:26px;overflow:hidden;color:#fff;min-height:150px;padding:16px;display:grid;gap:6px;align-content:end;text-align:left;width:100%}
.world .bgS{position:absolute;inset:0;z-index:0}
.world>*:not(.bgS){position:relative;z-index:1}
.world h2{font-size:1.45rem;font-weight:900;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.world .wbar{height:8px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden}
.world .wbar u{display:block;height:100%;background:#fff;border-radius:9px}
.world.lock{filter:grayscale(.85) brightness(.75)}
.world .lockb{position:absolute;right:14px;top:14px;font-size:1.6rem;z-index:2}
.mapw{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:var(--bg)}
.mapw .head{position:relative;height:200px;flex:none}
.mapw .head .scene{height:100%;border-radius:0}
.mapw .head .htxt{position:absolute;left:0;right:0;bottom:0;padding:16px max(16px,env(safe-area-inset-left,0px));z-index:5;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.mapw .head .htxt h2{font-size:1.6rem;font-weight:900}
.mapw .xb{position:absolute;left:14px;top:max(14px,env(safe-area-inset-top,0px));z-index:6;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:1.2rem;font-weight:900}
.path{flex:1;overflow-y:auto;padding:22px 16px calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:14px}
.node{display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .2s}
.node .dot{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-size:2rem;background:var(--card);box-shadow:0 6px 0 var(--sep),0 0 0 4px var(--fill);position:relative}
.node.done .dot{background:var(--gold);box-shadow:0 6px 0 color-mix(in srgb,var(--gold) 55%,#000)}
.node.now .dot{background:var(--stan);box-shadow:0 6px 0 color-mix(in srgb,var(--stan) 55%,#000);animation:bob .7s ease-in-out infinite alternate}
.node.now .dot::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--stan);animation:ping 1.6s ease-out infinite}
.node.lock .dot{filter:grayscale(1);opacity:.5}
.node .lbl{font-weight:800;font-size:.82rem;max-width:170px;text-align:center;line-height:1.15}
.node .st{color:var(--gold);font-size:.8rem;letter-spacing:1px}

/* ---------- gente ---------- */
.ppl{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pcard{background:var(--card);border-radius:20px;padding:12px;display:grid;justify-items:center;gap:4px;text-align:center}
.pcard .p{--sz:76px}
.pcard b{font-family:var(--round);font-weight:900}
.pcard small{color:var(--sub);font-size:.78rem}
.pcard.unk{opacity:.45;filter:grayscale(1)}
.hearts{color:var(--emily);letter-spacing:1px;font-size:.85rem}
.mem{background:var(--card2);border-radius:12px;padding:8px 10px;font-size:.88rem}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--card);border-radius:18px;padding:14px}
.stat b{display:block;font-family:var(--round);font-size:1.7rem;font-weight:900;font-variant-numeric:tabular-nums}
.stat span{color:var(--sub);font-size:.85rem;font-weight:600}
.hero{background:var(--hero);color:#fff;border-radius:26px;padding:16px;display:grid;gap:12px;position:relative;overflow:hidden}
.hero .scene{height:150px;border-radius:18px}
.hero .cap{color:rgba(255,255,255,.65)}
.hero h2{font-size:1.5rem;font-weight:900}
.vbanner{display:flex;gap:12px;align-items:center;background:var(--emily-soft);border-radius:18px;padding:12px 14px}
.vbanner b{display:block}

/* ---------- pestañas ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);
  background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{display:grid;justify-items:center;gap:2px;padding:8px 0 6px;font-size:.7rem;font-weight:700;color:var(--sub)}
.tabs button span.i{font-size:1.5rem;line-height:1;filter:grayscale(1);opacity:.7}
.tabs button.on{color:var(--stan)}
.tabs button.on span.i{filter:none;opacity:1}

/* ---------- misión ---------- */
.sess{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.sess .in{max-width:560px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;gap:9px;min-height:0;
  padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px));
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.shead{display:flex;align-items:center;gap:10px;flex:none}
.xbtn{width:36px;height:36px;border-radius:50%;background:var(--fill);display:grid;place-items:center;flex:none;font-weight:900}
.pbar{flex:1;height:12px;border-radius:9px;background:var(--fill);overflow:hidden}
.pbar u{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),#7CF29A);border-radius:9px;transition:width .4s}
.combo{font-family:var(--round);font-weight:900;color:var(--flame);min-width:54px;text-align:right}
.combo.pop{animation:pop .4s}
.sinfo{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex:none}
.phase{font-family:var(--round);font-weight:900;font-size:1rem}
.scard{background:var(--card);border-radius:22px;padding:13px 15px;display:grid;grid-template-columns:1fr auto;gap:5px 12px;align-items:start;flex:0 1 auto;min-height:0;overflow-y:auto}
.scard .who{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-weight:900;font-family:var(--round);font-size:.86rem;color:var(--stan)}
.scard .who em{margin-left:auto;font-style:normal;font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;color:var(--sub)}
.scard .body{display:grid;gap:5px;min-width:0}
.scard .draw{font-size:2.6rem;line-height:1;letter-spacing:1px;animation:wobble 2.2s ease-in-out infinite;transform-origin:50% 80%;text-align:center;max-width:116px;overflow-wrap:anywhere}
@keyframes wobble{0%,100%{transform:rotate(-7deg) scale(1)}50%{transform:rotate(7deg) scale(1.1)}}
.en{font-family:var(--round);font-weight:900;font-size:clamp(1.25rem,5.4vw,1.75rem);line-height:1.12}
.en.long{font-size:clamp(1.08rem,4.6vw,1.4rem)}
.en.hide{font-family:var(--text);font-weight:800;font-size:1.15rem}
.pr{font-style:italic;font-size:1.05rem;color:var(--emily);font-weight:700}
.es{color:var(--sub)}
.tri{display:grid;grid-template-columns:1fr;gap:0}
.tri .k{font-size:.6rem;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:var(--sub);margin-top:4px}
.tri .k:first-child{margin-top:0}
.tri .fo{font-weight:700;color:var(--sub)}
.tri .en{font-size:clamp(1.15rem,5vw,1.55rem)}
.pw{background-repeat:no-repeat;background-size:100% 4px;background-position:0 100%;padding-bottom:3px;cursor:pointer;color:inherit}
.plegend{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:6px}
.plegend span{font-size:.66rem;font-weight:900;color:var(--c);display:inline-flex;align-items:center;gap:4px}
.plegend span::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--c)}
.temple{background:linear-gradient(#1A2559,#0E1638);border-radius:26px;padding:18px 12px 0;color:#fff;overflow:hidden;position:relative}
.temple .roof{margin:0 6px;background:linear-gradient(#F4EFE6,#D9D2C3);color:#5A5048;font-family:var(--round);font-weight:900;font-size:clamp(.7rem,3.4vw,.95rem);letter-spacing:.08em;text-align:center;padding:10px 4px;clip-path:polygon(6% 0,94% 0,100% 100%,0 100%);animation:fade 1s}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 6px}
.cols.small .col{height:170px}
.col{display:flex;flex-direction:column;align-items:center;height:230px;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.col .cap2{width:100%;background:linear-gradient(#F4EFE6,#D9D2C3);color:#5A5048;font-weight:900;font-size:clamp(.55rem,2.7vw,.78rem);padding:8px 2px;border-radius:4px;text-align:center;border-bottom:4px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col .shaft{flex:1;width:62%;background:repeating-linear-gradient(90deg,#EDE7DC 0 6px,#D6CEBF 6px 9px);display:flex;align-items:center;justify-content:center;position:relative}
.col .band{position:absolute;left:50%;transform:translateX(-50%);background:var(--c);color:#fff;font-weight:900;font-size:clamp(.5rem,2.4vw,.7rem);padding:5px 7px;border-radius:7px;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.35);text-transform:uppercase;letter-spacing:.04em}
.col .base{width:80%;height:10px;background:#D9D2C3}
.col:active{transform:scale(.96)}

function formal(en){let s=en.replace(/[’]/g,"'");FORMAL.forEach(([re,r])=>{s=s.replace(re,(...a)=>{const m=a[0];let out=r.replace(/\$(\d)/g,(_,i)=>a[+i]);if(/^[A-Z]/.test(m)&&/^[a-z]/.test(out))out=out[0].toUpperCase()+out.slice(1);return out})});return s}
function nvn(y){return y.norm?`<div class="nvn"><div class="nb"><span>🙅 normal</span><b>${esc(y.norm)}</b></div><div class="arr">➜</div><div class="nb nat"><span>🗣️ nativo</span><b>${esc(y.en)}</b></div></div>`:""}
function threeForms(y){const f=formal(y.en),same=f.replace(/\W/g,"").toLowerCase()===y.en.replace(/\W/g,"").toLowerCase();
  return `${nvn(y)}<div class="tri"><span class="k">✍️ Se escribe</span><span class="v fo">${same?"<i>igual</i>":esc(f)}</span>
   <span class="k">🗣️ Los nativos dicen <small style="text-transform:none;letter-spacing:0">(toca una palabra)</small></span><span class="v en ${y.en.length>38?"long":""}">${colorize(y.en)}</span>
   ${typeof oyeHTML==="function"?oyeHTML(y):""}<span class="k">👄 Se lee</span><span class="v pr">${esc(y.pr)}</span><span class="k">🇲🇽 Significa</span><span class="v es">${esc(y.es)}</span>${legendOf(y.en)}</div>`}
const lastSpeaker=(m,idx)=>{for(let i=idx-1;i>=0;i--)if(m.steps[i].k==="N")return m.steps[i];return null};

/* tu turno: devuelve true si salió a la primera. Si dices otra cosa, el personaje te sigue la corriente */
async function youSay(y,mode,t,ctx){
  ctx=ctx||{};let first=true,heard=false;showYou(y,mode,ctx.label);feedback(null);
  const who=ctx.npc?ctx.npc.who:(ctx.m&&ctx.m.cast[0])||"emily";
  if(mode==="help"&&ctx.model){slowNext=true;await say(y.en,"stanley");guard(t);heard=true}
  while(true){guard(t);const r=await listen(y,{lenient:mode==="recall"});guard(t);
    if(r.cmd==="repeat"||r.cmd==="slow"){if(r.cmd==="slow")slowNext=true;if(ctx.npc){bubble(ctx.npc.who,ctx.npc.en,ctx.showEs?ctx.npc.es:"");await say(ctx.npc.en,ctx.npc.who,ctx.npc.emo)}else await say(y.en,"stanley");guard(t);continue}
    if(r.cmd==="help"){if(mode==="recall"||mode==="native"){reveal(y);first=false}feedback("ok","Así se dice. Escúchalo y dilo tú.");slowNext=true;await say(y.en,"stanley");guard(t);heard=true;continue}
    if(!r.text)continue;
    /* dijo la versión de libro: el personaje se burla tantito y no pasa */
    if(y.norm&&!compareY(y,r.text,true).ok&&compare1(y.norm,r.text,true).ok){first=false;sfx("fun");bubble("stanley",r.text);await wait(400);guard(t);
      const tb=pick([["Ha! You sound like a textbook. Say it like us!","¡Ja! Suenas a libro. ¡Dilo como nosotros!"],["Okay, professor! Now say it like a normal person.","¡Ok, profe! Ahora dilo como persona normal."],["Bro, nobody talks like that. Try again!","Nadie habla así. ¡Otra vez!"]]);
      bubble(who,tb[0],tb[1]);await say(tb[0],who,"laugh");guard(t);reveal(y);feedback("fun",`📚 Eso es de libro. Un nativo dice: <b>${esc(y.en)}</b>`);continue}
    const c=compareY(y,r.text,mode==="recall"||mode==="native");
    if(c.ok){record(y,true,c,first);bubble("stanley",y.en);combo=first?combo+1:0;DB.bestCombo=Math.max(DB.bestCombo||0,combo);addXP(first?10+Math.min(combo,10)*2:4);showCombo();
      sfx(combo>=3?"combo":"ok");setEmo("stanley","happy");setOrb("ok",combo>=3?"¡Combo x"+combo+"!":"¡Bien!");feedback("ok",pick(["¡Eso!","¡Así mero!","¡Como gringo!","¡Perfecto!","¡Qué nivel!"]));
      if(ctx.npc&&ctx.npc.who)relAdd(ctx.npc.who,1);await wait(380);guard(t);setEmo("stanley","neutral");return first}
    /* ¿dijo otra cosa (no un intento)? -> el personaje reacciona */
    const it=intentOf(r.text);
    if(c.hit<0.35||(it!=="other"&&c.hit<0.6)){
      let rx=await aiReaction(who,r.text,y,ctx.m);guard(t);if(!rx)rx=reaction(who,it,ctx.m);
      if(it==="compliment"||it==="flirt"||it==="love")relAdd(who,2);if(it==="insult"&&!(ctx.m&&ctx.m.w===FIGHT_W))relAdd(who,-2);
      sfx("fun");bubble("stanley",r.text);await wait(500);guard(t);bubble(who,rx.en,rx.es);await say(rx.en,who,rx.emo);guard(t);
      feedback("fun",`😏 ${esc(CH(who).name)} te siguió la corriente. Ahora sí, di tu línea.`);setEmo(who,"neutral");continue}
    record(y,false,c,first);combo=0;showCombo();sfx("bad");setEmo("stanley","sad");setOrb("bad","Otra vez");first=false;
    feedback("bad",c.heardWords.length?"Casi. Te faltó lo marcado: "+c.words.map((w,i)=>c.miss[i]?"<mark>"+esc(w)+"</mark>":esc(w)).join(" "):"No te escuché bien. Acerca el teléfono o usa audífonos.");
    if(mode==="recall")reveal(y);await wait(500);guard(t);slowNext=heard;await say(y.en,"stanley");heard=true;guard(t);setEmo("stanley","neutral")}}

async function round(m,mode,t,showEs,p0,pN){let errs=0,k=0;const n=m.steps.length,model=mode==="help"&&m.w<=2;
  for(let i=0;i<n;i++){const s=m.steps[i],nx=m.steps[i+1];guard(t);
    if(nx&&nx.k==="N")prefetch(nx.en,nx.who);
    if(s.k==="N"){bubble(s.who,s.en,showEs?s.es:"");setEmo(s.who,s.emo);await say(s.en,s.who,s.emo);guard(t);await wait(180)}
    else{const ok=await youSay(s,mode,t,{npc:lastSpeaker(m,i),m,model,showEs});if(!ok)errs++;await wait(200)}
    setProg(p0+(pN-p0)*(++k/n))}
  return errs}
async function intro(m,t){return new Promise((res,rej)=>{const s=$("#sess .in");const o=document.createElement("div");o.className="over";
  o.innerHTML=`<div class="box"><span class="cap">Mundo ${m.w} · Misión ${m.o}</span><b class="t">${esc(m.t)}</b>${HUD3D()?"":`<div class="castrow">${m.cast.map(id=>personHTML(id,64)).join("")}</div>`}
   <p class="sub">${m.cast.map(id=>esc(CH(id).name)).join(", ")}${m.cast.some(id=>DB.met[id])?" · ya los conoces":""}</p>${m.n?`<p>💡 ${esc(m.n)}</p>`:""}
   <button class="btn" id="go1">¡Dale! 🎬</button></div>`;
  s.parentNode.appendChild(o);o.querySelectorAll(".p").forEach(p=>{p.classList.remove("e-neutral");p.classList.add("e-happy")});
  o.querySelector("#go1").onclick=()=>{unlockAudio();o.remove();res()}})}
async function runMission(m,t){
  openSess(m);combo=0;showCombo();await intro(m,t);guard(t);
  walk(true);await wait(1300);guard(t);walk(false);meet(true);await wait(800);guard(t);
  const own=m.steps.filter(s=>s.k==="Y"),warm=weakItems(2,own).concat(dueItems(2,own)).slice(0,2);
  if(warm.length){setPhase("Calentamiento 🔥");for(const y of warm)await youSay(y,"recall",t,{npc:null,m,label:"Repaso rápido"})}
  const fast=(DB.hot||0)>=3&&!DB.ms[m.id];let errs;
  if(!fast){setPhase("Ronda 1 · con ayuda");await round(m,"help",t,true,0,.5)}else{setPhase("Modo rápido ⚡");feedback("fun","Vas que vuelas: hoy te salto la ronda con ayuda.")}
  setPhase("Ronda 2 · sin ayuda");feedback("fun","Ahora tú solo. Sólo ves la idea y el dibujo.");walk(true);await wait(700);walk(false);
  errs=await round(m,"recall",t,m.w<5,fast?0:.5,1);
  let stars=errs===0?3:errs<=Math.ceil(m.ys*.25)?2:errs<=Math.ceil(m.ys*.5)?1:0;
  if(stars===0){setPhase("Otra pasadita");feedback("fun","Se te atoró bastante. Te regreso un pasito: con ayuda y luego sin ayuda.");await round(m,"help",t,true,0,.5);errs=await round(m,"recall",t,true,.5,1);stars=errs===0?2:errs<=Math.ceil(m.ys*.5)?1:0}
  const prev=DB.ms[m.id]||{};DB.ms[m.id]={stars:Math.max(prev.stars||0,stars),tries:(prev.tries||0)+1,last:Date.now()};
  DB.hot=stars===3?(DB.hot||0)+1:0;m.cast.forEach(id=>{DB.met[id]=(DB.met[id]||0)+1;relAdd(id,stars)});
  if(stars>0)m.mems.forEach(x=>memAdd(x.who,x.key,x.en,x.es,m.id));
  const before=rankOf(DB.xp).r[1],xp=stars*25+10;addXP(xp);save();const after=rankOf(DB.xp).r[1];
  await win(m,stars,xp,after!==before?after:null,t);return stars}
async function win(m,stars,xp,newRank,t){const sess=$("#sess");if(!sess)return;const o=document.createElement("div");o.className="over";const star=m.cast.find(id=>!CH(id).dog)||m.cast[0];
  const msg=stars===3?"¡Perfecta! Hablaste como nativo.":stars===2?"¡Muy bien! Pasas.":stars===1?"Pasas, pero esta va a regresar en tus calentamientos.":"Todavía no. Lo que fallaste va a tus repasos y la repetimos.";
  o.innerHTML=`<div class="box">${HUD3D()?"":personHTML(star,110)}<span class="big">${starStr(stars)}</span><b class="t">${stars?"¡Misión superada!":"Casi…"}</b><p class="sub">${msg}</p>
   <span class="xp">+${xp} XP ${DB.bestCombo?"· mejor combo x"+DB.bestCombo:""}</span>${newRank?`<p style="font-weight:900">🎖️ ¡Subiste de rango: ${esc(newRank)}!</p>`:""}
   ${m.mems.length&&stars?`<p class="sub">🧠 ${m.mems.map(x=>esc(CH(x.who).name)).join(", ")} se va a acordar de esto.</p>`:""}
   <button class="btn" id="nx1">${stars?(view==="ciudad"?"Seguir jugando ▶":"Siguiente misión ▶"):"Intentar otra vez ↻"}</button><button class="link" id="nx0">Salir</button></div>`;
  sess.appendChild(o);if(o.querySelector(".p"))o.querySelector(".p").classList.add(stars?(CH(star).gender==="f"&&m.w>=5?"e-flirty":"e-laugh"):"e-sad");
  sfx(stars?"win":"bad");if(stars)confetti();
  say(stars===3?pick(["Awesome! You nailed it!","Yo, that was fire!","Look at you, talking like a local!"]):stars?"Nice job, Stanley!":"Don't worry, we'll try again.",star);
  return new Promise(res=>{o.querySelector("#nx1").onclick=()=>{unlockAudio();o.remove();res("next")};o.querySelector("#nx0").onclick=()=>{token++;o.remove();endSess();res("exit")}})}
function playFrom(m,single){if(!canRun()||!m)return;unlockAudio();running=true;const t=++token;
  (async()=>{let cur=m,fails=0;while(cur){guard(t);const st=await runMission(cur,t);guard(t);
      if(st===0){fails++;if(fails>=2&&cur.i>0){const prev=MISSIONS[cur.i-1];toast("Un paso atrás: repasamos la anterior");await runMission(prev,t);fails=0}continue}
      fails=0;if(single)break;cur=MISSIONS[cur.i+1]||null}})()
  .catch(e=>{if(e!==CANCEL)console.error(e)}).finally(()=>{if(t===token)endSess()})}
