<title>Habla con Emily</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F2F2F7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de iPhone. Pantallas por pestañas (Hoy · Ruta · Cerebro · Yo) con barra inferior; la práctica abre a pantalla completa con Stanley y Emily animados arriba y el micrófono abajo. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F7F7FB; --ink:#0B0B14; --sub:#6B6B7D; --sep:rgba(60,60,67,.14); --fill:rgba(120,120,128,.12);
  --stan:#3557FF; --stan-soft:#E4E9FF; --emily:#FF3D7F; --emily-soft:#FFE3EC;
  --flame:#FF8A00; --flame-soft:#FFF0DC; --ok:#12A150; --ok-soft:#DDF5E7; --bad:#E5484D; --bad-soft:#FDE4E4;
  --brain:#7C4DFF; --brain-soft:#EEE7FF; --hero:#10142B; --hero-ink:#FFFFFF; --on-acc:#FFFFFF;
  --skin-a:#C68A5E; --skin-b:#F2C6A2; --hair-a:#2A1D16; --hair-b:#7A4A2A;
  --round:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,system-ui,sans-serif;
  --text:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --card2:#232326; --ink:#F5F5F7; --sub:#9C9CA8; --sep:rgba(84,84,88,.55); --fill:rgba(120,120,128,.26);
  --stan:#7088FF; --stan-soft:#1D2554; --emily:#FF6B9C; --emily-soft:#4A1729;
  --flame:#FF9F0A; --flame-soft:#3D2706; --ok:#30D158; --ok-soft:#0F3A1E; --bad:#FF6961; --bad-soft:#431615;
  --brain:#A585FF; --brain-soft:#2A1E52; --hero:#1A1F3D; --on-acc:#0B0B14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --card2:#232326; --ink:#F5F5F7; --sub:#9C9CA8; --sep:rgba(84,84,88,.55); --fill:rgba(120,120,128,.26);
  --stan:#7088FF; --stan-soft:#1D2554; --emily:#FF6B9C; --emily-soft:#4A1729;
  --flame:#FF9F0A; --flame-soft:#3D2706; --ok:#30D158; --ok-soft:#0F3A1E; --bad:#FF6961; --bad-soft:#431615;
  --brain:#A585FF; --brain-soft:#2A1E52; --hero:#1A1F3D; --on-acc:#0B0B14; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--stan);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--round);text-wrap:balance}
p{margin:0}
.page{max-width:560px;margin:0 auto;padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.large{font-size:2.1rem;font-weight:900;letter-spacing:-.02em}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cap{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sub)}
.sub{color:var(--sub)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-weight:800;font-family:var(--round);font-variant-numeric:tabular-nums}
.pill svg{width:18px;height:18px}
.p-flame{background:var(--flame-soft);color:var(--flame)}
.p-xp{background:var(--stan-soft);color:var(--stan)}
.card{background:var(--card);border-radius:22px;padding:16px}
.group{background:var(--card);border-radius:18px;overflow:hidden}
.group>*+*{border-top:1px solid var(--sep)}
.cell{display:flex;align-items:center;gap:12px;padding:13px 16px;width:100%;text-align:left;min-height:56px}
.cell .grow{flex:1;min-width:0}
.cell strong{display:block;font-weight:600}
.cell small{color:var(--sub);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{color:var(--sub);flex:none}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 4px}
.sec-t h3{font-size:1.25rem;font-weight:800}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border-radius:16px;font-family:var(--round);font-weight:800;font-size:1.12rem;background:var(--stan);color:var(--on-acc);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn svg{width:24px;height:24px}
.btn.ghost{background:var(--fill);color:var(--ink)}
.btn.purple{background:var(--brain)}
.btn.small{padding:10px 14px;font-size:.95rem;border-radius:12px;width:auto}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1;min-width:130px}

/* ---------- héroe ---------- */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:26px;padding:18px;display:grid;gap:14px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,61,127,.35),transparent 65%);right:-90px;top:-110px}
.hero::after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(53,87,255,.45),transparent 65%);left:-90px;bottom:-130px}
.hero>*{position:relative;z-index:1}
.stage{display:flex;align-items:flex-end;justify-content:center;gap:18px}
.bubble{background:#fff;color:#0B0B14;border-radius:18px;padding:10px 14px;font-weight:600;position:relative}
.bubble::after{content:"";position:absolute;left:70%;bottom:-8px;border:9px solid transparent;border-top-color:#fff;border-bottom:0}
.hero .cap{color:rgba(255,255,255,.65)}
.hero h2{font-size:1.5rem;font-weight:900}
.ringrow{display:flex;align-items:center;gap:14px}
.ring{flex:none;width:58px;height:58px}
.ring circle{fill:none;stroke-width:7}
.ring .bgc{stroke:rgba(255,255,255,.15)}
.ring .fgc{stroke:var(--flame);stroke-linecap:round;transition:stroke-dashoffset .6s}

/* ---------- avatares ---------- */
.av{width:96px;height:96px;flex:none;position:relative}
.av.sm{width:64px;height:64px}
.av svg{width:100%;height:100%;overflow:visible}
.av .mouth{transform-box:fill-box;transform-origin:center;transform:scaleY(.35)}
.av.talk .mouth{animation:talk .16s ease-in-out infinite alternate}
.av .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.av.b .eye{animation-delay:1.3s}
.av.listen::before{content:"";position:absolute;inset:-5px;border-radius:50%;border:4px solid var(--stan);animation:ping 1.2s ease-out infinite}
.av.happy svg{animation:hop .5s ease}
.av.sad svg{animation:shake .4s ease}
.av .tag{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);font-size:.7rem;font-weight:800;font-family:var(--round);padding:2px 8px;border-radius:99px;color:#fff;white-space:nowrap}
.av.a .tag{background:var(--stan)} .av.b .tag{background:var(--emily)}
@keyframes talk{from{transform:scaleY(.25)}to{transform:scaleY(1.15)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes ping{from{transform:scale(.95);opacity:.8}to{transform:scale(1.25);opacity:0}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---------- plan semanal ---------- */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:grid;gap:4px;justify-items:center;padding:8px 0;border-radius:14px;background:var(--card)}
.day b{font-family:var(--round);font-weight:900;font-size:1.05rem}
.day span{font-size:.62rem;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.04em}
.day i{width:22px;height:5px;border-radius:9px;background:var(--fill);overflow:hidden;display:block}
.day i u{display:block;height:100%;background:var(--ok)}
.day.now{background:var(--stan);color:var(--on-acc)}
.day.now span{color:inherit;opacity:.8}
.day.now i{background:rgba(255,255,255,.3)} .day.now i u{background:var(--on-acc)}
.day.done b{color:var(--ok)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:99px;background:var(--bad-soft);color:var(--bad);font-weight:700;font-size:.9rem}
.chip.p{background:var(--brain-soft);color:var(--brain)}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff;font-family:var(--round);font-weight:900}
.ico svg{width:22px;height:22px}

/* ---------- ruta ---------- */
.stagehead{display:flex;align-items:center;gap:12px;padding:0 4px}
.stagehead .bar{height:8px;border-radius:9px;background:var(--fill);overflow:hidden}
.stagehead .bar u{display:block;height:100%;border-radius:9px}
.unum{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--round);font-weight:900;flex:none;background:var(--fill);color:var(--sub)}
.unum.done{background:var(--ok);color:#fff}
.unum.now{background:var(--stan);color:#fff;box-shadow:0 0 0 4px var(--stan-soft)}
.cell.lock{opacity:.55}
.tagday{font-size:.72rem;font-weight:800;color:var(--sub);background:var(--fill);padding:3px 8px;border-radius:99px;flex:none}

/* ---------- cerebro ---------- */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--fill);border-radius:12px;padding:3px}
.seg button{padding:8px;border-radius:10px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.graphbox{position:relative;background:var(--card);border-radius:22px;overflow:hidden;touch-action:none}
.graphbox canvas{display:block;width:100%;height:380px}
.gtools{position:absolute;right:10px;top:10px;display:grid;gap:6px}
.gtools button{width:36px;height:36px;border-radius:10px;background:var(--card2);font-weight:900;font-size:1.2rem;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--sub);padding:0 4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.detail{display:grid;gap:10px}
.notebody{white-space:pre-wrap;overflow-wrap:anywhere}
.wl{color:var(--brain);font-weight:700;background:var(--brain-soft);border-radius:6px;padding:0 4px}
.phr{display:grid;gap:2px;padding:10px 16px}
.phr .e{font-weight:700} .phr .s{color:var(--sub);font-size:.92rem} .phr .r{font-style:italic;font-size:.92rem;color:var(--emily)}

/* ---------- yo ---------- */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--card);border-radius:18px;padding:14px}
.stat b{display:block;font-family:var(--round);font-size:1.8rem;font-weight:900;font-variant-numeric:tabular-nums}
.stat span{color:var(--sub);font-size:.85rem;font-weight:600}
.hbar{display:grid;grid-template-columns:110px 1fr 34px;align-items:center;gap:10px;padding:8px 16px}
.hbar .w{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .t{height:10px;border-radius:9px;background:var(--fill);overflow:hidden}
.hbar .t u{display:block;height:100%;background:var(--bad);border-radius:9px}
.hbar .n{text-align:right;color:var(--sub);font-variant-numeric:tabular-nums;font-size:.85rem}
select{font:inherit;color:var(--ink);background:var(--card2);border:1px solid var(--sep);border-radius:10px;padding:9px 10px}
input[type=text],input[type=password],textarea{width:100%;font:inherit;color:var(--ink);background:var(--card2);border:1px solid var(--sep);border-radius:12px;padding:12px}
textarea{min-height:160px;resize:vertical}
code{font-size:.85em;background:var(--fill);padding:1px 5px;border-radius:5px}

/* ---------- barra de pestañas ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);
  background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{display:grid;justify-items:center;gap:2px;padding:8px 0 6px;font-size:.68rem;font-weight:600;color:var(--sub)}
.tabs button svg{width:26px;height:26px}
.tabs button.on{color:var(--stan)}

/* ---------- sesión (pantalla completa) ---------- */
.sess{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.sess .in{max-width:560px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;gap:12px;min-height:0;
  padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:max(14px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shead{display:flex;align-items:center;gap:12px}
.xbtn{width:36px;height:36px;border-radius:50%;background:var(--fill);display:grid;place-items:center;flex:none}
.xbtn svg{width:18px;height:18px}
.pbar{flex:1;height:10px;border-radius:9px;background:var(--fill);overflow:hidden}
.pbar u{display:block;height:100%;width:0;background:var(--ok);border-radius:9px;transition:width .4s}
.sinfo{display:flex;justify-content:space-between;align-items:center;gap:10px}
.phase{font-family:var(--round);font-weight:900;font-size:1.05rem}
.sstage{display:flex;justify-content:space-between;align-items:flex-end;padding:4px 18px}
.snote{font-size:.9rem;color:var(--sub);background:var(--card);border-radius:14px;padding:10px 12px}
.snote b{color:var(--ink)}
.schat{display:flex;flex-direction:column;gap:6px;overflow-y:auto;flex:none;max-height:18vh}
.bub{max-width:82%;padding:7px 12px;border-radius:16px;font-size:.9rem}
.bub.a{align-self:flex-end;background:var(--stan);color:#fff;border-bottom-right-radius:5px}
.bub.b{align-self:flex-start;background:var(--card);border-bottom-left-radius:5px}
.scard{background:var(--card);border-radius:24px;padding:16px 18px;display:grid;gap:10px;flex:0 1 auto;min-height:0;overflow-y:auto}
.dock,.acts,.shead,.sinfo,.sstage{flex:none}
.who{display:flex;align-items:center;gap:8px;font-weight:800;font-family:var(--round);font-size:.95rem}
.who i{width:10px;height:10px;border-radius:50%;background:currentColor}
.who em{margin-left:auto;font-style:normal;font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--sub)}
.en{font-family:var(--round);font-weight:900;font-size:clamp(1.55rem,7vw,2.2rem);line-height:1.1;letter-spacing:-.01em}
.en.hide{font-family:var(--text);font-weight:600;font-size:1.1rem;color:var(--sub)}
.kv{display:grid;grid-template-columns:88px 1fr;gap:4px 10px;align-items:baseline}
.kv .k{font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--sub)}
.kv .pr{font-style:italic;font-size:1.15rem;color:var(--emily);font-weight:600}
.kv .es{font-size:1.02rem}
.spacer{flex:1 1 0;min-height:0}
.fb{border-radius:14px;padding:10px 14px;font-weight:600}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--ink);font-weight:500}
.fb.bad mark{background:none;color:var(--bad);font-weight:800;text-decoration:underline}
.dock{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:22px;padding:12px 14px}
.orb{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--sub);flex:none;position:relative;transition:background .2s}
.orb svg{width:28px;height:28px}
.orb{width:72px;height:72px;cursor:pointer}
.orb svg{width:32px;height:32px}
.orb.ready{background:var(--stan);color:#fff;box-shadow:0 0 0 6px var(--stan-soft)}
.orb.ready::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--stan);animation:ping 1.8s ease-out infinite}
.orb.listen{background:var(--bad);color:#fff}
.orb.listen::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--bad);animation:ping 1s ease-out infinite}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acts button{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 6px;border-radius:12px;background:var(--card);font-weight:700;font-size:.88rem}
.acts button svg{width:18px;height:18px}
.tbar{display:flex;gap:8px;align-items:center}
.tbar input{flex:1;min-width:0;padding:9px 12px}
.tbar button{background:var(--brain);color:#fff;font-weight:800;padding:9px 14px;border-radius:10px}
.hints{display:grid;gap:8px}
.hint{background:var(--card2);border-radius:14px;padding:10px 12px;display:grid;gap:2px}
.hint .e{font-weight:800} .hint .s{color:var(--sub);font-size:.9rem} .hint .r{color:var(--emily);font-style:italic;font-size:.9rem}
.orb.speak{background:var(--emily);color:#fff}
.orb.ok{background:var(--ok);color:#fff}
.orb.bad{background:var(--bad);color:#fff}
.orb.think{background:var(--brain);color:#fff}
.dock .t{flex:1;min-width:0}
.dock .st{font-weight:800;font-family:var(--round)}
.dock .heard{color:var(--sub);font-size:.92rem;overflow-wrap:anywhere;min-height:1.3em}
.cmds{text-align:center;font-size:.78rem;color:var(--sub)}
.cmds b{color:var(--ink)}
.win{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 85%,transparent);z-index:5;animation:fade .25s}
.win div{text-align:center;display:grid;gap:8px;justify-items:center;padding:24px}
.win b{font-family:var(--round);font-size:2rem;font-weight:900}
.win .xp{color:var(--flame);font-family:var(--round);font-weight:900;font-size:1.3rem}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------- hojas ---------- */
.sheetbg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;display:grid;gap:14px;
  padding:10px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--fill);justify-self:center}
.sheet h3{font-size:1.4rem;font-weight:900}
@keyframes up{from{transform:translateY(40%)}to{transform:none}}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;animation:fade .2s;max-width:90vw;text-align:center}
.wake{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--bg) 90%,transparent);display:grid;place-items:center;padding:24px}
.wake div{max-width:380px;display:grid;gap:14px;text-align:center}
.link{color:var(--sub);text-decoration:underline;padding:6px;font-size:.9rem}
.warn{background:var(--bad-soft);border-radius:14px;padding:12px 14px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>

<div id="app"></div>
<nav class="tabs" id="tabs"></nav>

<script>
/* =====================================================================
   1. CONTENIDO  —  quién | inglés | español | cómo se lee
   A = Stanley (tú) · B = Emily
   ===================================================================== */
const STAGES=[
 {id:"p",n:"Palabras",d:"Pedacitos que los nativos dicen todo el día",c:"--flame"},
 {id:"v",n:"Verbos",d:"Los verbos clave, como suenan de verdad",c:"--emily"},
 {id:"e",n:"Estructuras",d:"Una estructura a la vez, hasta dominarla",c:"--stan"},
 {id:"j",n:"Juntar todo",d:"Todo mezclado en pláticas reales",c:"--brain"},
 {id:"c",n:"Pila de conversación",d:"Plática tras plática: exposición pura",c:"--ok"}];
const UNITS=[];
function U(id,t,s,n,txt){UNITS.push({id,t,s,n,stage:id[0],l:txt.trim().split("\n").map(r=>r.trim().split("|"))})}

function parsePhrases(body){
  const out=[];
  body.split(/\n+/).forEach(raw=>{let s=raw.trim().replace(/^[-*•\d.)\s]+/,"").replace(/\[\[|\]\]/g,"");if(!s||s.startsWith("#"))return;
    if(s.includes("|")){const p=s.split("|").map(x=>x.trim());if(/[a-z]/i.test(p[0]))out.push(["A",p[0],p[1]||"",p[2]||autoPron(p[0])]);return}
    const m=s.match(/^(.+?)\s(?:=|—|–|->)\s(.+)$/);if(m&&/^[\x00-\x7F]+$/.test(m[1])){out.push(["A",m[1].trim(),m[2].trim(),autoPron(m[1])]);return}
    if(/[áéíóúñ¿¡]/i.test(s))return;
    s.split(/(?<=[.!?])\s+/).forEach(x=>{x=x.trim();const n=x.split(/\s+/).length;if(n<=16&&/[a-z]/i.test(x))out.push(["A",x,"",autoPron(x)])});
  });
  return out.slice(0,40);
}

      if(useAI){btn.textContent="Emily está leyendo tu nota…";
        try{const r=await aiJSON(`You help Stanley, a Mexican Spanish speaker, learn to SPEAK casual American English by voice.
He saved this note in his "English brain" (it may be in Spanish, English or both; it may hold grammar structures, vocabulary or phrases):
"""${body.slice(0,6000)}"""
Turn it into 6 to 14 short spoken practice lines (max 12 words each) that a native American would really say, using contractions (I'm, you're, gonna, wanna, gotta, don't, can't). Keep the note's own phrases when they are already natural.
Return JSON: {"phrases":[{"en":"...","es":"Mexican Spanish translation","pr":"pronunciation ${PRON_RULE}"}],"topics":["2 to 5 short keywords in English that this note is about"]}`);
          if(r&&Array.isArray(r.phrases)&&r.phrases.length){phrases=r.phrases.filter(p=>p&&p.en).slice(0,20).map(p=>["A",String(p.en),String(p.es||""),String(p.pr||autoPron(String(p.en)))]);topics=(r.topics||[]).map(String).slice(0,6)}
        }catch(e){toast(aiErr(e))}}

      const rec={id:n.id||("n"+Date.now()),title,body,phrases:phrases.map(p=>{p[4]="nota:"+title;return p}),topics,created:n.created||Date.now(),updated:Date.now()};

    };
  });

let G={nodes:[],edges:[],raf:0,cam:{x:0,y:0,k:1},sel:null,heat:1};
function buildGraph(){
  const old=Object.fromEntries(G.nodes.map(n=>[n.id,n])),nodes=[],edges=[],ix={};
  const add=(id,type,label,color,r,data)=>{const o=old[id];const n={id,type,label,color,r,data,x:o?o.x:(Math.random()-.5)*300,y:o?o.y:(Math.random()-.5)*300,vx:0,vy:0};ix[id]=n;nodes.push(n);return n};
  const link=(a,b,len)=>{if(ix[a]&&ix[b]&&a!==b)edges.push({a:ix[a],b:ix[b],len})};
  STAGES.forEach((S,i)=>{const n=add("s:"+S.id,"stage",S.n,"--stan",17,S);if(!old[n.id]){const ang=i/STAGES.length*Math.PI*2;n.x=Math.cos(ang)*150;n.y=Math.sin(ang)*150}});
  STAGES.forEach((S,i)=>{if(i)link("s:"+STAGES[i-1].id,"s:"+S.id,150)});
  UNITS.forEach(u=>{const fails=u.l.map(l=>DB.items[l[1].toLowerCase()]).filter(Boolean).reduce((s,x)=>s+(x.box<3?x.fail:0),0);
    add("u:"+u.id,"unit",u.stage==="j"||u.stage==="c"?u.t:u.s,isDone(u.id)?(fails?"--flame":"--ok"):fails?"--bad":"--sub",9,u);link("s:"+u.stage,"u:"+u.id,60)});
  Object.entries(DB.words).filter(([w])=>w.length>2).sort((a,b)=>(b[1].miss*3+b[1].ok)-(a[1].miss*3+a[1].ok)).slice(0,36).forEach(([w,s])=>{
    add("w:"+w,"word",w,s.miss>s.ok/3?"--bad":"--ok",4+Math.min(5,s.miss),s);
    UNITS.filter(u=>u.l.some(l=>norm(l[1]).includes(w))).slice(0,3).forEach(u=>link("u:"+u.id,"w:"+w,48))});
  DB.notes.forEach(n=>{add("n:"+n.id,"note",n.title,"--brain",11,n);
    [...linksOf(n.body),...(n.topics||[])].map(x=>x.toLowerCase()).forEach(k=>{const hit=nodes.find(m=>m.id!=="n:"+n.id&&(m.label.toLowerCase()===k||(k.length>3&&m.label.toLowerCase().includes(k))));if(hit)link("n:"+n.id,hit.id,70)});
    n.phrases.forEach(p=>norm(p[1]).forEach(w=>{if(ix["w:"+w])link("n:"+n.id,"w:"+w,55)}));
    if(!edges.some(e=>e.a.id==="n:"+n.id||e.b.id==="n:"+n.id))link("n:"+n.id,"s:c",120)});
  G.nodes=nodes;G.edges=edges;G.heat=1;G.sel=null;
}
function startGraph(){

  const dpr=window.devicePixelRatio||1,box=cv.getBoundingClientRect();cv.width=box.width*dpr;cv.height=box.height*dpr;
  const ctx=cv.getContext("2d"),css=getComputedStyle(document.documentElement),col=v=>css.getPropertyValue(v).trim()||"#888";
  const W=box.width,H=box.height;let drag=null,pan=null,moved=0,pinch=null;const pts=new Map();
  const toWorld=(px,py)=>({x:(px-W/2-G.cam.x)/G.cam.k,y:(py-H/2-G.cam.y)/G.cam.k});
  const hit=(px,py)=>{const p=toWorld(px,py);let best=null,bd=1e9;G.nodes.forEach(n=>{const d=Math.hypot(n.x-p.x,n.y-p.y);if(d<n.r+12/G.cam.k&&d<bd){bd=d;best=n}});return best};
  const pos=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  cv.onpointerdown=e=>{try{cv.setPointerCapture(e.pointerId)}catch(x){}const [px,py]=pos(e);pts.set(e.pointerId,{px,py});
    if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.px-b.px,a.py-b.py)||1,k:G.cam.k};drag=null;pan=null;return}
    moved=0;const n=hit(px,py);if(n){drag=n;G.heat=Math.max(G.heat,.5)}else pan={px,py,x:G.cam.x,y:G.cam.y}};
  cv.onpointermove=e=>{const [px,py]=pos(e);if(pts.has(e.pointerId))pts.set(e.pointerId,{px,py});
    if(pinch&&pts.size===2){const [a,b]=[...pts.values()];G.cam.k=Math.max(.35,Math.min(3,pinch.k*Math.hypot(a.px-b.px,a.py-b.py)/pinch.d));return}
    if(drag){const p=toWorld(px,py);moved+=Math.abs(drag.x-p.x)+Math.abs(drag.y-p.y);drag.x=p.x;drag.y=p.y;drag.vx=drag.vy=0;G.heat=Math.max(G.heat,.4)}
    else if(pan){moved+=Math.abs(px-pan.px-(G.cam.x-pan.x))+Math.abs(py-pan.py-(G.cam.y-pan.y));G.cam.x=pan.x+px-pan.px;G.cam.y=pan.y+py-pan.py}};
  cv.onpointerup=cv.onpointercancel=e=>{const [px,py]=pos(e);pts.delete(e.pointerId);if(pinch){if(pts.size<2)pinch=null;drag=null;pan=null;return}
    if(moved<8&&e.type==="pointerup"){const n=hit(px,py);G.sel=n;showNode(n)}drag=null;pan=null};
  cv.onwheel=e=>{e.preventDefault();G.cam.k=Math.max(.35,Math.min(3,G.cam.k*(e.deltaY<0?1.1:.9)))};
  $("#zi").onclick=()=>G.cam.k=Math.min(3,G.cam.k*1.25);$("#zo").onclick=()=>G.cam.k=Math.max(.35,G.cam.k/1.25);

  function physics(){
    const N=G.nodes,h=G.heat;
    if(h>.02){for(let i=0;i<N.length;i++){const a=N[i];for(let j=i+1;j<N.length;j++){const b=N[j];let dx=a.x-b.x,dy=a.y-b.y;const d2=dx*dx+dy*dy+.01;if(d2>90000)continue;const f=900/d2;dx*=f;dy*=f;a.vx+=dx;a.vy+=dy;b.vx-=dx;b.vy-=dy}}
      G.edges.forEach(e=>{const dx=e.b.x-e.a.x,dy=e.b.y-e.a.y,d=Math.hypot(dx,dy)||1,f=(d-e.len)*.02,fx=dx/d*f,fy=dy/d*f;e.a.vx+=fx;e.a.vy+=fy;e.b.vx-=fx;e.b.vy-=fy});
      N.forEach(n=>{n.vx-=n.x*.004;n.vy-=n.y*.004;if(n!==drag){n.x+=Math.max(-8,Math.min(8,n.vx*h));n.y+=Math.max(-8,Math.min(8,n.vy*h))}n.vx*=.82;n.vy*=.82});
      G.heat*=.993}}
  for(let i=0;i<260;i++){physics();G.heat=Math.max(G.heat,.6)}
  {let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;G.nodes.forEach(n=>{x0=Math.min(x0,n.x);x1=Math.max(x1,n.x);y0=Math.min(y0,n.y);y1=Math.max(y1,n.y)});
   G.cam.k=Math.max(.35,Math.min(1.4,Math.min((W-40)/((x1-x0)||1),(H-50)/((y1-y0)||1))));G.cam.x=-(x0+x1)/2*G.cam.k;G.cam.y=-(y0+y1)/2*G.cam.k;G.heat=.3}

    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(W/2+G.cam.x,H/2+G.cam.y);ctx.scale(G.cam.k,G.cam.k);

      const r=n.r*(n===G.sel?1.35:1)+(n.type==="stage"?Math.sin(t*2+n.x)*1:0);ctx.beginPath();ctx.arc(n.x,n.y,r,0,7);ctx.fill();

      if(n.type!=="word"||G.cam.k>1.2||n===G.sel||nb.has(n)){ctx.fillStyle=col("--ink");ctx.font=`${n.type==="stage"?800:600} ${(n.type==="stage"?13:n.type==="word"?10:11)*fs}px -apple-system,Inter,system-ui,sans-serif`;
        ctx.textAlign="center";ctx.fillText(n.label.length>22?n.label.slice(0,21)+"…":n.label,n.x,n.y+r+12*fs)}});

function nodeLines(n){

}

  if(title!==undefined){const x=$("#stt");if(x)x.textContent=title}const c=$("#schat");if(c)c.innerHTML=""}
function setProg(f){const b=$("#sbar");if(b)b.style.width=Math.round(Math.min(1,f)*100)+"%"}
function setOrb(kind,label){const o=$("#sorb");if(!o)return;o.className="orb "+kind;o.innerHTML=kind==="speak"?I.spk:kind==="think"?I.brain:I.mic;$("#sst").textContent=label;
  const h=$("#sheard");if(h&&kind==="ready"&&!h.textContent)h.textContent="Cuando estés listo, toca el botón azul"}
function showHeard(t,partial){const h=$("#sheard");if(h)h.textContent=t?(partial?t+"…":"«"+t+"»"):""}
function showCard(line,mode){const c=$("#scard");if(!c)return;
  const [who,en,es,pr]=line,hide=mode==="recall"&&es,isA=who==="A";
  const task={repeat:"Repite",respond:"Tu turno",recall:"De memoria",listen:"Escucha",free:"Contesta como quieras"}[mode]||"";
  c.innerHTML=`<div class="who" style="color:${isA?"var(--stan)":"var(--emily)"}"><i></i>${isA?"Stanley (tú)":"Emily"}<em>${task}</em></div>
   <div class="en ${hide?"hide":""}">${hide?"¿Cómo se dice en inglés?":esc(en)}</div>
   <div class="kv">${es?`<span class="k">Significa</span><span class="es">${esc(es)}</span>`:""}${hide||!pr?"":`<span class="k">Se lee</span><span class="pr">${esc(pr)}</span>`}</div>`}
function reveal(line){const e=$("#scard .en");if(e){e.className="en";e.textContent=line[1]}const kv=$("#scard .kv");if(kv&&!kv.querySelector(".pr")&&line[3])kv.insertAdjacentHTML("beforeend",`<span class="k">Se lee</span><span class="pr">${esc(line[3])}</span>`)}
function addBubble(who,text){const ch=$("#schat");if(!ch)return;const b=document.createElement("div");b.className="bub "+(who==="A"?"a":"b");b.textContent=text;ch.appendChild(b);ch.scrollTop=ch.scrollHeight}
function feedback(r,msg){const f=$("#sfb");if(!f)return;if(!r&&!msg){f.hidden=true;return}f.hidden=false;
  if(msg){f.className="fb "+(r&&r.ok?"ok":"bad");f.textContent=msg;return}
  if(r.ok){f.className="fb ok";f.textContent=["¡Eso!","¡Perfecto!","¡Así se dice!","¡Muy bien!","¡Como nativo!"][Math.floor(Math.random()*5)];return}
  f.className="fb bad";f.innerHTML=r.heardWords.length?"Casi. Revisa lo marcado: "+r.words.map((w,i)=>r.miss[i]?"<mark>"+esc(w)+"</mark>":esc(w)).join(" "):"No te escuché. Acerca el teléfono o usa audífonos con micrófono."}
async function sayLine(l,t){guard(t);await speak(l[1],l[0]);guard(t)}
async function sayEs(text,t){guard(t);if(V.es)await speak(text,"B","es");guard(t)}

/* un intento hasta que sale bien; devuelve true si salió a la primera */
async function drill(line,mode,t){
  if(mode==="recall"&&!line[2])mode="repeat";
  let first=true,heard=mode==="repeat";
  showCard(line,mode);feedback(null);
  if(mode==="repeat")await sayLine(line,t);
  while(true){
    guard(t);const r=await listen(line[1]);guard(t);
    if(r.cmd){if(r.cmd==="slow"||r.cmd==="help")slowNext=true;if(mode==="recall"){reveal(line);if(r.cmd==="help")first=false}
      if(r.cmd==="help")feedback({ok:true},"Así se dice. Escúchala y dila tú.");showHeard("",false);await sayLine(line,t);heard=true;continue}
    if(!r.text)continue;
    const c=compare(line[1],r.text);feedback(c);record(line,c.ok,c,first);
    if(c.ok){tone(true);setOrb("ok","¡Bien!");cheer(true);await wait(650);guard(t);return first}
    tone(false);setOrb("bad","Otra vez");cheer(false);first=false;if(mode==="recall")reveal(line);
    await wait(600);guard(t);slowNext=heard;await sayLine(line,t);heard=true;
  }
}
function reviewPick(exclude,n){const w=weakItems(n,exclude),d=dueItems(n,exclude.concat(w));return w.concat(d).slice(0,n)}
async function win(title,xp,t){const s=$("#sess");if(!s)return;const w=document.createElement("div");w.className="win";
  w.innerHTML=`<div>${avatar("B")}<b>${esc(title)}</b><span class="xp">+${xp} XP</span></div>`;s.appendChild(w);tone(true);setAv("B","happy");
  await speak("Awesome, Stanley! You got it!","B");guard(t);await wait(900);w.remove()}

async function runUnit(u,t){
  const mine=u.l.filter(l=>l[0]==="A"),total=(u.dlg?3:2)*mine.length+3;let k=0;const tick=()=>setProg(++k/total);
  setPhase("Repaso","",u.s+" · "+u.t);setProg(0);
  const rv=reviewPick(u.l,3);
  if(rv.length){setPhase("Repaso","Primero repasamos lo que <b>se te atora</b> o ya toca repasar.");await sayEs("Primero, repaso.",t);for(const l of rv){await drill(l,"recall",t);tick()}}
  if(u.stage==="c"){
    setPhase("Escucha",u.n);await sayEs("Escucha la plática completa.",t);
    for(const l of u.l){showCard(l,"listen");feedback(null);await sayLine(l,t);addBubble(l[0],l[1]);await wait(250)}
  }else{
    setPhase("Aprende",u.n+(u.dlg?" <b>Emily dice lo suyo; tú repites sólo lo de Stanley.</b>":""));await sayEs(u.dlg?"Escucha a Emily y repite lo de Stanley.":"Repite después de mí.",t);
    const again=[];for(const l of u.l){if(l[0]==="B"){showCard(l,"listen");feedback(null);await sayLine(l,t);await wait(250)}else{const ok=await drill(l,"repeat",t);if(!ok)again.push(l);tick()}addBubble(l[0],l[1])}
    for(const l of again)await drill(l,"repeat",t);
  }
  if(u.dlg){
    setPhase("Practica","Ahora platican. <b>Tú eres Stanley.</b>");await sayEs("Ahora platicamos. Tú eres Stanley.",t);
    for(const l of u.l){if(l[0]==="B"){showCard(l,"listen");feedback(null);await sayLine(l,t);await wait(200)}else{await drill(l,"respond",t);tick()}addBubble(l[0],l[1])}
  }
  let round=0;
  while(true){round++;
    setPhase("Domina","<b>De memoria.</b> Sólo ves el español. Sin errores y la dominas.");
    await sayEs(round===1?"Ahora de memoria. Sin errores y pasas.":"Casi. Otra vez, sin errores.",t);
    let errs=0;
    for(const l of u.l){if(l[0]==="B"){showCard(l,"listen");feedback(null);await sayLine(l,t);await wait(200)}else{if(!await drill(l,"recall",t))errs++;if(round===1)tick()}addBubble(l[0],l[1])}
    if(!errs)break;
  }
  setProg(1);const was=isDone(u.id);DB.units[u.id]={done:true,at:Date.now(),rounds:round};const xp=was?15:50;addXP(xp);save();
  await win(was?"¡Repasada!":"¡Dominaste "+u.s+"!",xp,t);
}
async function runFrom(id,t,single){
  let k=ORDER.indexOf(id);
  while(k<ORDER.length){await runUnit(UNIT[ORDER[k]],t);if(single)return;k++;
    if(k<ORDER.length&&dayOf(ORDER[k])!==dayOf(ORDER[k-1])){
      setPhase("¡Día "+(dayOf(ORDER[k-1])+1)+" completo!","Terminaste el día. Sigue: <b>"+esc(DAYS[dayOf(ORDER[k])].t)+"</b>. Puedes salir con la X o seguir ahorita.");
      await speak("Great job today, Stanley!","B");guard(t);await wait(3000);guard(t)}}
  await pila(t);
}
/* práctica de cualquier lista de frases (notas, palabras, fallas) */
async function deck(lines,title,t){
  lines=lines.filter(l=>l&&l[1]);if(!lines.length)return;
  const n=lines.length;let k=0;
  setPhase("Aprende","",title);await sayEs("Repite después de mí.",t);
  for(const l of lines){await drill(l,"repeat",t);setProg(++k/(n*2))}
  if(lines.some(l=>l[2])){setPhase("Domina","<b>De memoria.</b> Lo que falles vuelve al final.");await sayEs("Ahora de memoria.",t);
    const q=lines.filter(l=>l[2]).sort(()=>Math.random()-.5);let done=0;
    while(q.length){const l=q.shift();if(!await drill(l,"recall",t))q.push(l);else setProg((n+(++done))/(n*2))}}
  setProg(1);addXP(10);save();await win("¡Listo!",10,t);
}
async function refuerzo(t){
  let L=weakItems(8);
  setPhase("Refuerzo","Emily junta lo que <b>se te atora</b> para que te salga solo.","Tus fallas");
  if(aiOn()&&weakWords(1).length){setOrb("think","Emily arma tu práctica…");
    try{const ww=weakWords(6).map(([w])=>w),ws=weakStructs(4).map(([s])=>s);
      const r=await aiJSON(`Stanley, a Mexican Spanish speaker learning to SPEAK casual American English by voice, keeps failing these words: ${ww.join(", ")}${ws.length?" and these structures: "+ws.join(", "):""}.
Write 5 NEW short spoken lines (max 10 words) that a native would say, each using one of those words or structures, with contractions.
Return JSON: {"phrases":[{"en":"...","es":"Mexican Spanish translation","pr":"pronunciation ${PRON_RULE}"}]}`);guard(t);
      if(r&&Array.isArray(r.phrases))L=L.concat(r.phrases.filter(p=>p&&p.en).slice(0,6).map(p=>["A",String(p.en),String(p.es||""),String(p.pr||autoPron(String(p.en))),"Refuerzo"]))}
    catch(e){if(e===CANCEL)throw e;feedback({ok:false},aiErr(e));await wait(1500)}}
  if(!L.length){setPhase("Sin fallas","Aún no tienes fallas guardadas. ¡Sigue con tu ruta!");await speak("No mistakes to fix yet. Nice!","B");await wait(1500);return}
  await deck(L,"Refuerza tus fallas",t);
}
/* pila de conversación: plática tras plática */
async function pila(t){
  const pool=ORDER.filter(id=>UNIT[id].dlg&&isDone(id));
  if(!pool.length){setPhase("Pila","Primero domina una plática de la ruta (día 4).");await wait(2500);return}
  let n=0,lastId="";
  while(true){let id;do{id=pool[Math.floor(Math.random()*pool.length)]}while(pool.length>1&&id===lastId);lastId=id;const u=UNIT[id];n++;
    setPhase("Pila · plática "+n,"<b>"+esc(u.t)+".</b> Contesta de memoria. Si fallas, te la digo y la repites.",n+(n===1?" plática":" pláticas"));await sayEs("Plática "+n+".",t);
    let k=0;for(const l of u.l){if(l[0]==="B"){showCard(l,"listen");feedback(null);await sayLine(l,t);await wait(200)}else await drill(l,"recall",t);addBubble(l[0],l[1]);setProg(++k/u.l.length)}
    addXP(5);save();await wait(600);
    const w=weakItems(1);if(n%3===0&&w.length){setPhase("Refuerzo rápido","Una frase que se te ha atorado.");await drill(w[0],"recall",t)}
  }
}
/* ===== SECCIÓN LIBRE: tú eliges el tema, Emily te pregunta y tú contestas ===== */
const TOPICS=["Comida","Pizza","Carros","Trabajo","Fútbol","Viajes","Familia","Música","Películas","El gym","Mi día","Dinero"];
function topicSheet(){
  sheet(`<h3>Sección libre</h3><p class="sub">Escribe de qué quieres hablar. Emily te hace preguntas sobre eso y tú le contestas con tu voz. Si no sabes qué decir, toca <b>💡 Ayuda</b>.</p>
   <input type="text" id="tp0" placeholder="Ej. comida, pizza, carros…" value="${esc(DB.settings.topic||"")}">
   <div class="chips">${TOPICS.map(x=>`<button class="chip p" data-t="${esc(x)}">${esc(x)}</button>`).join("")}</div>
   <button class="btn pink" id="tgo" style="background:var(--emily)">${I.chat}<span>Empezar a platicar</span></button>`,s=>{
    s.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{s.querySelector("#tp0").value=b.dataset.t});
    s.querySelector("#tgo").onclick=()=>{const tp=s.querySelector("#tp0").value.trim()||"lo que sea";DB.settings.topic=tp;save();closeSheet();start(t=>freeTalk(t,tp))};
  });
}
async function freeTalk(t,topic){
  topic=topic||DB.settings.topic||"lo que sea";
  if(!aiOn()){setPhase("Sección libre","La sección libre necesita la inteligencia. Actívala en <b>Yo → Inteligencia</b>.");await wait(3500);return}
  let newTopic=null,hints=[];const hist=[],ww=weakWords(6).map(([w])=>w);
  setPhase("Sección libre","","Con Emily");
  const n=$("#snote");n.hidden=false;
  n.innerHTML=`<div class="tbar"><span style="font-weight:800;color:var(--ink)">Tema:</span><input type="text" id="tp" value="${esc(topic)}" aria-label="Tema"><button id="tpb">Cambiar</button></div>`;
  const change=()=>{const v=$("#tp").value.trim();if(!v||v===topic)return;newTopic=v;DB.settings.topic=v;save();toast("Cambiamos a: "+v);answer("topic")};
  $("#tpb").onclick=change;$("#tp").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();$("#tp").blur();change()}};
  async function turn(said){
    setOrb("think","Emily está pensando…");
    const r=await aiJSON(`You are Emily, a friendly young American woman chatting BY VOICE with Stanley, a Mexican Spanish speaker who is learning to SPEAK casual American English. He is a beginner.
The topic Stanley chose (he may write it in Spanish): "${topic}". Keep the chat about that topic. Lead the conversation: ask him simple questions about the topic so he has to answer, one question at a time, like a real friendly chat.
${ww.length?"Words he struggles with (use them naturally sometimes): "+ww.join(", ")+".\n":""}Conversation so far:
${hist.slice(-16).join("\n")||"(nothing yet; you start)"}
${said===null?"Start the conversation about the topic with a short greeting and an easy question.":"Stanley's last line came from speech-to-text, so ignore punctuation, capitalization and small recognition glitches."}
Return JSON with these keys:
"ok": ${said===null?"true":"false only if what Stanley said has a real mistake a native would not say; true otherwise"}.
"better": if not ok, the natural native way to say what he meant, with contractions. Empty if ok.
"better_es": Mexican Spanish translation of "better" (empty if ok).
"better_pr": pronunciation of "better" ${PRON_RULE}. Empty if ok.
"reply": your next line: max two SHORT casual sentences, simple everyday words, contractions like a native (I'm, you're, gonna, wanna, gotta), ending with ONE easy question about the topic.
"reply_es": Mexican Spanish translation of "reply".
"reply_pr": pronunciation of "reply" ${PRON_RULE}.
"hints": 3 different short answers Stanley could give to your question (max 10 words each), each as {"en":"...","es":"Mexican Spanish translation","pr":"pronunciation ${PRON_RULE}"}.`);
    guard(t);return r;
  }
  const getTurn=async said=>{while(true){try{return await turn(said)}catch(e){if(e===CANCEL)throw e;if(e&&e.code==="not_granted"){sample=null;if(!aiOn())throw CANCEL}
    if(e&&/bad_key|no_credit|forbidden|no_ai/.test(e.code)){feedback({ok:false},aiErr(e));setOrb("bad","No se pudo conectar con Claude");await wait(6000);throw CANCEL}
    feedback({ok:false},aiErr(e)+" Reintento en un momento…");await wait(3000);guard(t)}}};
  let out=await getTurn(null),k=0;
  while(true){guard(t);
    if(out&&out.ok===false&&out.better){const fix=["A",String(out.better),String(out.better_es||""),String(out.better_pr||autoPron(String(out.better))),"Sección libre"];
      feedback({ok:false},"Un nativo lo diría así. Repítelo:");await drill(fix,"repeat",t);hist.push("(Emily corrected him; he repeated: "+fix[1]+")")}
    const line=["B",String(out&&out.reply||"Cool! Tell me more."),String(out&&out.reply_es||""),String(out&&out.reply_pr||"")];
    hints=Array.isArray(out&&out.hints)?out.hints.filter(h=>h&&h.en).slice(0,3):[];
    showCard(line,"listen");feedback(null);addBubble("B",line[1]);hist.push("Emily: "+line[1]);await sayLine(line,t);
    showCard(line,"free");setProg((++k%10)/10||1);
    let said="";
    while(!said){const r=await listen(null,2600);guard(t);
      if(r.cmd==="topic")break;
      if(r.cmd==="help"){const c=$("#scard");if(c&&!c.querySelector(".hints")){
          const H=hints.length?hints:[{en:"Yeah, I like it a lot.",es:"Sí, me gusta mucho.",pr:"iéa, ái láikit a lát"},{en:"Not really. What about you?",es:"La verdad no. ¿Y tú?",pr:"nát ríli. uát abáut iú"}];
          c.insertAdjacentHTML("beforeend",`<div class="cap">Puedes contestar algo así:</div><div class="hints">${H.map(h=>`<div class="hint"><span class="e">${esc(h.en)}</span><span class="s">${esc(h.es||"")}</span><span class="r">${esc(h.pr||"")}</span></div>`).join("")}</div>`);
          slowNext=true;await speak(String(H[0].en),"A");guard(t)}continue}
      if(r.cmd==="repeat"||r.cmd==="slow"){if(r.cmd==="slow")slowNext=true;await sayLine(line,t);continue}
      said=(r.text||"").trim()}
    if(newTopic){topic=newTopic;newTopic=null;hist.push("(Stanley changed the topic to: "+topic+")");const ch=$("#schat");if(ch)ch.innerHTML="";
      out=await getTurn(null);continue}
    addBubble("A",said);hist.push("Stanley: "+said);addXP(4);save();
    out=await getTurn(said);
  }
}

render();
</script>
