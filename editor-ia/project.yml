name: MiMenteEditor
options:
  bundleIdPrefix: com.mimente
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MiMenteEditor:
    type: application
    platform: iOS
    sources:
      - path: MiMenteEditor
        excludes:
          - "Info.plist"
    info:
      path: MiMenteEditor/Info.plist
      properties:
        CFBundleDisplayName: "Mi Mente"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: "Para elegir el video que quieres editar."
        NSPhotoLibraryAddUsageDescription: "Para guardar tu video editado en Fotos."
        ITSAppUsesNonExemptEncryption: false
        NSSpeechRecognitionUsageDescription: "Para escuchar lo que se dice en tu video y ponerle subtítulos automáticos."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mimente.editor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
