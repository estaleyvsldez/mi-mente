<!doctype html>
<html lang="es">
<head>

<body>
<title>Inglés para Hablar</title>
<style>
/* Curso de inglés — una cosa por pantalla, un botón para avanzar. Tema claro por defecto, oscuro según el sistema. */
:root{
  --bg:#f5f6fa; --card:#ffffff; --ink:#1a2033; --muted:#5d6680; --line:#dfe3ee; --accent:#2f5fe0; --accent-ink:#ffffff;
  --good:#13844f; --good-bg:#e4f5ec; --bad:#c93434; --bad-bg:#fbeaea;
  --c-S:#2563eb; --c-V:#15803d; --c-F:#a16207; --c-O:#7c3aed; --c-NEG:#dc2626; --c-Q:#ea580c;
  --font:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141f; --card:#181e2d; --ink:#e8ecf5; --muted:#97a2bb; --line:#2b3550; --accent:#6d8dff; --accent-ink:#0d1220;
  --good:#46d391; --good-bg:rgba(70,211,145,.13); --bad:#ff7b7b; --bad-bg:rgba(255,123,123,.12);
  --c-S:#6ea2ff; --c-V:#46d391; --c-F:#f2c94c; --c-O:#b892ff; --c-NEG:#ff6b6b; --c-Q:#ff9a55; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141f; --card:#181e2d; --ink:#e8ecf5; --muted:#97a2bb; --line:#2b3550; --accent:#6d8dff; --accent-ink:#0d1220;
  --good:#46d391; --good-bg:rgba(70,211,145,.13); --bad:#ff7b7b; --bad-bg:rgba(255,123,123,.12);
  --c-S:#6ea2ff; --c-V:#46d391; --c-F:#f2c94c; --c-O:#b892ff; --c-NEG:#ff6b6b; --c-Q:#ff9a55; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5}
#app{max-width:640px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 120px max(16px,env(safe-area-inset-right,0px))}
h1{font-size:1.5rem;margin:.2em 0 .4em;text-wrap:balance} h2{font-size:1.2rem;margin:.6em 0 .4em}
p{margin:.4em 0 .8em}
.muted{color:var(--muted)} .small{font-size:.88rem}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top .bar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.top .bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.step-name{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.big-q{font-size:1.25rem;font-weight:600;margin:6px 0 14px}
.sent{font-size:1.2rem;line-height:2.1}
.b{display:inline-block;padding:0 7px;margin:2px;border-radius:7px;border-bottom:3px solid var(--line);font-weight:600}
.b.S{color:var(--c-S);border-color:var(--c-S)} .b.V{color:var(--c-V);border-color:var(--c-V)} .b.F{color:var(--c-F);border-color:var(--c-F)}
.b.O{color:var(--c-O);border-color:var(--c-O)} .b.NEG{color:var(--c-NEG);border-color:var(--c-NEG)} .b.Q{color:var(--c-Q);border-color:var(--c-Q)}
.ex{padding:10px 0;border-bottom:1px solid var(--line)} .ex:last-child{border-bottom:0}
.es{color:var(--muted);font-size:.95rem}
.trick{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--card))}
.trick .t{font-weight:700;color:var(--accent)}
.note{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:.95rem}
.err{text-decoration:line-through;color:var(--bad)} .ok{color:var(--good);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 16px;font:inherit;cursor:pointer;min-height:46px}
.btn:hover{border-color:var(--accent)}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.1rem;width:100%;min-height:56px}
.btn.speak{padding:4px 10px;min-height:34px;font-size:.9rem;margin-left:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.footer{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.footer .inner{max-width:640px;margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:54px;padding:8px;border:2px dashed var(--line);border-radius:12px;margin:8px 0}
.chips button{font:inherit;font-size:1.05rem;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink)}
.chips button.used{visibility:hidden}
.opts{display:flex;flex-direction:column;gap:10px}
.opts button{font:inherit;text-align:left;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:1.05rem}
.opts button.right{border-color:var(--good);background:var(--good-bg)} .opts button.wrong{border-color:var(--bad);background:var(--bad-bg)}
input[type=text],textarea{width:100%;font:inherit;font-size:1.1rem;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
textarea{min-height:90px}
.res{margin-top:12px;padding:12px;border-radius:12px}
.res.good{background:var(--good-bg);border:1px solid var(--good)} .res.bad{background:var(--bad-bg);border:1px solid var(--bad)}
.map{display:flex;flex-direction:column;gap:6px}
.map .row{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px}
.map .row.now{background:color-mix(in srgb,var(--accent) 12%,var(--card));font-weight:700}
.map .n{flex:0 0 34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);font-size:.85rem}
.map .done .n{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.stage{margin-top:12px;font-weight:700}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1;min-width:120px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:1.4rem}
.save{font-size:.8rem;color:var(--muted);text-align:right}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* frases con pronunciación y conversación A/B */
.say{padding:10px 0;border-bottom:1px solid var(--line)} .say:last-child{border-bottom:0}
.say .pr{font-size:1rem;color:var(--accent);font-weight:600;margin-top:2px}
.say .es{margin-top:2px}
.say.big .sent{font-size:1.4rem} .say.big .pr{font-size:1.15rem}
.lb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.lb .btn.speak{margin-left:0}
.mic{margin-top:10px}
.mic-btn{width:100%;min-height:52px;font-weight:700;border:2px solid var(--accent);color:var(--accent)}
.conv{display:flex;flex-direction:column;gap:10px}
.bubble{border-radius:14px;padding:6px 12px 10px;max-width:92%}
.bubble.a{background:var(--bg);border:1px solid var(--line);align-self:flex-start}
.bubble.b{background:color-mix(in srgb,var(--accent) 9%,var(--card));border:1px solid var(--accent);align-self:flex-end;width:92%}
.bubble .say{border-bottom:0}
.who{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.big-es{font-size:1.15rem;font-weight:600;color:var(--ink);margin:6px 0}

/* conversación por voz */
.status{min-height:1.4em;margin:6px 0}
.fb{margin-top:6px;font-size:.95rem}
.better{margin-top:6px;padding:6px 10px;border-radius:10px;background:var(--card);border:1px dashed var(--good)}
.sugs{display:flex;flex-direction:column;gap:6px;margin:6px 0 10px}
.sug{border:1px dashed var(--accent);border-radius:12px;padding:2px 10px}
.bubble.live{opacity:.8;border-style:dashed}
.typebox{margin-top:10px} .typebox input{margin:6px 0}

/* conversación paso a paso */
.bubble.a.now{max-width:100%;width:100%;border:2px solid var(--line)}
.answer{margin-top:6px}
.live-text{min-height:64px;padding:12px;border-radius:12px;border:2px dashed var(--line);font-size:1.15rem;color:var(--muted)}
.live-text.on{border-color:var(--accent);color:var(--ink)}
.small-link{border:0;background:none;color:var(--accent);padding:6px 0;min-height:0;font-size:.9rem}
.kbmic{font-size:.95rem;margin:4px 0 8px}
textarea.resp{font-size:1.2rem;min-height:96px}
.history{margin-top:14px}

/* nota de voz estilo WhatsApp */
.wa-row{display:flex;gap:10px;align-items:stretch}
.wa-row .live-text{flex:1;min-width:0}
.wa-mic{flex:0 0 76px;height:76px;border-radius:50%;border:0;background:#25d366;color:#fff;font-size:2rem;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.wa-mic.rec{background:#e5484d;transform:scale(1.12);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(229,72,77,.25)}}
.wa-hint{margin-top:6px}

</style>
<main id="app"></main>
<div class="footer" id="foot" hidden></div>
<script>
/* STRUCTURAL ENGLISH MEMORY — núcleo
   Registro de contenido, formato de bloques de colores, normalización y verificación de respuestas.
   Funciona en el navegador (window.SEM) y en Node (tools/validate.js) sin dependencias. */
(function (root) {
  'use strict';
  const SEM = root.SEM = root.SEM || {};
  SEM.version = 1;
  SEM.patterns = SEM.patterns || [];
  SEM.dialogues = SEM.dialogues || [];
  SEM.combos = SEM.combos || [];
  SEM.byId = SEM.byId || {};
  SEM.dlgById = SEM.dlgById || {};
  SEM.issues = SEM.issues || [];

  /* ---------- Roles de bloque (asociación por colores) ---------- */
  SEM.ROLES = {
    F: { name: 'Estructura fija', hint: 'La parte que nunca cambia: el molde.' },
    S: { name: 'Persona / sujeto', hint: 'Quién hace o quién es.' },
    V: { name: 'Acción (verbo)', hint: 'Lo que se hace.' },
    N: { name: 'Cosa / sustantivo', hint: 'Objetos, ideas, personas como cosa.' },
    A: { name: 'Cualidad / estado', hint: 'Cómo es o cómo está algo.' },
    P: { name: 'Lugar', hint: 'Dónde.' },
    T: { name: 'Tiempo', hint: 'Cuándo, cuánto tiempo, con qué frecuencia.' },
    Q: { name: 'Palabra de pregunta', hint: 'What, where, how…' },
    C: { name: 'Conector', hint: 'Une ideas: but, so, because…' },
    X: { name: 'Idea completa', hint: 'Una oración entera dentro de otra.' }
  };

  SEM.STAGES = [
    { n: 1, name: 'Etapa 1 · Inicial', desc: 'Palabras, bloques y oraciones sencillas.' },
    { n: 2, name: 'Etapa 2 · Elemental', desc: 'Necesidades, deseos, acciones, preguntas y respuestas.' },
    { n: 3, name: 'Etapa 3 · Intermedia', desc: 'Combinación de estructuras y conversaciones básicas.' },
    { n: 4, name: 'Etapa 4 · Intermedia avanzada', desc: 'Descripciones, experiencias, explicaciones y conversaciones completas.' },
    { n: 5, name: 'Etapa 5 · Avanzada', desc: 'Opiniones, argumentos, matices y expresiones naturales.' },
    { n: 6, name: 'Etapa 6 · Espontánea', desc: 'Conversaciones espontáneas y comunicación avanzada.' }
  ];
  /* Colores estructurales: azul sujeto · verde acción · amarillo bloque estructural ·
     morado complemento · rojo negación · naranja preguntas y conectores. */
  SEM.COLOR_OF = { S: 'S', V: 'V', F: 'F', N: 'O', A: 'O', P: 'O', T: 'O', X: 'O', Q: 'Q', C: 'Q' };
  SEM.COLOR_NAMES = { S: 'Sujeto', V: 'Acción', F: 'Bloque estructural', O: 'Complemento', NEG: 'Negación', Q: 'Pregunta / conector' };
  const NEG_RE = /\b(not|never|no|don't|doesn't|didn't|can't|won't|isn't|aren't|wasn't|weren't|haven't|hasn't|hadn't|shouldn't|wouldn't|couldn't|mustn't|nobody|nothing|nowhere)\b/i;
  const Q_RE = /^(what|where|when|why|who|whose|which|how(?: much| many| long| often| old| far)?)\b/i;
  /* Segmentos con su color final: separa negaciones y palabras interrogativas dentro de la estructura fija. */
  const SUBJ_RE = /^(i|you|he|she|we|they|it|i'm|you're|he's|she's|we're|they're|it's|i've|you've|we've|they've|i'll|you'll|he'll|she'll|we'll|they'll|it'll|i'd|you'd|he'd|she'd|we'd|they'd|there's|there|that's)$/i;
  const AUX_RE = /^(do|does|did|can|could|would|will|should|is|are|was|were|have|has|may|am)$/i;
  SEM.colorSegments = function (m) {
    const out = [];
    const isQuestion = /\?/.test(m);
    let sentStart = true, afterAux = false;
    SEM.parse(m).forEach(s => {
      if (s.r !== 'F') { out.push({ c: SEM.COLOR_OF[s.r] || 'O', t: s.t, r: s.r }); if (s.t.trim()) { sentStart = false; afterAux = s.r === 'Q'; } return; }
      const parts = s.t.split(/(\s+)/);
      let buf = '';
      const flush = () => { if (buf) { out.push({ c: 'F', t: buf, r: 'F' }); buf = ''; } };
      parts.forEach(w => {
        if (!w) return;
        if (/^\s+$/.test(w)) { buf += w; return; }
        const bare = w.replace(/[^A-Za-z']/g, '');
        const lead = /^[.!?]/.test(w);
        if (lead) sentStart = true;
        if (bare && NEG_RE.test(bare) && bare.replace(NEG_RE, '') === '') { flush(); out.push({ c: 'NEG', t: w, r: 'F' }); afterAux = false; }
        else if (bare && (sentStart || afterAux) && SUBJ_RE.test(bare)) { flush(); out.push({ c: 'S', t: w, r: 'F' }); afterAux = false; }
        else if (bare && sentStart && (Q_RE.test(bare) && bare.replace(Q_RE, '') === '' || (isQuestion && AUX_RE.test(bare)))) { flush(); out.push({ c: 'Q', t: w, r: 'F' }); afterAux = true; }
        else { buf += w; afterAux = false; }
        sentStart = /[.!?]$/.test(w);
      });
      flush();
    });
    return out;
  };


  SEM.REGISTERS = {
    informal: { name: 'Informal', desc: 'Con amigos, familia, mensajes. Natural y relajado.' },
    neutro: { name: 'Neutro', desc: 'Funciona casi en cualquier situación.' },
    formal: { name: 'Formal', desc: 'Trabajo, desconocidos, correos, atención al cliente.' },
    coloquial: { name: 'Coloquial', desc: 'Muy de calle. Úsalo solo con confianza.' },
    contexto: { name: 'Depende del contexto', desc: 'Puede sonar bien o raro según con quién y cómo.' }
  };

  /* ---------- Formato de bloques ----------
     "I want to [V:go home] [T:tonight]."  → segmentos con rol.
     "[V:___]" es un hueco para sustituir. Texto sin corchetes = estructura fija (F). */
  const SEG_RE = /\[([A-Z]):([^\]]*)\]/g;

  SEM.parse = function (m) {
    const out = [];
    let last = 0, r;
    SEG_RE.lastIndex = 0;
    while ((r = SEG_RE.exec(m))) {
      if (r.index > last) out.push({ r: 'F', t: m.slice(last, r.index) });
      out.push({ r: r[1], t: r[2] });
      last = r.index + r[0].length;
    }
    if (last < m.length) out.push({ r: 'F', t: m.slice(last) });
    return out;
  };

  SEM.plain = function (m) {
    return String(m).replace(SEG_RE, '$2').replace(/\s+/g, ' ').trim();
  };

  SEM.slotRole = function (tpl) {
    const r = /\[([A-Z]):___\]/.exec(tpl);
    return r ? r[1] : null;
  };

  /* Sustituye el hueco ___ del molde por un valor. */
  SEM.fill = function (tpl, value) {
    return tpl.replace(/\[([A-Z]):___\]/, (all, role) => '[' + role + ':' + value + ']');
  };
  SEM.fillEs = function (tpl, value) {
    return tpl.replace('[___]', value);
  };

  /* Bloques para reconstrucción. fine=true divide la estructura fija en palabras. */
  SEM.chunks = function (m, fine) {
    const out = [];
    const push = (t, c, r) => {
      // la puntuación inicial pertenece al bloque anterior («. Can» → «…» + «Can»)
      const lead = /^([.,!?;:]+)\s*/.exec(t);
      if (lead && out.length) { out[out.length - 1].t += lead[1]; t = t.slice(lead[0].length); }
      t = t.trim();
      if (!t) return;
      if (/^[.,!?;:]+$/.test(t)) { if (out.length) out[out.length - 1].t += t; else out.push({ r, c, t }); return; }
      out.push({ r, c, t });
    };
    SEM.colorSegments(m).forEach(s => {
      const t = s.t;
      if (!t.trim()) return;
      if (s.r === 'F' && s.c === 'F') {
        // dividir por oraciones y después en grupos de 1-2 palabras
        const words = t.trim().split(/\s+/);
        if (fine || words.length > 3) { const size = fine ? 1 : 2; for (let i = 0; i < words.length; i += size) push(words.slice(i, i + size).join(' '), 'F', 'F'); }
        else push(t, 'F', 'F');
      } else push(t, s.c, s.r);
    });
    return out;
  };


  /* ---------- Normalización para comparar respuestas ---------- */
  const CONTRACTIONS = [
    [/\bi'm\b/g, 'i am'], [/\bcan't\b/g, 'cannot'], [/\bcan not\b/g, 'cannot'], [/\bwon't\b/g, 'will not'],
    [/\bshan't\b/g, 'shall not'], [/\bain't\b/g, 'is not'], [/\blet's\b/g, 'let us'],
    [/\bwanna\b/g, 'want to'], [/\bgonna\b/g, 'going to'], [/\bgotta\b/g, 'got to'], [/\bkinda\b/g, 'kind of'],
    [/\bdunno\b/g, 'do not know'], [/\bgimme\b/g, 'give me'], [/\blemme\b/g, 'let me'], [/\by'all\b/g, 'you all'],
    [/\b(\w+)n't\b/g, '$1 not'], [/\b(\w+)'re\b/g, '$1 are'], [/\b(\w+)'ve\b/g, '$1 have'],
    [/\b(\w+)'ll\b/g, '$1 will'], [/\b(\w+)'d\b/g, '$1 would'],
    [/\b(he|she|it|that|what|where|who|there|here|how|when|this)'s\b/g, '$1 is'],
    [/\bok\b/g, 'okay'], [/\bo\.k\.?\b/g, 'okay'],
    /* contracciones escritas sin apóstrofo (muy frecuente al teclear rápido) */
    [/\b(do|does|did|is|are|was|were|has|have|had|could|would|should)nt\b/g, '$1 not'], [/\bcant\b/g, 'cannot'],
    [/\bim\b/g, 'i am'], [/\b(you|they|we)re\b/g, '$1 are'], [/\b(that|what|it)s\b/g, '$1 is'], [/\bive\b/g, 'i have'], [/\bid\b/g, 'i would']
  ];
  SEM.norm = function (s) {
    let t = String(s || '').toLowerCase()
      .replace(/[’‘`´]/g, "'").replace(/[“”]/g, '"')
      .replace(/\[([A-Z]):([^\]]*)\]/gi, '$2');
    CONTRACTIONS.forEach(([re, rep]) => { t = t.replace(re, rep); });
    t = t.replace(/[^a-z0-9'\s-]/g, ' ').replace(/-/g, ' ').replace(/'/g, '').replace(/\s+/g, ' ').trim();
    return t;
  };

  function lev(a, b) {
    const m = a.length, n = b.length;
    if (!m) return n; if (!n) return m;
    let prev = new Array(n + 1), cur = new Array(n + 1);
    for (let j = 0; j <= n; j++) prev[j] = j;
    for (let i = 1; i <= m; i++) {
      cur[0] = i;
      for (let j = 1; j <= n; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      [prev, cur] = [cur, prev];
    }
    return prev[n];
  }
  SEM.lev = lev;

  /* Diff por palabras (LCS) para mostrar qué falta o sobra. */
  SEM.wordDiff = function (given, target) {
    const a = SEM.norm(given).split(' ').filter(Boolean);
    const b = SEM.norm(target).split(' ').filter(Boolean);
    const m = a.length, n = b.length;
    const L = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
    for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--)
      L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    const out = []; let i = 0, j = 0;
    while (i < m && j < n) {
      if (a[i] === b[j]) { out.push({ k: 'ok', w: a[i] }); i++; j++; }
      else if (L[i + 1][j] >= L[i][j + 1]) { out.push({ k: 'extra', w: a[i] }); i++; }
      else { out.push({ k: 'miss', w: b[j] }); j++; }
    }
    while (i < m) out.push({ k: 'extra', w: a[i++] });
    while (j < n) out.push({ k: 'miss', w: b[j++] });
    return out;
  };

  const MINOR = new Set(['a', 'an', 'the', 'some', 'any', 'to', 'on', 'in', 'at', 'of', 'for', 'really', 'just', 'so', 'very', 'please', 'actually', 'oh', 'well', 'yeah', 'yes', 'okay', 'hey', 'hi']);

  /* Verifica una respuesta contra una o varias respuestas válidas.
     Devuelve {grade:'ok'|'almost'|'no', score:0..1, best, diff} */
  SEM.check = function (given, answers) {
    const list = (Array.isArray(answers) ? answers : [answers]).filter(Boolean);
    const g = SEM.norm(given);
    if (!g) return { grade: 'no', score: 0, best: list[0], diff: [] };
    let best = null, bestD = Infinity, bestScore = 0, bestDiff = null;
    for (const ans of list) {
      const t = SEM.norm(ans);
      if (g === t) return { grade: 'ok', score: 1, best: ans, diff: [] };
      const d = lev(g, t);
      const ratio = 1 - d / Math.max(g.length, t.length);
      if (d < bestD) { bestD = d; best = ans; bestScore = ratio; }
    }
    bestDiff = SEM.wordDiff(given, best);
    const wrong = bestDiff.filter(x => x.k !== 'ok');
    const onlyMinor = wrong.length > 0 && wrong.every(x => MINOR.has(x.w));
    // errores de tipeo pequeños: diferencias de 1-2 letras en total
    if (bestD <= 2 && SEM.norm(best).length > 8) return { grade: 'almost', score: 0.8, best, diff: bestDiff, typo: true };
    if (onlyMinor && wrong.length <= 2) return { grade: 'almost', score: 0.7, best, diff: bestDiff };
    return { grade: 'no', score: Math.max(0, bestScore * 0.5), best, diff: bestDiff };
  };

  /* La estructura fija de un patrón, para detectar si una oración libre lo usa. */
  SEM.frameKeys = function (tpl) {
    return SEM.parse(tpl).filter(s => s.r === 'F').map(s => SEM.norm(s.t)).filter(Boolean);
  };
  SEM.usesPattern = function (sentence, p) {
    const s = ' ' + SEM.norm(sentence) + ' ';
    const keys = (p.keys && p.keys.length ? p.keys.map(SEM.norm) : SEM.frameKeys(p.f));
    // Se ignoran palabras sujeto al inicio para permitir cambiar persona (I → she).
    return keys.every(k => {
      const words = k.split(' ').filter(w => !['i', 'you', 'we', 'they', 'he', 'she', 'it'].includes(w) || k.split(' ').length === 1);
      const core = words.join(' ');
      return !core || s.includes(' ' + core + ' ') || s.includes(' ' + k + ' ');
    });
  };

  /* ---------- Registro de contenido ----------
     P(def) registra un patrón. Campos cortos para que la biblioteca sea fácil de ampliar:
       id   identificador único (kebab-case)
       cat  categoría (ver data/categories.js)
       st   etapa 1-5
       reg  registro: informal | neutro | formal | coloquial | contexto
       f    molde con hueco:   'I want to [V:___].'
       es   molde en español:  'Quiero [___].'
       t    título visible:    'I WANT TO + VERB' (opcional; se genera)
       m    para qué sirve
       img  emoji de asociación visual
       sl   banco de sustitución [[en, es], ...]
       ex   ejemplos naturales  [[markup, español, [alternativas válidas]?], ...]
       n    nota de uso
       bad  errores típicos de hispanohablantes [[incorrecto, correcto, por qué], ...]
       alt  otras formas naturales [[molde/ejemplo, diferencia de uso], ...]
       odd  cuándo suena raro (texto)
       dlg  mini intercambio [[hablante, inglés, español], ...] (el usuario hace el turno 'B')
       req  ids que conviene saber antes
       rel  ids relacionados
       tags etiquetas libres
       keys palabras clave obligatorias para reconocer uso libre (opcional)            */
  SEM.P = function (d) {
    const p = Object.assign({ reg: 'neutro', sl: [], ex: [], bad: [], alt: [], tags: [], rel: [], req: [], dlg: null, img: '🧩' }, d);
    if (!p.t) p.t = SEM.title(p.f);
    p.src = p.src || 'core';
    if (SEM.byId[p.id]) { SEM.issues.push('ID duplicado: ' + p.id); return SEM.byId[p.id]; }
    SEM.byId[p.id] = p;
    SEM.patterns.push(p);
    return p;
  };
  SEM.D = function (d) {
    const x = Object.assign({ you: 'B', uses: [], st: 2, src: 'core' }, d);
    if (SEM.dlgById[x.id]) { SEM.issues.push('Diálogo duplicado: ' + x.id); return; }
    SEM.dlgById[x.id] = x;
    SEM.dialogues.push(x);
    return x;
  };
  /* C(def): combinaciones de estructuras. kind: pair | answer | follow | exchange */
  SEM.C = function (d) {
    const x = Object.assign({ kind: 'pair', uses: [], st: 2, src: 'core' }, d);
    SEM.combos.push(x);
    return x;
  };

  SEM.title = function (tpl) {
    const names = { V: 'VERB', N: 'NOUN', A: 'ADJ', P: 'PLACE', T: 'TIME', S: 'PERSON', Q: 'QUESTION', C: 'LINK', X: 'SENTENCE' };
    return SEM.parse(tpl).map(s => {
      if (s.r === 'F') return s.t.replace(/[.?!]+\s*$/, '').toUpperCase();
      if (s.t === '___') return ' + ' + names[s.r] + ' ';
      return s.t.toUpperCase();
    }).join('').replace(/\s+/g, ' ').replace(/^\s*\+\s*/, '').trim() + (/\?\s*$/.test(tpl) ? '?' : '');
  };

  /* Todos los ejemplos de un patrón: los escritos a mano + los generados desde el banco. */
  SEM.examples = function (p) {
    return p.ex.map(e => ({ m: e[0], es: e[1], alt: e[2] || [], hand: true }));
  };
  SEM.generated = function (p) {
    if (!p.sl || !p.sl.length || !/___/.test(p.f)) return [];
    return p.sl.map(([en, es]) => ({ m: SEM.fill(p.f, en), es: p.es ? SEM.fillEs(p.es, es) : '', alt: [], slot: en, slotEs: es }));
  };
  SEM.allSentences = function (p) {
    return SEM.examples(p).concat(SEM.generated(p));
  };

  /* Utilidades */
  SEM.shuffle = function (a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  };
  SEM.pick = a => a[Math.floor(Math.random() * a.length)];
  SEM.escape = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  if (typeof module !== 'undefined') module.exports = SEM;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

      ["My number is [N:555-0123].", "Mi número es el 555-0123."],
      ["I'll make sure [S:she] gets it.", "Me aseguraré de que lo reciba."]],
    n: "Los números de teléfono se dicen dígito a dígito; el 0 suele decirse «oh».",
    req: ["can-i-speak-to"], rel: ["call-you-back"] });

  P({ id: "didnt-catch", cat: "telefono", st: 2, img: "👂", tags: ["comprensión", "pedir repetir"],
    f: "Sorry, I didn't catch [N:___].", es: "Perdón, no entendí [___].",
    m: "Pedir que repitan cuando no entiendes (vital al teléfono).",
    sl: [["your name", "tu nombre"], ["that", "eso"], ["the last part", "lo último"], ["the number", "el número"], ["what you said", "lo que dijiste"]],
    ex: [["Sorry, I didn't catch [N:your name].", "Perdón, no entendí tu nombre."],
      ["You're breaking up.", "Se corta la llamada."],
      ["Could you speak up a little?", "¿Podría hablar un poco más alto?"],
      ["Could you repeat that, please?", "¿Podría repetirlo, por favor?"],
      ["Sorry? / Pardon?", "¿Perdón?"]],
    n: "«Catch» = captar/entender lo que alguien dijo. «Speak up» = hablar más alto. Pedir repetición es normal; no lo evites.",
    bad: [["I didn't understand you nothing.", "Sorry, I didn't catch that.", "Doble negación y suena brusco."]],
    req: ["can-you"], rel: ["what-does-mean"] });

  P({ id: "call-you-back", cat: "telefono", st: 2, img: "↩️", tags: ["llamadas"],
    f: "I'll call you back [T:___].", es: "Te devuelvo la llamada [___].",
    m: "Terminar una llamada o prometer otra.",
    sl: [["in five minutes", "en cinco minutos"], ["later", "más tarde"], ["after lunch", "después de comer"], ["when I get home", "cuando llegue a casa"], ["tomorrow morning", "mañana por la mañana"]],
    ex: [["I'm in a meeting. I'll call you back [T:in ten minutes].", "Estoy en una reunión. Te llamo en diez minutos."],
      ["Can I call you back?", "¿Te llamo luego?"],
      ["Sorry I missed your call.", "Perdón por no contestar."],
      ["Thanks for calling.", "Gracias por llamar."],
      ["Talk soon!", "¡Hablamos pronto!"]],
    n: "«Missed call» = llamada perdida. «Call back» = devolver la llamada.",
    req: ["ill"], rel: ["leave-message"] });

  P({ id: "hold-on", cat: "telefono", st: 3, img: "⏸️", tags: ["esperar", "transferir"],
    f: "Can you hold on [T:___]?", es: "¿Puede esperar [___]?",
    m: "Pedir que esperen en la línea.",
    sl: [["a second", "un segundo"], ["a moment", "un momento"], ["one minute", "un minuto"], ["while I check", "mientras lo compruebo"]],
    ex: [["Can you hold on [T:a second]?", "¿Puede esperar un segundo?"],
      ["Please hold.", "No cuelgue, por favor."],
      ["Sorry to keep you waiting.", "Perdón por la espera."],
      ["I'll put you on speaker.", "Te pongo en altavoz."],
      ["Hang on, let me check.", "Espera, déjame mirar."]],
    n: "«Hang on» / «Hold on» = espera (informal). «Hang up» = colgar. ¡No los confundas!",
    bad: [["Wait me a moment.", "Hold on a moment. / Wait a moment.", "«Wait» no lleva objeto directo así."]],
    req: ["can-i-speak-to"], rel: ["can-i-speak-to"] });
})(typeof window !== 'undefined' ? window.SEM : globalThis.SEM);

</script>
<script>
/* Categorías 25-27: conversaciones informales · expresiones coloquiales · conectores */
(function (SEM) {
  const P = SEM.P;

  /* ========== 25. CONVERSACIONES INFORMALES ========== */
  P({ id: "whats-up", cat: "informal", st: 2, img: "🤙", reg: "informal", tags: ["saludos informales"],
    f: "What's up with [N:___]?", es: "¿Qué pasa con [___]?",
    m: "Preguntas informales entre amigos.",
    sl: [["him", "él"], ["the car", "el carro"], ["her today", "ella hoy"], ["all the boxes", "todas las cajas"], ["the printer", "la impresora"]],
    ex: [["Hey, what's up? — Not much, you?", "¿Qué tal? — Nada, ¿y tú?"],
      ["What's up with [N:him]? He seems upset.", "¿Qué le pasa? Parece molesto."],
      ["What's going on?", "¿Qué está pasando?"],
      ["How's it going? — Can't complain.", "¿Qué tal? — No me quejo."]],
    n: "«What's up?» como saludo se responde «Not much» o «Nothing much», no con un informe de tu vida. «What's up with X?» = ¿qué le pasa a X?",
    odd: "Con un cliente o un jefe al que no conoces bien suena demasiado casual.",
    req: ["hows-going"], rel: ["hows-going"] });

  P({ id: "no-big-deal", cat: "informal", st: 3, img: "🫳", reg: "informal", tags: ["restar importancia"],
    f: "It's no big deal.", es: "No es para tanto.",
    m: "Restar importancia a algo.",
    ex: [["Sorry I broke your mug. — It's no big deal.", "Perdón por romper tu taza. — No pasa nada."],
      ["Don't worry about it.", "No te preocupes."],
      ["It's not the end of the world.", "No es el fin del mundo."],
      ["No worries!", "¡Tranquilo!"],
      ["It happens.", "Son cosas que pasan."]],
    n: "Respuestas rápidas a disculpas: No worries / No big deal / Don't worry about it / It's fine / It happens.",
    rel: ["sorry-for"] });

  P({ id: "hang-out", cat: "informal", st: 2, img: "🛹", reg: "informal", tags: ["planes", "phrasal"],
    f: "Do you want to [V:___] later?", es: "¿Quieres [___] luego?",
    m: "Planes informales con amigos.",
    sl: [["hang out", "quedar"], ["come over", "venir a casa"], ["grab a bite", "comer algo"], ["chill at my place", "relajarnos en mi casa"], ["catch a movie", "ver una peli"], ["shoot some hoops", "echar unas canastas"]],
    ex: [["Do you want to [V:hang out] [T:this weekend]?", "¿Quieres quedar este finde?"],
      ["Wanna [V:grab a bite]?", "¿Comemos algo?"],
      ["I'm down!", "¡Me apunto!"],
      ["I'm good, thanks. Maybe next time.", "Paso, gracias. Quizá la próxima."],
      ["Let's play it by ear.", "Lo vamos viendo."]],
    n: "«I'm down» = me apunto (informal). «I'm good» = no, gracias (rechazo amable). «Play it by ear» = improvisar sobre la marcha.",
    odd: "«I'm good» como rechazo confunde a muchos estudiantes: significa «no, gracias».",
    req: ["want-to-go"], rel: ["want-to-go", "we-should"] });

  P({ id: "gonna-wanna", cat: "informal", st: 3, img: "🗣️", reg: "informal", tags: ["pronunciación", "reducciones"],
    f: "I'm gonna [V:___].", es: "Voy a [___].",
    m: "Reconocer y usar las reducciones del habla rápida.",
    sl: [["grab a coffee", "ir por un café"], ["head out", "irme"], ["crash", "irme a dormir"], ["check it out", "echarle un vistazo"], ["take a shower", "bañarme"]],
    ex: [["I'm gonna [V:head out]. See you tomorrow!", "Me voy. ¡Hasta mañana!"],
      ["You wanna [V:come]?", "¿Quieres venir?"],
      ["I gotta [V:go].", "Me tengo que ir."],
      ["Lemme [V:see].", "Déjame ver."],
      ["I dunno.", "No sé."]],
    n: "gonna = going to · wanna = want to · gotta = got to · lemme = let me · dunno = don't know · kinda = kind of. Normal al HABLAR; en escritura formal usa la forma completa.",
    odd: "En correos de trabajo, exámenes o documentos formales, escribe siempre la forma completa.",
    req: ["going-to", "i-want-to"], rel: ["going-to"] });

  P({ id: "you-know-what", cat: "informal", st: 3, img: "😏", reg: "informal", tags: ["discurso", "muletillas"],
    f: "You know what? [X:___].", es: "¿Sabes qué? [___].",
    m: "Introducir una idea, decisión o noticia con naturalidad.",
    sl: [["Let's just go", "Vámonos ya"], ["I'm done", "Ya me cansé"], ["You're right", "Tienes razón"], ["I'll do it myself", "Lo hago yo"], ["I changed my mind", "Cambié de opinión"]],
    ex: [["You know what? [X:Let's just order pizza].", "¿Sabes qué? Pidamos pizza y ya."],
      ["Guess what? [X:I got the job]!", "¿A que no sabes? ¡Me dieron el trabajo!"],
      ["To be honest, [X:I forgot].", "Sinceramente, se me olvidó."],
      ["Actually, [X:I'm free tonight].", "En realidad, estoy libre esta noche."]],
    n: "«Actually» = en realidad (no «actualmente», que es «currently»). Es un falso amigo frecuentísimo.",
    bad: [["Actually I live in Miami. (queriendo decir actualmente)", "Currently I live in Miami. / I live in Miami now.", "«Actually» = en realidad."]],
    rel: ["gonna-wanna"] });

  P({ id: "fillers", cat: "informal", st: 4, img: "💬", reg: "informal", tags: ["fluidez", "muletillas"],
    f: "Well, [X:___].", es: "Bueno, [___].",
    m: "Muletillas para ganar tiempo y sonar natural mientras piensas.",
    sl: [["I'm not sure", "no estoy seguro"], ["it depends", "depende"], ["kind of", "más o menos"], ["that's a good question", "buena pregunta"], ["let me think", "déjame pensar"]],
    ex: [["Well, [X:that's a good question].", "Bueno, buena pregunta."],
      ["Let me think…", "Déjame pensar…"],
      ["I mean, [X:it's not bad].", "O sea, no está mal."],
      ["It's like… [X:hard to explain].", "Es como… difícil de explicar."],
      ["How can I put this?", "¿Cómo te lo explico?"]],
    n: "En vez de quedarte en silencio o decir «eeeh», usa: Well… / Let me think… / I mean… / How can I put this? Dan tiempo sin romper la conversación.",
    rel: ["what-i-mean"] });

  /* ========== 26. EXPRESIONES NATURALES Y COLOQUIALES ========== */
  P({ id: "make-sense", cat: "coloquial", st: 3, img: "💡", tags: ["comprensión"],
    f: "That makes [N:___].", es: "Eso [___].",
    m: "Reacciones naturales al entender o no entender.",
    sl: [["sense", "tiene sentido"], ["no sense", "no tiene sentido"], ["a lot of sense", "tiene mucho sentido"], ["things easier", "facilita las cosas"]],
    ex: [["Oh, that makes sense.", "Ah, tiene sentido."],
      ["Does that make sense?", "¿Se entiende?"],
      ["Got it.", "Entendido."],
      ["I see.", "Ya veo."],
      ["I'm lost.", "Me perdí."]],
    n: "«Does that make sense?» es la forma natural de comprobar si te entendieron (mejor que «Do you understand?», que puede sonar condescendiente).",
    bad: [["That has sense.", "That makes sense.", "«Tener sentido» = make sense."]],
    rel: ["didnt-catch"] });

  P({ id: "piece-of-cake", cat: "coloquial", st: 4, img: "🍰", reg: "coloquial", tags: ["modismos"],
    f: "It was [N:___].", es: "Fue [___].",
    m: "Modismos frecuentes y útiles (no rebuscados).",
    sl: [["a piece of cake", "pan comido"], ["a nightmare", "una pesadilla"], ["a close call", "por los pelos"], ["a long shot", "poco probable"], ["a blessing in disguise", "un mal que vino para bien"]],
    ex: [["The exam was [N:a piece of cake].", "El examen fue pan comido."],
      ["That was a close call!", "¡Eso estuvo cerca!"],
      ["It's a long shot, but let's try.", "Es poco probable, pero intentémoslo."],
      ["Break a leg!", "¡Mucha suerte! (antes de actuar)"],
      ["I'm all ears.", "Soy todo oídos."]],
    n: "Aprende pocos modismos y muy frecuentes. Evita los que suenan anticuados («raining cats and dogs» casi nadie lo dice).",
    odd: "Llenar el discurso de modismos suena forzado; úsalos de vez en cuando.",
    rel: ["no-big-deal"] });

  P({ id: "no-wonder", cat: "coloquial", st: 5, img: "😮", tags: ["inferir"],
    f: "No wonder [X:___].", es: "Con razón [___].",
    m: "Expresar que algo ahora tiene explicación.",
    sl: [["you're tired", "estás cansado"], ["it was so cheap", "era tan barato"], ["she's upset", "está molesta"], ["I couldn't find it", "no lo encontraba"], ["the line is so long", "la fila es tan larga"]],
    ex: [["You worked a double shift? No wonder [X:you're exhausted].", "¿Hiciste doble turno? Con razón estás agotado."],
      ["That explains it.", "Eso lo explica."],
      ["So that's why!", "¡Así que por eso!"],
      ["Makes sense.", "Tiene sentido."]],
    n: "«No wonder» no significa «no maravilla»: equivale a «con razón».",
    bad: [["With reason you're tired.", "No wonder you're tired.", "Calco de «con razón»."]],
    req: ["thats-why"], rel: ["thats-why"] });

  P({ id: "up-to-you", cat: "coloquial", st: 3, img: "🎚️", tags: ["decisiones"],
    f: "It's up to [S:___].", es: "Depende de [___] / decide [___].",
    m: "Decir quién decide.",
    sl: [["you", "ti"], ["them", "ellos"], ["the boss", "el jefe"], ["me", "mí"], ["us", "nosotros"]],
    ex: [["Where do you want to eat? — It's up to you.", "¿Dónde quieres comer? — Tú decides."],
      ["Your call.", "Tú decides."],
      ["Whatever works for you.", "Lo que te venga mejor."],
      ["I'll leave it up to you.", "Lo dejo en tus manos."]],
    n: "«Your call» y «up to you» son útiles para ser flexible sin sonar indiferente («whatever» solo puede sonar despectivo).",
    odd: "«Whatever.» sola, con tono plano, suena despectiva.",
    req: ["depends-on"], rel: ["depends-on"] });

  P({ id: "i-cant-help", cat: "coloquial", st: 5, img: "😅", tags: ["matices"],
    f: "I can't help [V:___].", es: "No puedo evitar [___].",
    m: "Algo que haces sin poder evitarlo.",
    sl: [["laughing", "reírme"], ["thinking about it", "pensar en eso"], ["feeling bad", "sentirme mal"], ["checking my phone", "mirar el teléfono"], ["eating when I'm stressed", "comer cuando estoy estresado"]],
    ex: [["I can't help [V:laughing] when [X:I see that video].", "No puedo evitar reírme cuando veo ese video."],
      ["I couldn't help [V:noticing]…", "No pude evitar fijarme en que…"],
      ["It can't be helped.", "No se puede evitar."],
      ["I can't help it!", "¡No lo puedo evitar!"]],
    n: "can't help + -ing. «I couldn't help noticing…» es una forma elegante de introducir una observación.",
    bad: [["I can't avoid to laugh.", "I can't help laughing.", "Más natural con «help + -ing»."]],
    rel: ["keep-ing"] });

  P({ id: "lowkey", cat: "coloquial", st: 6, img: "🔥", reg: "coloquial", tags: ["jerga actual", "jóvenes"],
    f: "I'm low-key [A:___].", es: "La verdad, estoy medio [___].",
    m: "Jerga actual frecuente entre jóvenes (para entenderla, usar con cuidado).",
    sl: [["obsessed with this song", "obsesionado con esta canción"], ["tired", "cansado"], ["nervous about it", "nervioso por eso"], ["kind of hungry", "con hambre"]],
    ex: [["I'm low-key [A:obsessed with this show].", "La verdad es que estoy medio obsesionado con esta serie."],
      ["That's so random.", "Qué random / qué inesperado."],
      ["It's a vibe.", "Tiene buena onda."],
      ["No cap.", "En serio, sin mentir."],
      ["I'm dead! (de risa)", "¡Me muero de risa!"]],
    n: "Jerga cambiante: útil para ENTENDER series, redes y gente joven. Úsala solo si encaja con quién eres y con quién hablas.",
    odd: "En boca de un adulto en el trabajo puede sonar forzado o fuera de lugar.",
    rel: ["gonna-wanna"] });

  /* ========== 27. CONECTORES PARA UNIR IDEAS ========== */
  P({ id: "because-so", cat: "conectores", st: 1, img: "🔗", tags: ["núcleo", "causa", "consecuencia"],
    f: "I'm tired because [X:___].", es: "Estoy cansado porque [___].",
    m: "Unir causa y consecuencia: because, so.",
    sl: [["I worked all day", "trabajé todo el día"], ["I didn't sleep", "no dormí"], ["the baby cried all night", "el bebé lloró toda la noche"], ["I walked here", "vine caminando"], ["I have two jobs", "tengo dos trabajos"]],
    ex: [["I'm tired [C:because] [X:I didn't sleep well].", "Estoy cansado porque no dormí bien."],
      ["I didn't sleep well, [C:so] [X:I'm tired].", "No dormí bien, así que estoy cansado."],
      ["[C:Because of] [N:the rain], we stayed home.", "Por la lluvia nos quedamos en casa."],
      ["Why? — 'Cause I said so!", "¿Por qué? — ¡Porque lo digo yo!"]],
    n: "BECAUSE + causa · SO + consecuencia · BECAUSE OF + sustantivo. En habla rápida: «'cause».",
    bad: [["Because of I was tired.", "Because I was tired. / Because of the rain.", "«Because of» solo con sustantivo."]],
    rel: ["but-and", "thats-why"] });

  P({ id: "but-and", cat: "conectores", st: 1, img: "➕", tags: ["núcleo", "contraste"],
    f: "I like it, but [X:___].", es: "Me gusta, pero [___].",
    m: "Unir y contrastar ideas: and, but, or.",
    sl: [["it's too expensive", "es demasiado caro"], ["I can't eat it every day", "no lo puedo comer todos los días"], ["it's a little far", "está un poco lejos"], ["I'm not sure", "no estoy seguro"], ["my wife doesn't", "a mi esposa no"]],
    ex: [["It's nice, [C:but] [X:it's a little small].", "Es bonito, pero un poco pequeño."],
      ["I work [T:in the morning] [C:and] I study [T:at night].", "Trabajo por la mañana y estudio por la noche."],
      ["Do you want coffee [C:or] tea?", "¿Quieres café o té?"],
      ["[C:Plus], it's close to my job.", "Además, está cerca del trabajo."]],
    n: "«Plus» = además (informal y muy común). Con «or» en preguntas, la entonación sube en la primera opción y baja en la última.",
    rel: ["because-so", "even-though"] });

  P({ id: "even-though", cat: "conectores", st: 3, img: "🌗", tags: ["concesión"],
    f: "I went even though [X:___].", es: "Fui aunque [___].",
    m: "Concesión: although, even though, even if.",
    sl: [["I was tired", "estaba cansado"], ["it was raining", "estaba lloviendo"], ["nobody else went", "nadie más fue"], ["I didn't want to", "no quería"], ["it was expensive", "era caro"]],
    ex: [["I went to work [C:even though] [X:I was sick].", "Fui a trabajar aunque estaba enfermo."],
      ["[C:Although] [X:it's expensive], it's worth it.", "Aunque es caro, vale la pena."],
      ["I'll go [C:even if] [X:it rains].", "Iré aunque llueva."],
      ["It was cold. I had fun, [C:though].", "Hacía frío. Aun así me divertí."]],
    n: "EVEN THOUGH = aunque (es un hecho). EVEN IF = aunque (hipotético: incluso si). «Though» al final de la frase = aun así (muy natural).",
    bad: [["Although it's expensive, but it's worth it.", "Although it's expensive, it's worth it.", "No se usa «but» después de «although»."]],
    req: ["but-and"], rel: ["but-and", "however"] });

  P({ id: "when-while", cat: "conectores", st: 3, img: "⏲️", tags: ["tiempo"],
    f: "I'll call you [C:___] I get home.", es: "Te llamo [___] llegue a casa.",
    m: "Conectores de tiempo.",
    sl: [["when", "cuando"], ["as soon as", "en cuanto"], ["after", "después de que"], ["before", "antes de que"], ["once", "una vez que"]],
    ex: [["I'll call you [C:as soon as] [X:I get home].", "Te llamo en cuanto llegue a casa."],
      ["I read [C:while] [X:I wait for the bus].", "Leo mientras espero el autobús."],
      ["[C:Before] [X:you leave], turn off the lights.", "Antes de salir, apaga las luces."],
      ["Wait [C:until] [X:I get there].", "Espera hasta que llegue."],
      ["[C:After] [V:eating], we went for a walk.", "Después de comer, fuimos a dar un paseo."]],
    n: "Recuerda: tras estos conectores, presente para futuro (when I get, as soon as I know). Con verbo solo: before/after + -ing.",
    bad: [["Before to leave…", "Before leaving… / Before you leave…", "Después de preposición, -ing."]],
    req: ["when-i-future"], rel: ["when-i-future"] });

  P({ id: "however", cat: "conectores", st: 4, img: "🔄", reg: "formal", tags: ["contraste", "trabajo"],
    f: "It's a good plan. However, [X:___].", es: "Es un buen plan. Sin embargo, [___].",
    m: "Conectores de contraste más formales.",
    sl: [["it's too expensive", "es demasiado caro"], ["we don't have time", "no tenemos tiempo"], ["there are some risks", "hay algunos riesgos"], ["the client disagrees", "el cliente no está de acuerdo"]],
    ex: [["The results were good. [C:However], [X:costs went up].", "Los resultados fueron buenos. Sin embargo, los costos subieron."],
      ["[C:On the other hand], [X:it's faster].", "Por otro lado, es más rápido."],
      ["[C:Instead of] [V:waiting], let's call them.", "En vez de esperar, llamémoslos."],
      ["[C:Otherwise], [X:we'll miss the deadline].", "Si no, no cumpliremos el plazo."]],
    n: "«However» es más típico de escritura o presentaciones; al hablar se usa más «but» o «though». «Otherwise» = si no / de lo contrario.",
    req: ["even-though"], rel: ["but-and"] });

  P({ id: "as-long-as", cat: "conectores", st: 4, img: "📜", tags: ["condición"],
    f: "It's fine as long as [X:___].", es: "Está bien siempre que [___].",
    m: "Condiciones: as long as, unless, in case.",
    sl: [["you're back by ten", "vuelvas antes de las diez"], ["it doesn't cost too much", "no cueste demasiado"], ["you tell me first", "me avises primero"], ["everyone agrees", "todos estén de acuerdo"]],
    ex: [["You can borrow it [C:as long as] [X:you bring it back].", "Te lo presto siempre que me lo devuelvas."],
      ["I'll be there [C:unless] [X:something comes up].", "Allí estaré a menos que surja algo."],
      ["Take an umbrella [C:in case] [X:it rains].", "Lleva paraguas por si llueve."],
      ["[C:Just in case].", "Por si acaso."]],
    n: "UNLESS = a menos que (if… not). IN CASE = por si acaso. Todos van con presente para hablar del futuro.",
    bad: [["Unless it doesn't rain…", "Unless it rains… / If it doesn't rain…", "«Unless» ya es negativo."]],
    req: ["when-while"], rel: ["if-i"] });

  P({ id: "which-means", cat: "conectores", st: 5, img: "🧮", tags: ["consecuencia", "argumentar"],
    f: "The store closes at six, which means [X:___].", es: "La tienda cierra a las seis, lo que significa que [___].",
    m: "Encadenar consecuencias con fluidez.",
    sl: [["we have to hurry", "tenemos que darnos prisa"], ["we can't go after work", "no podemos ir después del trabajo"], ["I'll go tomorrow", "iré mañana"], ["there's no time left", "no queda tiempo"]],
    ex: [["My flight was canceled, [C:which means] [X:I'm stuck here another night].", "Me cancelaron el vuelo, lo que significa que me quedo otra noche."],
      ["[C:That way], [X:we don't waste time].", "Así no perdemos tiempo."],
      ["[C:As a result], [X:prices went up].", "Como resultado, los precios subieron."],
      ["[C:In that case], [X:let's leave now].", "En ese caso, vámonos ya."]],
    n: "«Which» al final puede referirse a toda la frase anterior. «That way» = así / de ese modo, muy oral.",
    req: ["because-so"], rel: ["because-so", "thats-why"] });

<script>
/* Pronunciación del inglés americano escrita con letras del español (parte 1: a-f).
   Claves: j = h inglesa (suave, aspirada) · z = «th» con la lengua entre los dientes · d (en «the, this») = «th» suave
   · v = labio de abajo con los dientes · sh = «sh» · y = «j» inglesa (job = yab) · la tilde marca la sílaba fuerte.

  };

  /* ---------- material de cada lección ---------- */
  const clean = e => !/ \/ |—|\(/.test(plain(e[0])) && plain(e[0]).split(' ').length <= 14;
  function material(p) {
    const ex = p.ex.filter(clean).map(e => ({ m: e[0], es: e[1], alt: e[2] || [] }));
    const all = ex.length ? ex : p.ex.map(e => ({ m: e[0], es: e[1], alt: e[2] || [] }));
    const gen = (p.sl || []).length && /___/.test(p.f) ? p.sl.map(([en, es]) => ({ m: SEM.fill(p.f, en), es: cap(SEM.fillEs(p.es, es)), alt: [] })) : [];
    return { ex: all, gen };
  }
  /* Conversación A/B: la de la estructura si existe; si no, una con la apertura del tema y tus frases. */
  function conversation(p, mat) {
    if (p.dlg && p.dlg.length >= 3) return p.dlg.map(l => ({ who: l[0], en: l[1], es: l[2], alt: l[3] || [] }));
    const op = OPENERS[p.cat] || OPENERS.informal;
    const pool = mat.ex.filter(s => !/\?\s*$/.test(plain(s.m)) || p.cat === 'preguntas').concat(mat.gen);
    const b1 = pool[0] || mat.ex[0], b2 = pool.find(s => s !== b1 && SEM.norm(s.m) !== SEM.norm(b1.m)) || mat.gen[1] || mat.ex[1] || b1;
    return [
      { who: 'A', en: op[0][0], es: op[0][1] },
      { who: 'B', en: plain(b1.m), es: b1.es, alt: b1.alt },
      { who: 'A', en: op[1][0], es: op[1][1] },
      { who: 'B', en: plain(b2.m), es: b2.es, alt: b2.alt },
      { who: 'A', en: op[2][0], es: op[2][1] }
    ];
  }
  /* Guion de respaldo con varias respuestas tuyas: la conversación base + preguntas de seguimiento del tema. */
  function longScript(p, mat, minB) {
    const base = conversation(p, mat);
    const used = new Set(base.filter(l => l.who === 'B').map(l => SEM.norm(l.en)));
    const op = OPENERS[p.cat] || OPENERS.informal;
    const pool = shuffle(mat.gen.concat(mat.ex)).filter(x => !used.has(SEM.norm(x.m)) && !/\?\s*$/.test(plain(x.m)));
    const out = base.slice();
    const closing = out[out.length - 1] && out[out.length - 1].who === 'A' ? out.pop() : { who: 'A', en: op[2][0], es: op[2][1] };
    const follow = [['Oh, really? Tell me more.', '¿Ah, sí? Cuéntame más.'], [op[1][0], op[1][1]], ['Cool. What else?', 'Genial. ¿Qué más?'], ['Interesting!', '¡Interesante!']];
    let k = 0;
    while (out.filter(l => l.who === 'B').length < minB && pool.length) {
      const f = follow[k++ % follow.length]; const x = pool.shift();
      out.push({ who: 'A', en: f[0], es: f[1] }, { who: 'B', en: plain(x.m), es: x.es, alt: x.alt });
    }
    out.push(closing);
    return out;
  }
  function meaningOptions(p, s) {
    const others = shuffle(SEM.patterns.filter(q => q.id !== p.id)).map(q => q.ex.find(clean)).filter(Boolean).filter(e => e[1] !== s.es).slice(0, 2).map(e => e[1]);
    return shuffle([{ t: s.es, ok: true }].concat(others.map(t => ({ t, ok: false }))));
  }

  /* ---------- progreso guardado ---------- */
  let S = { v: 2, next: 0, done: {}, days: [], perDay: {} };
  const Save = {
    ref: null, label: 'Guardado en este navegador', timer: null, busy: false, again: false,
    async init() {
      try { const raw = localStorage.getItem('curso-ingles'); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (_) { /* sin almacenamiento local */ }
      if (!(window.claude && typeof window.claude.use === 'function')) return;
      try {
        const res = await Promise.race([Promise.all([window.claude.use('db'), window.claude.use('user')]), new Promise(r => setTimeout(() => r(null), 9000))]);
        if (!res || !res[0] || !res[1]) return;
        const id = await res[1].id();
        if (!id) return;
        this.ref = res[0].collection('data/users/' + id).doc('curso');
        const snap = await this.ref.get();
        if (snap.exists) { const d = snap.data(); if (d && (d.next || 0) >= (S.next || 0)) S = Object.assign({ v: 2, next: 0, done: {}, days: [], perDay: {} }, JSON.parse(JSON.stringify(d))); }
        this.label = 'Guardado en tu cuenta';
      } catch (_) { this.ref = null; }
    },
    save() {
      try { localStorage.setItem('curso-ingles', JSON.stringify(S)); } catch (_) { /* sin almacenamiento local */ }
      if (!this.ref) return;
      clearTimeout(this.timer);
      this.timer = setTimeout(() => this.flush(), 300);
    },
    async flush() {
      if (this.busy) { this.again = true; return; }
      this.busy = true;
      try { await this.ref.set(JSON.parse(JSON.stringify(S))); this.label = 'Guardado en tu cuenta'; }
      catch (_) { this.label = 'No se pudo guardar en tu cuenta; quedó en este navegador'; }
      this.busy = false;
      if (this.again) { this.again = false; this.flush(); }
      const el = document.getElementById('savelbl'); if (el) el.textContent = this.label;
    }
  };
  function markDay() { const d = today(); if (!S.days.includes(d)) S.days.push(d); if (S.days.length > 400) S.days.shift(); }
  function streak() {
    let n = 0; const d = new Date();
    const key = x => x.getFullYear() + '-' + (x.getMonth() + 1) + '-' + x.getDate();
    if (!S.days.includes(key(d))) d.setDate(d.getDate() - 1);
    while (S.days.includes(key(d))) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  const dueReviews = () => Object.keys(S.done).filter(id => SEM.byId[id] && S.done[id].due <= Date.now()).sort((a, b) => S.done[a].due - S.done[b].due);

  /* ---------- marco de pantalla ---------- */
  function foot(label, action) {
    $foot.innerHTML = '';
    if (!label) { $foot.hidden = true; return; }
    $foot.hidden = false;
    $foot.append(h('div', { class: 'inner' }, h('button', { class: 'btn main', type: 'button', id: 'mainbtn', onclick: action }, label)));
  }
  const appendAll = (el, ...kids) => kids.forEach(k => { if (k != null && k !== false) el.append(k); });
  function screen(...kids) { $app.innerHTML = ''; kids.forEach(k => k && $app.append(k)); window.scrollTo(0, 0); }
  function topbar(i, n, label) {
    return h('div', { class: 'top' }, h('button', { class: 'btn', type: 'button', onclick: home, 'aria-label': 'Salir al inicio' }, '✕'), h('div', { class: 'bar' }, h('i', { style: 'width:' + (i / n * 100) + '%' })), h('span', { class: 'small muted' }, label));
  }

  /* Bloque «Dilo en voz alta»: micrófono si está disponible, si no confirmación propia. Nunca bloquea. */
  function sayIt(target, alts, onResult) {
    const box = h('div', { class: 'mic' });
    const fb = h('div');
    let finished = false;
    if (DICT) {
      const btn = h('button', { class: 'btn mic-btn', type: 'button' }, '🎙️ Pulsa y dilo');
      const mic = { heard: '', end: () => {
        btn.textContent = '🎙️ Decirlo otra vez';
        const r = SEM.check(mic.heard, [plain(target)].concat(alts || []));
        fb.innerHTML = '';
        fb.append(h('div', { class: 'res ' + (r.grade !== 'no' ? 'good' : 'bad') }, h('div', null, 'Te entendí: «' + (mic.heard || '…') + '»'),
          h('b', null, r.grade === 'ok' ? '✓ ¡Muy bien!' : r.grade === 'almost' ? '≈ ¡Casi! Repite la parte que falta.' : 'Inténtalo otra vez escuchando el audio.'),
          h('div', { class: 'small muted' }, 'Si el micrófono te entendió, vas bien. La pronunciación compárala con el audio.')));
        if (!finished && r.grade !== 'no') { finished = true; onResult(true); }
      } };
      btn.addEventListener('click', () => {
        if (activeMic === mic) { try { DICT.stop(); } catch (_) { /* ya parado */ } return; }
        mic.heard = ''; activeMic = mic;
        btn.textContent = '🎙️ Te escucho… (toca para terminar)';
        let p; try { p = DICT.start({ language: 'en-US' }); } catch (e) { p = Promise.reject(e); }
        Promise.resolve(p).catch(() => { activeMic = null; btn.remove(); fb.innerHTML = ''; fb.append(h('p', { class: 'small muted' }, 'No se pudo usar el micrófono. Dila en voz alta y sigue con el botón de abajo.')); });
      });
      box.append(btn);
    } else {
      box.append(h('p', { class: 'small muted' }, '🎙️ Dila en voz alta (ayúdate con la pronunciación) y sigue con el botón de abajo.'));
    }
    box.append(fb);
    return box;
  }

  /* ---------- inicio ---------- */
  function home() {
    const n = S.next;
    const p = COURSE[n];
    const due = dueReviews();
    const t = p ? trickFor(n + 1) : null;
    const todayN = S.perDay[today()] || 0;
    screen(
      h('div', { class: 'top' }, h('b', null, 'Inglés para hablar'), h('div', { class: 'bar' }, h('i', { style: 'width:' + (n / COURSE.length * 100) + '%' })), h('span', { class: 'small muted' }, n + '/' + COURSE.length)),
      p ? h('div', { class: 'card' },
        h('div', { class: 'step-name' }, 'Lección ' + (n + 1) + ' de ' + COURSE.length + ' · Nivel ' + CEFR[p.st - 1]),
        h('h1', null, cap(p.m.replace(/\.$/, ''))),
        h('p', { class: 'muted' }, 'Tema: ' + SEM.catById[p.cat].name + '. Vas a aprender a decir:'),
        line(p.ex.filter(clean)[0] ? p.ex.filter(clean)[0][0] : p.ex[0][0], (p.ex.filter(clean)[0] || p.ex[0])[1], { noAudio: true }),
        due.length ? h('p', { class: 'note' }, 'Antes, un repaso hablado de ' + Math.min(due.length, 5) + ' frases que estás a punto de olvidar.') : null,
        todayN >= 3 ? h('p', { class: 'note' }, 'Hoy ya hiciste ' + todayN + ' lecciones. Puedes seguir, pero descansar ayuda a recordar.') : null)
        : h('div', { class: 'card' }, h('h1', null, '¡Terminaste el curso! 🎉'), h('p', null, 'Sigue con los repasos para no olvidar.')),
      t ? h('div', { class: 'card trick' }, h('div', { class: 't' }, '🧠 Truco de memoria actual: ' + t.n), h('div', null, t.how)) : null,
      h('div', { class: 'stats' },
        h('div', { class: 'stat' }, h('b', null, Object.keys(S.done).length), h('span', { class: 'small muted' }, 'lecciones hechas')),
        h('div', { class: 'stat' }, h('b', null, streak() + ' 🔥'), h('span', { class: 'small muted' }, 'días seguidos')),
        h('div', { class: 'stat' }, h('b', null, due.length), h('span', { class: 'small muted' }, 'repasos pendientes'))),
      h('details', { class: 'card' }, h('summary', null, 'Cómo leer la pronunciación'), h('p', { class: 'small' }, '🗣️ es cómo suena, escrito con letras del español. La tilde marca la parte fuerte. «j» suena como una h suave. «z» se dice con la lengua entre los dientes (como la «th» inglesa). La «r» suave entre vocales es la «t» americana (water = uárer). Las palabras se juntan como al hablar rápido: «want to» suena «uána»; «going to», «góna».')),
      Object.keys(S.done).length ? h('div', { class: 'card' }, h('b', null, '💬 Conversación libre por voz'), h('p', { class: 'small muted' }, 'Habla de tu vida usando todo lo que ya aprendiste. Cuanto más avanzas, menos ayuda verás.'),
        h('button', { class: 'btn', type: 'button', onclick: freeTalk }, 'Hablar ahora')) : null,
      syllabus(),
      h('p', { class: 'save', id: 'savelbl' }, Save.label));
    foot(due.length ? 'Empezar (repaso + lección ' + (n + 1) + ')' : p ? 'Empezar lección ' + (n + 1) : null, () => { if (due.length) review(due.slice(0, 5)); else if (p) lesson(p); });
  }
  function syllabus() {
    const box = h('details', { class: 'card' }, h('summary', null, 'Ver el temario completo (' + COURSE.length + ' lecciones)'));
    const map = h('div', { class: 'map' });
    let st = 0;
    COURSE.forEach((p, i) => {
      if (p.st !== st) { st = p.st; map.append(h('div', { class: 'stage' }, 'Nivel ' + CEFR[st - 1] + ' — ' + SEM.STAGES[st - 1].desc)); }
      const trick = TRICKS.find(t => t.at === i + 1);

      map.append(h('div', { class: 'row' + (S.done[p.id] ? ' done' : '') + (i === S.next ? ' now' : '') }, h('span', { class: 'n' }, S.done[p.id] ? '✓' : i + 1), h('div', null, h('div', null, cap(p.m.replace(/\.$/, ''))), h('div', { class: 'small muted' }, plain(p.f).replace('___', '…')))));
    });
